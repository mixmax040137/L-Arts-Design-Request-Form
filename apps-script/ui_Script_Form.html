<script>
/* =========================================================================
   ui_Script_Form — แบบฟอร์มขอรับบริการออกแบบ 3 ขั้นตอน
   ========================================================================= */
var Form = (function () {
  var cfg = null;
  var step = 1;
  var itemSeq = 0;
  var items = [];        // [{id, mediaType, size, sizeOther, mediaOther, quantity, note}]
  var files = [];        // [{name, size, type, dataB64}]
  var pendingReads = 0;  // จำนวนไฟล์ที่เบราว์เซอร์ยังอ่านไม่เสร็จ
  var channels = [];
  var created = null;    // {jobId, trackToken}
  // ผู้ออกแบบที่ผู้ขอเลือก: null = ยังไม่ได้เลือก (ต้องเลือกก่อนไปขั้นถัดไป)
  // POOL = "ให้ฝ่ายฯ จัดสรรให้" (ตรงกับ DESIGNER_POOL ใน 14_Designers.gs) อื่น ๆ = id ผู้ออกแบบ
  var POOL = 'pool';
  var designerId = null;
  var submitting = false;

  function init(config) {
    cfg = config;
    var deptSelect = document.getElementById('f-dept');
    function deptOption(d) { return '<option value="' + App.esc(d) + '">' + App.esc(d) + '</option>'; }
    // แสดงเป็นกลุ่ม (สาขาวิชา หลักสูตรพิเศษ ศูนย์ สำนักงานคณะ) ถ้าเซิร์ฟเวอร์ส่งกลุ่มมา
    deptSelect.innerHTML = '<option value="">-- เลือกหน่วยงาน --</option>' +
      (cfg.departmentGroups && cfg.departmentGroups.length
        ? cfg.departmentGroups.map(function (g) {
            return '<optgroup label="' + App.esc(g.group) + '">' + g.items.map(deptOption).join('') + '</optgroup>';
          }).join('') + deptOption('อื่น ๆ')
        : cfg.departments.map(deptOption).join(''));

    document.getElementById('f-channels').innerHTML = cfg.channels.map(function (c, i) {
      return '<div class="chip" data-ch="' + App.esc(c) + '" onclick="Form.toggleChannel(this)">' +
        App.esc(c) + '</div>';
    }).join('');

    document.getElementById('file-hint').textContent =
      'รองรับ ' + cfg.settings.allowedFileTypes.split(',').join(', ') +
      ' ขนาดไม่เกิน ' + cfg.settings.maxFileMB + ' MB ต่อไฟล์ สูงสุด ' + cfg.settings.maxFiles + ' ไฟล์';

    document.getElementById('f-due-date').min = App.todayStr(0);
    document.getElementById('f-event-date').min = App.todayStr(0);

    if (!cfg.settings.formOpen) {
      document.getElementById('form-closed').classList.remove('d-none');
      document.getElementById('form-closed').innerHTML =
        '<i class="bi bi-exclamation-triangle-fill me-2"></i>' + App.esc(cfg.settings.closedMessage);
      document.getElementById('form-body').classList.add('d-none');
    }

    if (items.length === 0) addItem();
    setupDropzone();
    restoreContact();
    renderDesigners();
  }

  /* ------------------------------------------------ เลือกผู้ออกแบบ */

  function renderDesigners() {
    var list = cfg.designers || [];
    var wrap = document.getElementById('f-designer-wrap');
    if (!wrap) return;
    wrap.classList.toggle('d-none', list.length === 0);
    // คนที่เลือกไว้ถูกซ่อนหรืองดรับงานไปแล้ว ให้ผู้ขอเลือกใหม่
    if (designerId && designerId !== POOL &&
        !list.some(function (d) { return d.id === designerId && d.accepting; })) designerId = null;
    var stats = Workload.statsById();
    function card(id, color, title, sub, extra, disabled) {
      var on = designerId === id;
      return '<button type="button" class="dp-card' + (on ? ' on' : '') + '" style="--c:' + color + '" role="radio" ' +
        'aria-checked="' + on + '"' + (disabled ? ' disabled' : '') +
        ' onclick="Form.pickDesigner(\'' + App.esc(id) + '\')">' +
        '<div class="dp-top"><i class="cdot"></i>' + App.esc(title) +
          '<i class="bi bi-check-circle-fill dp-check"></i></div>' +
        (sub ? '<div class="dp-sub">' + App.esc(sub) + '</div>' : '') + (extra || '') + '</button>';
    }
    var html = card(POOL, 'var(--primary)', 'ให้ฝ่ายฯ จัดสรรให้',
      'เจ้าหน้าที่เลือกคนที่ว่างและเหมาะกับงานให้', '', false);
    html += list.map(function (d) {
      var s = stats[d.id];
      var load = s
        ? '<div class="mini-bar"><i style="width:' + Math.min(100, s.loadPct) + '%"></i></div>' +
          '<div class="dp-sub">งานในมือ ' + s.active + ' งาน<span class="lv ' + s.level + '">' + App.esc(s.levelLabel) + '</span></div>'
        : '';
      if (!d.accepting) load = '<div class="dp-sub" style="color:var(--danger)">งดรับงานใหม่ชั่วคราว</div>';
      return card(d.id, d.color, d.name, d.specialty, load, !d.accepting);
    }).join('');
    document.getElementById('f-designers').innerHTML = html;
  }

  function pickDesigner(id) {
    designerId = id || POOL;
    document.getElementById('f-designer-wrap').classList.remove('dp-invalid');
    renderDesigners();
    Workload.focus(designerId === POOL ? null : designerId);
  }

  /** ต้องเลือกผู้ออกแบบ (หรือให้ฝ่ายฯ จัดสรร) เมื่อมีรายชื่อให้เลือก */
  function designerMissing() {
    return (cfg.designers || []).length > 0 && !designerId;
  }

  /** รายชื่อผู้ออกแบบเปลี่ยน (ผู้ดูแลแก้ในหน้าตั้งค่า) */
  function setDesigners(list) {
    cfg.designers = list || [];
    renderDesigners();
  }

  function designerLabel() {
    if (!designerId || designerId === POOL) return 'ให้ฝ่ายสื่อสารองค์กรจัดสรรให้';
    var d = (cfg.designers || []).filter(function (x) { return x.id === designerId; })[0];
    return d ? d.name : 'ให้ฝ่ายสื่อสารองค์กรจัดสรรให้';
  }

  /* ------------------------------------------- จำข้อมูลผู้ประสานงาน */

  // เก็บไว้ในเบราว์เซอร์ของผู้ใช้เครื่องนั้นเท่านั้น ใช้เติมให้อัตโนมัติเมื่อยื่นคำขอครั้งถัดไป
  var CONTACT_KEY = 'lartsDesignContact';
  var CONTACT_FIELDS = { name: 'f-name', email: 'f-email', phone: 'f-phone', line: 'f-line',
    dept: 'f-dept', deptOther: 'f-dept-other' };

  function rememberContact() {
    var data = {};
    Object.keys(CONTACT_FIELDS).forEach(function (k) {
      data[k] = document.getElementById(CONTACT_FIELDS[k]).value.trim();
    });
    try { localStorage.setItem(CONTACT_KEY, JSON.stringify(data)); } catch (e) { /* ไม่บังคับ */ }
  }

  function restoreContact() {
    var data = null;
    try { data = JSON.parse(localStorage.getItem(CONTACT_KEY) || 'null'); } catch (e) { data = null; }
    var filled = false;
    if (data && typeof data === 'object') {
      Object.keys(CONTACT_FIELDS).forEach(function (k) {
        var el = document.getElementById(CONTACT_FIELDS[k]);
        if (!el || el.value || !data[k]) return;
        if (el.tagName === 'SELECT' && !el.querySelector('option[value="' + CSS.escape(data[k]) + '"]')) return;
        el.value = data[k];
        filled = true;
      });
    }
    onDeptChange();
    document.getElementById('f-remembered').classList.toggle('d-none', !filled);
  }

  function forgetContact() {
    try { localStorage.removeItem(CONTACT_KEY); } catch (e) { /* ไม่บังคับ */ }
    Object.keys(CONTACT_FIELDS).forEach(function (k) {
      document.getElementById(CONTACT_FIELDS[k]).value = '';
    });
    onDeptChange();
    document.getElementById('f-remembered').classList.add('d-none');
    document.getElementById('f-name').focus();
  }

  /** ใช้ค่าตั้งค่าใหม่ทันทีหลังผู้ดูแลบันทึก โดยไม่ต้องรีเฟรชหน้า */
  function applySettings(settings) {
    cfg.settings = settings;
    document.getElementById('file-hint').textContent =
      'รองรับ ' + settings.allowedFileTypes.split(',').join(', ') +
      ' ขนาดไม่เกิน ' + settings.maxFileMB + ' MB ต่อไฟล์ สูงสุด ' + settings.maxFiles + ' ไฟล์';
    var closed = document.getElementById('form-closed');
    closed.classList.toggle('d-none', settings.formOpen);
    closed.innerHTML = settings.formOpen ? '' :
      '<i class="bi bi-exclamation-triangle-fill me-2"></i>' + App.esc(settings.closedMessage);
    document.getElementById('form-body').classList.toggle('d-none', !settings.formOpen);
    Workload.load(true);
  }

  function setupDropzone() {
    var dz = document.getElementById('dropzone');
    ['dragenter', 'dragover'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
    });
    dz.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files) pickFiles(e.dataTransfer.files);
    });
  }

  function toggleChannel(el) {
    var name = el.getAttribute('data-ch');
    var idx = channels.indexOf(name);
    if (idx >= 0) { channels.splice(idx, 1); el.classList.remove('on'); }
    else { channels.push(name); el.classList.add('on'); }
  }

  function onDeptChange() {
    var isOther = document.getElementById('f-dept').value === 'อื่น ๆ';
    document.getElementById('f-dept-other-wrap').style.display = isOther ? '' : 'none';
  }

  function onDueChange() {
    var value = document.getElementById('f-due-date').value;
    var hint = document.getElementById('f-due-hint');
    var rushWrap = document.getElementById('f-rush-wrap');
    if (!value) { hint.textContent = ''; rushWrap.classList.add('d-none'); return; }
    var left = App.daysUntil(value);
    var minLead = cfg.settings.minLeadDays;
    if (left < 0) {
      hint.innerHTML = '<span style="color:var(--danger)">วันที่ผ่านมาแล้ว กรุณาเลือกวันที่ในอนาคต</span>';
      rushWrap.classList.add('d-none');
    } else if (left < minLead) {
      hint.innerHTML = '<span style="color:var(--warning)">เหลืออีก ' + left + ' วัน ' +
        'ซึ่งน้อยกว่าระยะเวลามาตรฐาน ' + minLead + ' วัน กรุณาระบุเหตุผลความเร่งด่วน</span>';
      rushWrap.classList.remove('d-none');
    } else {
      hint.innerHTML = '<span style="color:var(--success)">เหลืออีก ' + left + ' วัน อยู่ในระยะเวลามาตรฐาน</span>';
      rushWrap.classList.add('d-none');
    }
  }

  /* ------------------------------------------------------ รายการชิ้นงาน */

  function addItem() {
    if (items.length >= 10) { App.toast('เพิ่มชิ้นงานได้สูงสุด 10 รายการต่อหนึ่งคำขอ', 'err'); return; }
    itemSeq++;
    items.push({ id: itemSeq, mediaType: '', size: '', sizeOther: '', mediaOther: '', quantity: 1, note: '' });
    renderItems();
  }

  function removeItem(id) {
    if (items.length <= 1) { App.toast('ต้องมีชิ้นงานอย่างน้อย 1 รายการ', 'err'); return; }
    items = items.filter(function (it) { return it.id !== id; });
    renderItems();
  }

  function getItem(id) {
    for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return null;
  }

  function updateItem(id, field, value) {
    var it = getItem(id);
    if (!it) return;
    it[field] = value;
    if (field === 'mediaType') { it.size = ''; it.sizeOther = ''; renderItems(); }
    if (field === 'size') renderItems();
  }

  function renderItems() {
    var html = items.map(function (it, idx) {
      var media = null;
      for (var i = 0; i < cfg.mediaTypes.length; i++) {
        if (cfg.mediaTypes[i].key === it.mediaType) media = cfg.mediaTypes[i];
      }
      var sizes = media ? media.sizes : [];
      var needCustomSize = it.size === '__other__' || (media && sizes.length === 0);

      return '' +
      '<div class="card-soft p-3 mb-2" style="box-shadow:none">' +
        '<div class="d-flex justify-content-between align-items-center mb-2">' +
          '<span class="badge-soft">ชิ้นงานที่ ' + (idx + 1) + '</span>' +
          (items.length > 1 ? '<button type="button" class="btn btn-sm btn-link text-danger p-0" ' +
            'onclick="Form.removeItem(' + it.id + ')"><i class="bi bi-trash"></i></button>' : '') +
        '</div>' +
        '<div class="row g-2">' +
          '<div class="col-md-5">' +
            '<select class="form-select form-select-sm" onchange="Form.updateItem(' + it.id + ',\'mediaType\',this.value)">' +
              '<option value="">-- เลือกประเภทสื่อ --</option>' +
              cfg.mediaTypes.map(function (m) {
                return '<option value="' + App.esc(m.key) + '"' +
                  (m.key === it.mediaType ? ' selected' : '') + '>' + App.esc(m.label) + '</option>';
              }).join('') +
            '</select>' +
            (it.mediaType === 'other' ?
              '<input type="text" class="form-control form-control-sm mt-2" placeholder="ระบุประเภทสื่อ" ' +
              'value="' + App.esc(it.mediaOther) + '" ' +
              'oninput="Form.updateItemQuiet(' + it.id + ',\'mediaOther\',this.value)">' : '') +
          '</div>' +
          '<div class="col-md-4">' +
            (sizes.length > 0 ?
              '<select class="form-select form-select-sm" onchange="Form.updateItem(' + it.id + ',\'size\',this.value)">' +
                '<option value="">-- เลือกขนาด --</option>' +
                sizes.map(function (s) {
                  return '<option value="' + App.esc(s) + '"' + (s === it.size ? ' selected' : '') + '>' +
                    App.esc(s) + '</option>';
                }).join('') +
                '<option value="__other__"' + (it.size === '__other__' ? ' selected' : '') + '>ระบุขนาดเอง</option>' +
              '</select>' : '') +
            (needCustomSize ?
              '<input type="text" class="form-control form-control-sm' + (sizes.length > 0 ? ' mt-2' : '') +
              '" placeholder="ระบุขนาด เช่น 100 x 200 ซม." value="' + App.esc(it.sizeOther) + '" ' +
              'oninput="Form.updateItemQuiet(' + it.id + ',\'sizeOther\',this.value)">' : '') +
          '</div>' +
          '<div class="col-md-3">' +
            '<input type="number" class="form-control form-control-sm" min="1" max="1000" ' +
            'value="' + (+it.quantity || 1) + '" placeholder="จำนวน" ' +
            'oninput="Form.updateItemQuiet(' + it.id + ',\'quantity\',this.value)">' +
          '</div>' +
          '<div class="col-12">' +
            '<input type="text" class="form-control form-control-sm" maxlength="500" ' +
            'placeholder="หมายเหตุเฉพาะชิ้นงานนี้ (ถ้ามี)" value="' + App.esc(it.note) + '" ' +
            'oninput="Form.updateItemQuiet(' + it.id + ',\'note\',this.value)">' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    document.getElementById('f-items').innerHTML = html;
  }

  /** อัปเดตค่าโดยไม่ render ใหม่ เพื่อไม่ให้เคอร์เซอร์กระโดด */
  function updateItemQuiet(id, field, value) {
    var it = getItem(id);
    if (it) it[field] = value;
  }

  /* -------------------------------------------------------------- ไฟล์ */

  function pickFiles(fileList) {
    var maxBytes = cfg.settings.maxFileMB * 1024 * 1024;
    var allowed = cfg.settings.allowedFileTypes.toLowerCase().split(',').map(function (x) { return x.trim(); });

    for (var i = 0; i < fileList.length; i++) {
      (function (file) {
        if (files.length + pendingReads >= cfg.settings.maxFiles) {
          App.toast('แนบไฟล์ได้สูงสุด ' + cfg.settings.maxFiles + ' ไฟล์', 'err');
          return;
        }
        var dot = file.name.lastIndexOf('.');
        var ext = dot >= 0 ? file.name.substring(dot + 1).toLowerCase() : '';
        if (allowed.indexOf(ext) < 0) {
          App.toast('ไฟล์ "' + file.name + '" เป็นชนิดที่ไม่รองรับ', 'err');
          return;
        }
        if (file.size > maxBytes) {
          App.toast('ไฟล์ "' + file.name + '" มีขนาด ' + App.bytes(file.size) +
            ' เกิน ' + cfg.settings.maxFileMB + ' MB', 'err');
          return;
        }
        for (var k = 0; k < files.length; k++) {
          if (files[k].name === file.name && files[k].size === file.size) {
            App.toast('ไฟล์ "' + file.name + '" ถูกเลือกไว้แล้ว', 'err');
            return;
          }
        }
        var reader = new FileReader();
        pendingReads++;
        reader.onload = function (e) {
          pendingReads--;
          var result = String(e.target.result);
          var comma = result.indexOf(',');
          files.push({
            name: file.name,
            size: file.size,
            type: file.type || 'application/octet-stream',
            dataB64: comma >= 0 ? result.substring(comma + 1) : result
          });
          renderFiles();
        };
        reader.onerror = function () {
          pendingReads--;
          renderFiles();
          App.toast('อ่านไฟล์ "' + file.name + '" ไม่สำเร็จ', 'err');
        };
        reader.readAsDataURL(file);
      })(fileList[i]);
    }
    document.getElementById('f-files').value = '';
  }

  function removeFile(index) {
    files.splice(index, 1);
    renderFiles();
  }

  function renderFiles() {
    var el = document.getElementById('file-list');
    var waiting = pendingReads > 0
      ? '<div class="file-row text-secondary"><span class="spinner-border spinner-border-sm"></span>' +
        '<div class="flex-grow-1">กำลังอ่านไฟล์อีก ' + pendingReads + ' ไฟล์...</div></div>'
      : '';
    if (files.length === 0) { el.innerHTML = waiting; return; }
    el.innerHTML = waiting + files.map(function (f, i) {
      return '<div class="file-row">' +
        '<i class="bi bi-file-earmark" style="color:var(--primary);font-size:1.1rem"></i>' +
        '<div class="flex-grow-1 text-truncate">' + App.esc(f.name) + '</div>' +
        '<span class="text-secondary" style="font-size:.78rem">' + App.bytes(f.size) + '</span>' +
        '<button type="button" class="btn btn-sm btn-link text-danger p-0 ms-1" ' +
        'onclick="Form.removeFile(' + i + ')"><i class="bi bi-x-lg"></i></button>' +
        '</div>';
    }).join('');
  }

  /* --------------------------------------------------- การเดินขั้นตอน */

  function showStep(n) {
    step = n;
    var panels = document.querySelectorAll('#form-body .fstep');
    for (var i = 0; i < panels.length; i++) {
      panels[i].classList.toggle('d-none', +panels[i].getAttribute('data-step') !== n);
    }
    var dots = document.querySelectorAll('.wizard-steps .wstep');
    for (var j = 0; j < dots.length; j++) {
      var sn = +dots[j].getAttribute('data-step');
      dots[j].classList.toggle('active', sn === n);
      dots[j].classList.toggle('done', sn < n);
      dots[j].querySelector('.dot').innerHTML = sn < n ? '<i class="bi bi-check-lg"></i>' : sn;
    }
    document.getElementById('f-back').style.visibility = n === 1 ? 'hidden' : 'visible';
    var nextBtn = document.getElementById('f-next');
    nextBtn.innerHTML = n === 3
      ? '<i class="bi bi-send"></i>ส่งคำขอ'
      : 'ถัดไป<i class="bi bi-arrow-right"></i>';
    if (n === 3) buildSummary();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function mark(id, bad) {
    var el = document.getElementById(id);
    if (el) el.classList.toggle('is-invalid', !!bad);
    return !bad;
  }

  function validateStep(n) {
    var errors = [];
    if (n === 1) {
      var name = document.getElementById('f-name').value.trim();
      mark('f-name', name.length < 2);
      if (name.length < 2) errors.push('กรุณากรอกชื่อ-นามสกุลผู้ประสานงาน');

      var email = document.getElementById('f-email').value.trim();
      var emailOk = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email);
      mark('f-email', !emailOk);
      if (!emailOk) errors.push('รูปแบบอีเมลไม่ถูกต้อง');

      var phone = document.getElementById('f-phone').value.replace(/[^0-9]/g, '');
      var phoneOk = !phone || (phone.length >= 9 && phone.length <= 10); // ไม่บังคับ แต่ถ้ากรอกต้องถูกรูปแบบ
      mark('f-phone', !phoneOk);
      if (!phoneOk) errors.push('เบอร์โทรศัพท์ต้องมี 9-10 หลัก หรือเว้นว่างไว้');

      var dept = document.getElementById('f-dept').value;
      mark('f-dept', !dept);
      if (!dept) errors.push('กรุณาเลือกหน่วยงาน / สาขาวิชา');
      if (dept === 'อื่น ๆ') {
        var other = document.getElementById('f-dept-other').value.trim();
        mark('f-dept-other', !other);
        if (!other) errors.push('กรุณาระบุชื่อหน่วยงาน');
      }
    }

    if (n === 2) {
      var project = document.getElementById('f-project').value.trim();
      mark('f-project', project.length < 3);
      if (project.length < 3) errors.push('กรุณากรอกชื่อโครงการหรือกิจกรรม');

      var due = document.getElementById('f-due-date').value;
      var dueOk = !!due && App.daysUntil(due) >= 0;
      mark('f-due-date', !dueOk);
      if (!dueOk) errors.push('กรุณาเลือกวันที่ต้องการใช้งานเป็นวันที่ในอนาคต');

      if (due && App.daysUntil(due) >= 0 && App.daysUntil(due) < cfg.settings.minLeadDays) {
        var rush = document.getElementById('f-rush').value.trim();
        mark('f-rush', !rush);
        if (!rush) errors.push('กำหนดส่งน้อยกว่า ' + cfg.settings.minLeadDays +
          ' วัน กรุณาระบุเหตุผลความจำเป็นเร่งด่วน');
      }

      var objective = document.getElementById('f-objective').value.trim();
      mark('f-objective', objective.length < 10);
      if (objective.length < 10) errors.push('กรุณาระบุวัตถุประสงค์อย่างน้อย 10 ตัวอักษร');

      var audience = document.getElementById('f-audience').value.trim();
      mark('f-audience', audience.length < 2);
      if (audience.length < 2) errors.push('กรุณาระบุกลุ่มเป้าหมาย');

      var keymsg = document.getElementById('f-keymsg').value.trim();
      mark('f-keymsg', keymsg.length < 5);
      if (keymsg.length < 5) errors.push('กรุณาระบุข้อความหลักที่ต้องการสื่อ');

      if (channels.length === 0) errors.push('กรุณาเลือกช่องทางเผยแพร่อย่างน้อย 1 ช่องทาง');

      var ref = document.getElementById('f-ref').value.trim();
      if (ref && !/^https?:\/\//i.test(ref)) {
        mark('f-ref', true);
        errors.push('ลิงก์ตัวอย่างอ้างอิงต้องขึ้นต้นด้วย http:// หรือ https://');
      } else { mark('f-ref', false); }

      var itemErrors = 0;
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (!it.mediaType) { itemErrors++; continue; }
        if (it.mediaType === 'other' && !String(it.mediaOther).trim()) itemErrors++;
        var size = it.size === '__other__' || !it.size ? String(it.sizeOther).trim() : it.size;
        if (!size) itemErrors++;
      }
      if (itemErrors > 0) errors.push('กรุณาเลือกประเภทสื่อและระบุขนาดให้ครบทุกรายการชิ้นงาน');

      var noDesigner = designerMissing();
      document.getElementById('f-designer-wrap').classList.toggle('dp-invalid', noDesigner);
      if (noDesigner) errors.push('กรุณาเลือกผู้ออกแบบที่ต้องการ หรือเลือก "ให้ฝ่ายฯ จัดสรรให้" ถ้ายังไม่แน่ใจ');
    }

    if (n === 3) {
      if (!document.getElementById('f-accept').checked) {
        errors.push('กรุณายอมรับเงื่อนไขการให้บริการก่อนส่งคำขอ');
      }
    }

    if (errors.length > 0) {
      App.toast(errors.join('\n'), 'err');
      return false;
    }
    return true;
  }

  function buildSummary() {
    var dept = document.getElementById('f-dept').value === 'อื่น ๆ'
      ? document.getElementById('f-dept-other').value.trim()
      : document.getElementById('f-dept').value;
    var rows = [
      ['ผู้ประสานงาน', document.getElementById('f-name').value.trim() + ' (' + dept + ')'],
      ['อีเมล / โทรศัพท์', document.getElementById('f-email').value.trim() +
        (document.getElementById('f-phone').value.trim() ? ' / ' + document.getElementById('f-phone').value.trim() : '')],
      ['โครงการ', document.getElementById('f-project').value.trim()],
      ['กำหนดใช้งาน', App.thaiDate(document.getElementById('f-due-date').value)],
      ['ช่องทางเผยแพร่', channels.join(', ')],
      ['ชิ้นงาน', items.map(function (it) {
        var label = it.mediaType === 'other' ? it.mediaOther : (function () {
          for (var i = 0; i < cfg.mediaTypes.length; i++) {
            if (cfg.mediaTypes[i].key === it.mediaType) return cfg.mediaTypes[i].label;
          }
          return '';
        })();
        var size = (it.size === '__other__' || !it.size) ? it.sizeOther : it.size;
        return label + ' (' + size + ') x ' + (+it.quantity || 1);
      }).join('<br>')],
      ['ผู้ออกแบบ', designerLabel()],
      ['ไฟล์แนบ', files.length > 0 ? files.length + ' ไฟล์' : 'ไม่มีไฟล์แนบ']
    ];
    document.getElementById('f-summary').innerHTML = rows.map(function (r) {
      return '<div class="row g-1"><div class="col-4 col-md-3 text-secondary">' + App.esc(r[0]) +
        '</div><div class="col-8 col-md-9">' + (r[0] === 'ชิ้นงาน' ? r[1] : App.esc(r[1])) + '</div></div>';
    }).join('');
  }

  function next() {
    if (!validateStep(step)) return;
    if (pendingReads > 0) {
      App.toast('ระบบกำลังอ่านไฟล์แนบอยู่ ' + pendingReads +
        ' ไฟล์ กรุณารอสักครู่แล้วกดใหม่อีกครั้ง', 'err');
      return;
    }
    if (step < 3) { showStep(step + 1); return; }
    submit();
  }

  function back() {
    if (step > 1) showStep(step - 1);
  }

  function buildPayload() {
    var dept = document.getElementById('f-dept').value;
    return {
      requesterName: document.getElementById('f-name').value.trim(),
      requesterEmail: document.getElementById('f-email').value.trim(),
      requesterPhone: document.getElementById('f-phone').value.trim(),
      lineId: document.getElementById('f-line').value.trim(),
      department: dept,
      departmentOther: document.getElementById('f-dept-other').value.trim(),
      projectName: document.getElementById('f-project').value.trim(),
      eventDate: document.getElementById('f-event-date').value,
      dueDate: document.getElementById('f-due-date').value,
      rushReason: document.getElementById('f-rush').value.trim(),
      objective: document.getElementById('f-objective').value.trim(),
      targetAudience: document.getElementById('f-audience').value.trim(),
      keyMessage: document.getElementById('f-keymsg').value.trim(),
      mandatoryText: document.getElementById('f-mandatory').value.trim(),
      referenceUrl: document.getElementById('f-ref').value.trim(),
      notes: document.getElementById('f-notes').value.trim(),
      channels: channels.slice(),
      acceptTerms: document.getElementById('f-accept').checked,
      designerId: designerId || '',
      deliverables: items.map(function (it) {
        return {
          mediaType: it.mediaType,
          mediaOther: it.mediaOther,
          size: it.size === '__other__' ? '' : it.size,
          sizeOther: it.sizeOther,
          quantity: +it.quantity || 1,
          note: it.note
        };
      })
    };
  }

  function submit() {
    if (submitting) return;
    if (pendingReads > 0) {
      App.toast('ระบบกำลังอ่านไฟล์แนบอยู่ กรุณารอสักครู่แล้วกดส่งใหม่อีกครั้ง', 'err');
      return;
    }
    submitting = true;
    document.getElementById('f-next').disabled = true;
    App.loading(true, 'กำลังส่งคำขอ...');

    App.api('apiSubmitRequest', [buildPayload()]).then(function (res) {
      created = res;
      rememberContact();
      if (files.length === 0) return finalize();
      return uploadAll().then(finalize);
    }).then(function () {
      App.loading(false);
      submitting = false;
      document.getElementById('f-next').disabled = false;
      document.getElementById('form-body').classList.add('d-none');
      document.getElementById('form-done').classList.remove('d-none');
      document.getElementById('done-jobid').textContent = created.jobId;
      Workload.load(true);
      App.toast('ยื่นคำขอเรียบร้อยแล้ว เลขที่ ' + created.jobId, 'ok');
    }).catch(function (err) {
      App.loading(false);
      submitting = false;
      document.getElementById('f-next').disabled = false;
      App.toast(err.message, 'err');
      // ผู้ออกแบบที่เลือกงดรับงานหรือถูกซ่อนไประหว่างกรอก: กลับไปเลือกใหม่พร้อมรายชื่อล่าสุด
      if (err.code === 'DESIGNER' && !created) {
        designerId = null;
        document.getElementById('f-designer-wrap').classList.add('dp-invalid');
        showStep(2);
        Workload.load(true);
        setTimeout(function () {
          var wrap = document.getElementById('f-designer-wrap');
          if (wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 350);
      }
    });
  }

  /**
   * อัปโหลดไฟล์แนบพร้อมกันครั้งละ 3 ไฟล์ เร็วกว่าส่งทีละไฟล์มากเมื่อแนบหลายไฟล์
   * ไฟล์ใดล้มเหลวจะแจ้งเตือนแล้วทำไฟล์ถัดไปต่อ ไม่ทำให้คำขอทั้งใบล้มเหลว
   */
  function uploadAll() {
    var next = 0;
    var done = 0;
    var total = files.length;
    App.loading(true, 'กำลังอัปโหลดไฟล์แนบ 0 จาก ' + total + '...');
    function worker() {
      if (next >= total) return Promise.resolve();
      var f = files[next++];
      return App.api('apiUploadFile', [created.jobId, created.trackToken, {
        fileName: f.name, mimeType: f.type, dataB64: f.dataB64
      }]).catch(function (err) {
        App.toast('อัปโหลดไฟล์ "' + f.name + '" ไม่สำเร็จ: ' + err.message, 'err');
      }).then(function () {
        done++;
        App.loading(true, 'กำลังอัปโหลดไฟล์แนบ ' + done + ' จาก ' + total + '...');
        return worker();
      });
    }
    var workers = [];
    for (var i = 0; i < Math.min(3, total); i++) workers.push(worker());
    return Promise.all(workers);
  }

  function finalize() {
    App.loading(true, 'กำลังยืนยันคำขอและส่งอีเมล...');
    return App.api('apiFinalizeRequest', [created.jobId, created.trackToken]);
  }

  function reset(goToForm) {
    ['f-name', 'f-email', 'f-phone', 'f-line', 'f-dept-other', 'f-project', 'f-event-date',
      'f-due-date', 'f-rush', 'f-objective', 'f-audience', 'f-keymsg', 'f-mandatory',
      'f-ref', 'f-notes'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) { el.value = ''; el.classList.remove('is-invalid'); }
      });
    document.getElementById('f-dept').value = '';
    document.getElementById('f-accept').checked = false;
    document.getElementById('f-dept-other-wrap').style.display = 'none';
    document.getElementById('f-rush-wrap').classList.add('d-none');
    document.getElementById('f-due-hint').textContent = '';
    channels = [];
    var chips = document.querySelectorAll('#f-channels .chip');
    for (var i = 0; i < chips.length; i++) chips[i].classList.remove('on');
    items = [];
    itemSeq = 0;
    addItem();
    files = [];
    pendingReads = 0;
    renderFiles();
    created = null;
    designerId = null;
    document.getElementById('f-designer-wrap').classList.remove('dp-invalid');
    renderDesigners();
    Workload.focus(null);
    document.getElementById('form-done').classList.add('d-none');
    document.getElementById('form-body').classList.remove('d-none');
    restoreContact();
    showStep(1);
    if (goToForm) App.go('form');
  }

  function goTrackResult() {
    if (!created) return;
    App.go('track');
    Track.openFromLink(created.jobId, created.trackToken);
  }

  return {
    init: init, next: next, back: back, addItem: addItem, removeItem: removeItem,
    updateItem: updateItem, updateItemQuiet: updateItemQuiet, toggleChannel: toggleChannel,
    onDeptChange: onDeptChange, onDueChange: onDueChange, pickFiles: pickFiles,
    removeFile: removeFile, reset: reset, goTrackResult: goTrackResult,
    forgetContact: forgetContact, applySettings: applySettings,
    renderDesigners: renderDesigners, pickDesigner: pickDesigner, setDesigners: setDesigners
  };
})();

/* =========================================================================
   Workload — คิวงานออกแบบบนหน้ายื่นคำขอ
   ภาระงานของแต่ละคน ปฏิทินรายเดือน และตารางงานที่กำลังทำ เชื่อมกันทั้งหมด:
   กดชื่อผู้ออกแบบที่ใดก็ได้ ปฏิทินและตารางจะแสดงเฉพาะงานของคนนั้น
   ========================================================================= */
var Workload = (function () {
  var data = null;
  var loadedAt = 0;
  var loading = false;
  var focusId = null;      // null = ทุกคน, '__none' = รอจัดสรร, อื่น ๆ = id ผู้ออกแบบ
  var month = null;
  var TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

  function panel() { return document.getElementById('workload-panel'); }

  function enabled() {
    var c = App.getCfg();
    return !!(c && c.settings && c.settings.publicWorkload !== false);
  }

  function load(force) {
    if (!enabled()) { panel().classList.add('d-none'); return; }
    if (data && !force && Date.now() - loadedAt < 60000) { render(); return; }
    if (loading) return;
    loading = true;
    if (!data) {
      panel().classList.remove('d-none');
      panel().innerHTML = '<div class="card-soft empty-state"><span class="spinner-border spinner-border-sm"></span>' +
        '<p class="mt-3 mb-0">กำลังโหลดคิวงาน...</p></div>';
    }
    App.api('apiPublicWorkload').then(function (d) {
      loading = false;
      data = d;
      loadedAt = Date.now();
      render();
      // รายชื่อจากคิวงานเป็นข้อมูลล่าสุดเสมอ (หน้าเว็บที่เปิดค้างไว้นานจะได้สถานะรับงานที่ถูกต้อง)
      if (d && d.enabled && d.designers) {
        Form.setDesigners(d.designers.map(function (x) {
          return { id: x.id, name: x.name, shortName: x.shortName, specialty: x.specialty,
            color: x.color, accepting: x.accepting, capacity: x.capacity };
        }));
      } else {
        Form.renderDesigners();
      }
    }).catch(function () {
      loading = false;
      if (!data) panel().classList.add('d-none'); // ไม่ให้หน้าแบบฟอร์มดูพังเพราะคิวงานโหลดไม่ได้
    });
  }

  function invalidate() { loadedAt = 0; }

  function statsById() {
    var m = {};
    ((data && data.designers) || []).forEach(function (d) { m[d.id] = d; });
    return m;
  }

  function focus(id) {
    focusId = id === undefined || id === null || id === '' ? null : id;
    render();
  }

  function toggleFocus(id) { focus(focusId === id ? null : id); }

  function matches(job) {
    if (focusId === null) return true;
    if (focusId === '__none') return !job.designerId;
    return job.designerId === focusId;
  }

  function move(step) {
    var base = month || new Date();
    month = step === 0 ? new Date() : new Date(base.getFullYear(), base.getMonth() + step, 1);
    render();
  }

  function ymd(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function short(text, n) {
    var t = String(text || '');
    return t.length > n ? t.substring(0, n - 1) + '…' : t;
  }

  function cls(id) { return focusId === null ? '' : (focusId === id ? ' on' : ' dim'); }

  function rowsHtml() {
    var staff = data.staff || { active: 0 };
    var maxActive = Math.max.apply(null, data.designers.map(function (d) { return d.active; })
      .concat([data.unassigned.active, staff.active, 1]));
    var rows = data.designers.map(function (d) {
      return '<button type="button" class="wl-row' + cls(d.id) + '" style="--c:' + d.color + '" ' +
        'onclick="Workload.toggleFocus(\'' + App.esc(d.id) + '\')" title="กดเพื่อดูเฉพาะงานของ ' + App.esc(d.name) + '">' +
        '<div class="wl-name"><i class="cdot"></i><span>' + App.esc(d.name) + '</span></div>' +
        '<div class="wl-mid"><div class="wl-bar" title="' + d.active + ' จาก ' + d.capacity + ' งานที่รับได้พร้อมกัน">' +
          '<i style="width:' + Math.min(100, d.loadPct) + '%"></i></div>' +
          (d.specialty ? '<div class="row-sub text-truncate">' + App.esc(d.specialty) + '</div>' : '') + '</div>' +
        '<div class="wl-meta"><strong>' + d.active + '</strong> งาน<span class="lv ' + d.level + '">' +
          App.esc(d.levelLabel) + '</span><div class="row-sub mt-0">' +
          (d.accepting ? 'ครบกำหนดใน 7 วัน ' + d.dueSoon + ' งาน' : '<span style="color:var(--danger)">งดรับงานใหม่ชั่วคราว</span>') +
        '</div></div></button>';
    });
    if (staff.active > 0) {
      rows.push('<button type="button" class="wl-row' + cls('__staff') + '" style="--c:' + staff.color + '" ' +
        'onclick="Workload.toggleFocus(\'__staff\')">' +
        '<div class="wl-name"><i class="cdot"></i><span>' + App.esc(staff.label) + '</span></div>' +
        '<div class="wl-mid"><div class="wl-bar"><i style="width:' + Math.round(staff.active / maxActive * 100) + '%"></i></div>' +
          '<div class="row-sub text-truncate">เจ้าหน้าที่ฝ่ายฯ ที่ไม่ได้อยู่ในรายชื่อให้เลือก</div></div>' +
        '<div class="wl-meta"><strong>' + staff.active + '</strong> งาน</div></button>');
    }
    if (data.unassigned.active > 0) {
      rows.push('<button type="button" class="wl-row' + cls('__none') + '" style="--c:' + data.unassigned.color + '" ' +
        'onclick="Workload.toggleFocus(\'__none\')">' +
        '<div class="wl-name"><i class="cdot"></i><span>รอจัดสรรผู้ออกแบบ</span></div>' +
        '<div class="wl-mid"><div class="wl-bar"><i style="width:' + Math.round(data.unassigned.active / maxActive * 100) + '%"></i></div></div>' +
        '<div class="wl-meta"><strong>' + data.unassigned.active + '</strong> งาน</div></button>');
    }
    return rows.join('') || '<div class="row-sub">ยังไม่มีรายชื่อผู้ออกแบบ</div>';
  }

  function legendHtml() {
    return '<div class="wp-legend">' + data.designers.map(function (d) {
      return '<button type="button" class="' + (focusId !== null && focusId !== d.id ? 'dim' : '') + '" style="--c:' + d.color + '" ' +
        'onclick="Workload.toggleFocus(\'' + App.esc(d.id) + '\')"><i class="cdot"></i>' + App.esc(d.shortName || d.name) + '</button>';
    }).join('') +
      (data.staff && data.staff.active > 0 ? '<button type="button" class="' + (focusId !== null && focusId !== '__staff' ? 'dim' : '') +
        '" style="--c:' + data.staff.color + '" onclick="Workload.toggleFocus(\'__staff\')"><i class="cdot"></i>' +
        App.esc(data.staff.label) + '</button>' : '') +
      '<button type="button" class="' + (focusId !== null && focusId !== '__none' ? 'dim' : '') + '" style="--c:' +
        data.unassigned.color + '" onclick="Workload.toggleFocus(\'__none\')"><i class="cdot"></i>รอจัดสรร</button></div>';
  }

  function calendarHtml(jobs) {
    if (!month) month = new Date();
    var y = month.getFullYear();
    var m = month.getMonth();
    var start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    var todayKey = ymd(new Date());
    var byDay = {};
    jobs.forEach(function (j) { (byDay[j.dueDate] = byDay[j.dueDate] || []).push(j); });
    function ev(j) {
      return '<div class="pc-ev" style="--c:' + j.color + '" title="' +
        App.esc(j.projectName + ' · ' + j.statusLabel + ' · ' + (j.designerName || 'รอจัดสรร')) + '">' +
        '<i class="cdot"></i><span>' + App.esc(short(j.projectName, 18)) + '</span></div>';
    }
    var cells = '';
    var agenda = '';
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (i >= 35 && d.getMonth() !== m) break;
      var key = ymd(d);
      var list = byDay[key] || [];
      cells += '<div class="cal-day' + (d.getMonth() !== m ? ' out' : '') + (key === todayKey ? ' today' : '') +
        (d.getDay() === 0 || d.getDay() === 6 ? ' weekend' : '') + '"><div class="cal-num">' + d.getDate() + '</div>' +
        list.slice(0, 3).map(ev).join('') +
        (list.length > 3 ? '<div class="cal-more">+ อีก ' + (list.length - 3) + ' งาน</div>' : '') + '</div>';
      if (d.getMonth() === m && list.length) {
        agenda += '<div class="mb-2"><div class="cal-num">' + App.thaiDate(key) + '</div>' + list.map(ev).join('') + '</div>';
      }
    }
    return '<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">' +
        '<div class="d-flex align-items-center gap-2">' +
          '<button type="button" class="btn btn-sm btn-ghost px-2" onclick="Workload.move(-1)" aria-label="เดือนก่อน"><i class="bi bi-chevron-left"></i></button>' +
          '<div class="fw-semibold" style="min-width:140px;text-align:center">' + TH_MONTHS[m] + ' ' + (y + 543) + '</div>' +
          '<button type="button" class="btn btn-sm btn-ghost px-2" onclick="Workload.move(1)" aria-label="เดือนถัดไป"><i class="bi bi-chevron-right"></i></button>' +
          '<button type="button" class="btn btn-sm btn-ghost" onclick="Workload.move(0)">เดือนนี้</button>' +
        '</div>' + legendHtml() + '</div>' +
      '<div class="cal-head"><div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="cal-agenda">' + (agenda || '<div class="row-sub">ไม่มีงานครบกำหนดในเดือนนี้</div>') + '</div>' +
      '<div class="row-sub">จุดสีคือผู้ออกแบบ แสดงตามวันที่ต้องการใช้งาน</div>';
  }

  function tableHtml(jobs) {
    if (jobs.length === 0) {
      return '<div class="empty-state py-4"><i class="bi bi-inbox"></i><p class="mt-2 mb-0" style="font-size:.88rem">' +
        'ไม่มีงานที่กำลังดำเนินการ</p></div>';
    }
    return '<div class="table-responsive"><table class="table table-clean mb-0 wp-table"><thead><tr>' +
      '<th>ชื่อโครงการ</th><th>กำหนดใช้งาน</th><th>สถานะ</th><th>ผู้ออกแบบ</th></tr></thead><tbody>' +
      jobs.map(function (j) {
        var left = j.daysLeft;
        var leftText = left === null ? '' : (left < 0 ? 'เกินกำหนด ' + Math.abs(left) + ' วัน'
          : (left === 0 ? 'วันนี้' : 'อีก ' + left + ' วัน'));
        return '<tr><td class="w-project">' + App.esc(j.projectName) + '</td>' +
          '<td class="w-due" style="white-space:nowrap">' + App.shortDate(j.dueDate) +
            (leftText ? '<div class="row-sub mt-0"' + (left < 0 ? ' style="color:var(--danger)"' : '') + '>' + leftText + '</div>' : '') + '</td>' +
          '<td class="w-status"><span class="badge-status" style="background:' + j.statusColor + '">' + App.esc(j.statusLabel) + '</span></td>' +
          '<td class="w-who"><button type="button" class="who" style="--c:' + j.color + '" onclick="Workload.toggleFocus(\'' +
            App.esc(j.designerId || '__none') + '\')"><i class="cdot"></i>' + App.esc(j.designerName || 'รอจัดสรร') + '</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function render() {
    var el = panel();
    if (!data || !data.enabled || !enabled()) { el.classList.add('d-none'); return; }
    el.classList.remove('d-none');
    var jobs = data.jobs.filter(matches);
    var focusName = focusId === '__none' ? 'รอจัดสรรผู้ออกแบบ'
      : (focusId === '__staff' ? ((data.staff || {}).label || '') : ((statsById()[focusId] || {}).name || ''));
    var at = String(data.generatedAt || '').substring(11, 16);
    el.innerHTML =
      '<div class="wp-head"><div><h4><i class="bi bi-kanban me-2" style="color:var(--primary)"></i>คิวงานออกแบบตอนนี้</h4>' +
        '<div class="row-sub mt-0">งานที่กำลังดำเนินการ ' + data.jobs.length + ' งาน' + (at ? ' · อัปเดต ' + at + ' น.' : '') +
        ' · ช่วยประกอบการเลือกผู้ออกแบบและวางแผนกำหนดใช้งาน</div></div>' +
        (focusId !== null ? '<button type="button" class="btn btn-sm btn-ghost" onclick="Workload.focus(null)">' +
          '<i class="bi bi-x-lg me-1"></i>แสดงทุกคน (กำลังดู: ' + App.esc(focusName) + ')</button>' : '') +
      '</div>' +
      '<div class="d-grid gap-3">' +
        '<div class="card-soft p-3 p-md-4"><div class="fw-semibold mb-2"><i class="bi bi-bar-chart-steps me-2" style="color:var(--primary)"></i>' +
          'ภาระงานของผู้ออกแบบ</div>' + rowsHtml() + '</div>' +
        '<div class="card-soft p-3 p-md-4"><div class="fw-semibold mb-2"><i class="bi bi-calendar3 me-2" style="color:var(--primary)"></i>' +
          'ปฏิทินงาน</div>' + calendarHtml(jobs) + '</div>' +
        '<div class="card-soft p-0 overflow-hidden"><div class="fw-semibold px-3 px-md-4 pt-3 pb-2">' +
          '<i class="bi bi-list-task me-2" style="color:var(--primary)"></i>งานที่กำลังดำเนินการ' +
          (focusId !== null ? ' <span class="row-sub d-inline">(' + jobs.length + ' งาน)</span>' : '') + '</div>' +
          tableHtml(jobs) + '</div>' +
      '</div>';
  }

  return {
    load: load, render: render, focus: focus, toggleFocus: toggleFocus, move: move,
    statsById: statsById, invalidate: invalidate
  };
})();
</script>
