<style>
  :root {
    --primary: #e65c00;
    --primary-dark: #b34700;
    --primary-soft: #fff7ed;
    --accent: #fbbf24;
    --success: #059669;
    --info: #0d9488;
    --warning: #d97706;
    --danger: #dc2626;
    --purple: #7c3aed;
    --text-dark: #1e293b;
    --text-light: #64748b;
    --bg: #f8fafc;
    --border: #e2e8f0;
    --card-shadow: 0 15px 35px -12px rgba(15, 23, 42, .08);
    --transition: all .25s cubic-bezier(.4, 0, .2, 1);
  }

  body {
    background: var(--bg);
    color: var(--text-dark);
    font-family: 'Prompt', 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-weight: 300;
    font-size: 15px;
  }

  h1, h2, h3, h4, h5, h6, .fw-semibold, .fw-bold, strong, b, .btn, label { font-weight: 500; }
  .fw-bold, strong, b, h2, h3 { font-weight: 600; }

  a { color: var(--primary); text-decoration: none; }
  a:hover { color: var(--primary-dark); }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn .28s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------------------------------------------------------- Top bar */
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1030;
  }
  .topbar .brand {
    display: flex; align-items: center; gap: .7rem;
    color: var(--text-dark); font-weight: 600;
  }
  .topbar .brand .logo {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 40px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
  }
  .topbar .brand small { display: block; font-weight: 300; color: var(--text-light); font-size: .74rem; }

  /* ------------------------------------------------------------- Cards */
  .card-soft {
    background: #fff; border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--card-shadow);
  }
  .action-card {
    background: #fff; border: 1px solid var(--border); border-radius: 20px;
    padding: 2rem 1.6rem; height: 100%; display: flex; flex-direction: column;
    justify-content: space-between; transition: var(--transition); box-shadow: var(--card-shadow);
    cursor: pointer; text-align: left;
  }
  .action-card:hover { transform: translateY(-6px); box-shadow: 0 22px 42px -14px rgba(15, 23, 42, .16); border-color: #cbd5e1; }
  .action-card:active { transform: scale(.985); }
  .action-icon {
    width: 60px; height: 60px; border-radius: 16px; display: inline-flex;
    align-items: center; justify-content: center; margin-bottom: 1.1rem;
    font-size: 1.6rem; transition: var(--transition);
  }
  .action-card h4 { font-size: 1.12rem; margin-bottom: .5rem; color: var(--text-dark); }
  .action-card p { font-size: .87rem; color: var(--text-light); line-height: 1.65; margin: 0; }
  .action-link { font-weight: 600; font-size: .9rem; display: inline-flex; align-items: center; gap: .45rem; margin-top: 1.3rem; }
  .action-card:hover .action-link { gap: .75rem; }

  .c-primary .action-icon { background: var(--primary-soft); color: var(--primary); }
  .c-primary:hover .action-icon { background: var(--primary); color: #fff; }
  .c-primary .action-link { color: var(--primary); }
  .c-success .action-icon { background: #ecfdf5; color: var(--success); }
  .c-success:hover .action-icon { background: var(--success); color: #fff; }
  .c-success .action-link { color: var(--success); }
  .c-info .action-icon { background: #f0fdfa; color: var(--info); }
  .c-info:hover .action-icon { background: var(--info); color: #fff; }
  .c-info .action-link { color: var(--info); }
  .c-warning .action-icon { background: #fffbeb; color: var(--warning); }
  .c-warning:hover .action-icon { background: var(--warning); color: #fff; }
  .c-warning .action-link { color: var(--warning); }

  /* -------------------------------------------------------------- Hero */
  .hero {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    border-radius: 24px; color: #fff; padding: 3rem 2rem; text-align: center;
    box-shadow: 0 20px 45px -18px rgba(230, 92, 0, .55);
  }
  .hero h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -.02em; margin-bottom: .6rem; }
  .hero p { color: #fff6e6; margin: 0; font-weight: 300; }
  .hero .hero-badge {
    display: inline-block; background: rgba(255, 255, 255, .2); border-radius: 30px;
    padding: .3rem 1rem; font-size: .78rem; margin-bottom: 1rem; backdrop-filter: blur(4px);
  }

  /* ----------------------------------------------------------- Buttons */
  .btn-brand {
    background: var(--primary); color: #fff; border: none; border-radius: 30px;
    padding: .65rem 1.9rem; font-weight: 600; transition: var(--transition);
    display: inline-flex; align-items: center; gap: .5rem;
  }
  .btn-brand:hover { background: var(--primary-dark); color: #fff; transform: translateY(-1px); box-shadow: 0 8px 18px -6px rgba(230, 92, 0, .5); }
  .btn-brand:disabled { opacity: .6; transform: none; box-shadow: none; }
  .btn-ghost {
    background: #fff; border: 1px solid var(--border); border-radius: 30px;
    padding: .6rem 1.5rem; color: var(--text-light); font-weight: 500; transition: var(--transition);
  }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

  /* ------------------------------------------------------------ Inputs */
  .form-label { font-size: .88rem; font-weight: 500; margin-bottom: .35rem; color: var(--text-dark); }
  .form-label .req { color: var(--danger); margin-left: 2px; }
  .form-control, .form-select {
    border: 1px solid #cbd5e1; border-radius: 12px; padding: .62rem .9rem;
    font-size: .93rem; font-weight: 300; transition: var(--transition);
  }
  .form-control:focus, .form-select:focus {
    border-color: var(--primary); box-shadow: 0 0 0 3px rgba(230, 92, 0, .12);
  }
  .form-control.is-invalid, .form-select.is-invalid { border-color: var(--danger); }
  .form-text { font-size: .78rem; color: var(--text-light); }
  .form-check-input:checked { background-color: var(--primary); border-color: var(--primary); }

  /* --------------------------------------------------------- Chip pick */
  .chip-group { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip {
    border: 1.5px solid var(--border); border-radius: 30px; padding: .42rem 1rem;
    font-size: .85rem; cursor: pointer; background: #fff; transition: var(--transition);
    user-select: none;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 500; }

  /* ----------------------------------------------------------- Stepper */
  .wizard-steps { display: flex; justify-content: space-between; max-width: 520px; margin: 0 auto 2.4rem; position: relative; }
  .wizard-steps::before {
    content: ''; position: absolute; top: 19px; left: 8%; right: 8%; height: 2px; background: var(--border); z-index: 0;
  }
  .wstep { position: relative; z-index: 1; text-align: center; flex: 1; }
  .wstep .dot {
    width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 2px solid #cbd5e1;
    color: var(--text-light); display: flex; align-items: center; justify-content: center;
    font-weight: 600; margin: 0 auto; transition: var(--transition); font-size: .95rem;
  }
  .wstep.active .dot { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 0 0 4px rgba(230, 92, 0, .16); }
  .wstep.done .dot { background: var(--success); border-color: var(--success); color: #fff; }
  .wstep .txt { font-size: .8rem; margin-top: .5rem; color: var(--text-light); }
  .wstep.active .txt { color: var(--primary); font-weight: 600; }

  /* ------------------------------------------------- Tracking stepper */
  .track-stepper { display: flex; position: relative; margin: 1.5rem 0 .5rem; }
  .track-stepper::before {
    content: ''; position: absolute; top: 22px; left: 10%; right: 10%; height: 3px;
    background: var(--border); border-radius: 3px;
  }
  .track-stepper .bar {
    position: absolute; top: 22px; left: 10%; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .6s ease;
  }
  .tstep { flex: 1; text-align: center; position: relative; z-index: 1; }
  .tstep .circle {
    width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 3px solid #cbd5e1;
    display: flex; align-items: center; justify-content: center; margin: 0 auto;
    color: var(--text-light); font-size: 1.05rem; transition: var(--transition);
  }
  .tstep.done .circle { background: linear-gradient(135deg, var(--primary), var(--accent)); border-color: var(--primary); color: #fff; }
  .tstep.now .circle { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); box-shadow: 0 0 0 5px rgba(230, 92, 0, .15); transform: scale(1.08); }
  .tstep .label { font-size: .8rem; margin-top: .6rem; color: var(--text-light); line-height: 1.35; }
  .tstep.now .label, .tstep.done .label { color: var(--text-dark); font-weight: 500; }
  .tstep .en { font-size: .66rem; color: #94a3b8; }
  @media (max-width: 767px) {
    .track-stepper { flex-direction: column; gap: 1.1rem; padding-left: .5rem; }
    .track-stepper::before, .track-stepper .bar { display: none; }
    .tstep { display: flex; align-items: center; gap: .9rem; text-align: left; }
    .tstep .label { margin-top: 0; }
  }

  /* ------------------------------------------------------------ Badges */
  .badge-status { border-radius: 30px; padding: .32rem .9rem; font-size: .78rem; font-weight: 500; color: #fff; display: inline-block; }
  .badge-soft { border-radius: 30px; padding: .25rem .8rem; font-size: .75rem; background: #f1f5f9; color: var(--text-light); display: inline-block; }

  /* ------------------------------------------------------------ Tables */
  .table-clean { font-size: .88rem; }
  .table-clean thead th {
    background: #f8fafc; border-bottom: 2px solid var(--border); font-weight: 500;
    font-size: .8rem; color: var(--text-light); white-space: nowrap; padding: .7rem .8rem;
  }
  .table-clean tbody td { padding: .75rem .8rem; vertical-align: middle; border-color: #f1f5f9; }
  .table-clean tbody tr:hover { background: #fffaf5; }
  .row-click { cursor: pointer; }

  /* -------------------------------------------------------- Admin tabs */
  .tab-pills { display: flex; gap: .4rem; flex-wrap: wrap; }
  .tab-pill {
    border: 1px solid var(--border); background: #fff; border-radius: 30px; padding: .45rem 1.1rem;
    font-size: .87rem; color: var(--text-light); cursor: pointer; transition: var(--transition);
  }
  .tab-pill:hover { border-color: var(--primary); color: var(--primary); }
  .tab-pill.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 500; }

  /* -------------------------------------------------------- Stat tiles */
  .stat-tile { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem 1.3rem; height: 100%; }
  .stat-tile .n { font-size: 1.85rem; font-weight: 700; line-height: 1.15; }
  .stat-tile .l { font-size: .8rem; color: var(--text-light); }
  .stat-tile .ico { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; }

  /* ------------------------------------------------------------- Chart */
  .bar-row { display: flex; align-items: center; gap: .7rem; margin-bottom: .55rem; font-size: .82rem; }
  .bar-row .name { width: 42%; color: var(--text-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .track { flex: 1; height: 9px; background: #f1f5f9; border-radius: 6px; overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--primary), var(--accent)); }
  .bar-row .val { width: 34px; text-align: right; font-weight: 500; }

  /* ------------------------------------------------------- Queue chips */
  .queue-chips { display: flex; flex-wrap: wrap; gap: .45rem; }
  .q-chip {
    --c: var(--primary);
    display: inline-flex; align-items: center; gap: .45rem; border-radius: 30px; padding: .4rem .95rem;
    font-size: .82rem; font-weight: 500; background: #fff; color: var(--text-dark);
    border: 1.5px solid var(--border); transition: var(--transition);
  }
  .q-chip .n { background: #f1f5f9; color: var(--text-light); border-radius: 20px; padding: 0 .5rem; font-size: .74rem; min-width: 1.6rem; text-align: center; }
  .q-chip:hover { border-color: var(--c); color: var(--c); }
  .q-chip.on { background: var(--c); border-color: var(--c); color: #fff; }
  .q-chip.on .n { background: rgba(255, 255, 255, .25); color: #fff; }
  .q-chip.alert .n { background: #fee2e2; color: var(--danger); }
  .q-chip.on.alert .n { background: rgba(255, 255, 255, .25); color: #fff; }
  .queue-meta { font-size: .76rem; color: var(--text-light); }
  .search-ico { position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: .8rem; pointer-events: none; }
  .ps-search { padding-left: 2rem; }
  .row-sub { font-size: .72rem; color: var(--text-light); margin-top: .15rem; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge-ok { border-radius: 30px; padding: .25rem .8rem; font-size: .75rem; background: #dcfce7; color: #166534; display: inline-block; }
  .set-group { font-size: .8rem; font-weight: 600; color: var(--primary); text-transform: none; padding-top: .4rem; border-top: 1px dashed var(--border); }
  .set-group:first-child { border-top: 0; padding-top: 0; }

  /* ---------------------------------------------------- CI library etc */
  .ci-strip { display: flex; align-items: center; gap: 1rem; background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 1rem 1.2rem; transition: var(--transition); }
  .ci-strip:hover { border-color: var(--primary); box-shadow: 0 8px 22px -12px rgba(230, 92, 0, .35); }
  .ci-strip-icon, .res-icon { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.15rem; }
  .stars { display: inline-flex; gap: .15rem; }
  .stars .star { background: none; border: 0; padding: .1rem; font-size: 1.7rem; line-height: 1; color: #cbd5e1; cursor: pointer; }
  .stars .star.on { color: #f59e0b; }
  .stars.static .star { font-size: 1rem; cursor: default; }
  .info-box { background: #fff5f5; border: 1px solid #fecaca; border-radius: 16px; padding: 1rem 1.1rem; }
  .archived-banner { background: #f1f5f9; border: 1px dashed #94a3b8; border-radius: 14px; padding: .75rem 1rem; font-size: .85rem; color: #334155; }
  .ed-item { border: 1px solid var(--border); border-radius: 12px; padding: .7rem; margin-bottom: .6rem; background: #fcfcfd; }
  .ed-chips { display: flex; flex-wrap: wrap; gap: .3rem .9rem; }

  /* ------------------------------------------------- Designer picker */
  .designer-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .55rem; }
  .dp-card { --c: var(--text-light); text-align: left; background: #fff; border: 1.5px solid var(--border); border-radius: 14px;
    padding: .7rem .8rem; display: grid; gap: .3rem; transition: var(--transition); cursor: pointer; color: var(--text-dark); }
  .dp-card:hover:not(:disabled) { border-color: var(--c); }
  .dp-card.on { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); background: color-mix(in srgb, var(--c) 6%, #fff); }
  .dp-card:disabled { opacity: .55; cursor: not-allowed; }
  .dp-err { display: none; color: var(--danger); font-size: .8rem; margin-top: .4rem; }
  .dp-invalid .dp-card:not(:disabled) { border-color: #fca5a5; }
  .dp-invalid .dp-err { display: block; }
  .dp-top { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: .9rem; }
  .dp-sub { font-size: .76rem; color: var(--text-light); line-height: 1.45; }
  .dp-check { margin-left: auto; color: var(--c); visibility: hidden; }
  .dp-card.on .dp-check { visibility: visible; }
  .cdot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--c, var(--text-light)); flex: 0 0 11px; }
  .mini-bar { height: 5px; border-radius: 4px; background: #f1f5f9; overflow: hidden; }
  .mini-bar > i { display: block; height: 100%; background: var(--c); }

  .as-list { display: grid; gap: .4rem; }
  .as-group { font-size: .76rem; color: var(--text-light); margin: .35rem 0 0 .2rem; }
  .who-sel { --c: #cbd5e1; position: relative; min-width: 170px; max-width: 230px; }
  .who-sel .cdot { position: absolute; left: .65rem; top: 50%; transform: translateY(-50%); pointer-events: none; z-index: 1; }
  .who-sel select { padding-left: 1.7rem; font-size: .8rem; border-radius: 10px; text-overflow: ellipsis; }
  .who-sel.none select { color: #b45309; border-color: #fcd34d; background-color: #fffbeb; }
  .as-opt { --c: var(--text-light); display: flex; align-items: center; gap: .6rem; border: 1.5px solid var(--border); border-radius: 12px;
    padding: .55rem .75rem; cursor: pointer; margin: 0; }
  .as-opt:has(input:checked) { border-color: var(--c); background: color-mix(in srgb, var(--c) 6%, #fff); }
  .as-main { display: grid; min-width: 0; flex: 1; }
  .as-title { font-weight: 600; font-size: .88rem; }
  .as-load { display: grid; gap: .2rem; font-size: .74rem; color: var(--text-light); width: 92px; flex: 0 0 92px; text-align: right; }
  .swatches { display: flex; flex-wrap: wrap; gap: .45rem; }
  .swatch { position: relative; cursor: pointer; margin: 0; }
  .swatch input { position: absolute; opacity: 0; pointer-events: none; }
  .swatch span { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--c); color: rgba(255,255,255,.85); font-size: .8rem; box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--border); }
  .swatch input:checked + span { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--c); }
  .swatch input:focus-visible + span { outline: 2px solid var(--text-dark); outline-offset: 4px; }

  /* ----------------------------------------------- Public workload panel */
  .workload-panel { max-width: 1100px; margin: 2rem auto 0; }
  .wp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: .5rem; margin-bottom: .9rem; }
  .wp-head h4 { margin: 0; font-weight: 600; font-size: 1.15rem; }
  .wl-row { --c: var(--text-light); display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 190px; gap: .9rem; align-items: center;
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px dashed var(--border); padding: .65rem .2rem; color: var(--text-dark); }
  .wl-row:last-child { border-bottom: 0; }
  .wl-row:hover, .wl-row.on { background: color-mix(in srgb, var(--c) 6%, transparent); border-radius: 10px; }
  .wl-row.dim { opacity: .4; }
  .wl-name { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: .9rem; min-width: 0; }
  .wl-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wl-mid { min-width: 0; }
  .wl-bar { height: 12px; border-radius: 8px; background: #f1f5f9; overflow: hidden; position: relative; }
  .wl-bar > i { position: absolute; inset: 0 auto 0 0; background: var(--c); border-radius: 8px; }
  .wl-meta { font-size: .8rem; text-align: right; white-space: nowrap; }
  .wl-meta strong { font-size: 1rem; }
  .lv { display: inline-block; font-size: .7rem; border-radius: 20px; padding: .05rem .5rem; margin-left: .35rem; }
  .lv.free { background: #dcfce7; color: #166534; } .lv.normal { background: #e0f2fe; color: #075985; }
  .lv.busy { background: #fef3c7; color: #92400e; } .lv.full { background: #fee2e2; color: #991b1b; }
  .pc-ev { --c: var(--text-light); display: flex; align-items: center; gap: .3rem; font-size: .7rem; line-height: 1.3; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; color: var(--text-dark); }
  .pc-ev span { overflow: hidden; text-overflow: ellipsis; }
  .pc-ev .cdot { width: 8px; height: 8px; flex-basis: 8px; }
  .wp-legend { display: flex; flex-wrap: wrap; gap: .35rem .9rem; font-size: .8rem; }
  .wp-legend button { --c: var(--text-light); background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: .35rem; color: var(--text-dark); }
  .wp-legend button.dim { opacity: .4; }
  .who { --c: var(--text-light); display: inline-flex; align-items: center; gap: .4rem; background: none; border: 0; padding: 0; color: var(--text-dark); font-size: .85rem; }
  @media (max-width: 767px) {
    .wp-table thead { display: none; }
    .wp-table tr { display: grid; grid-template-columns: 1fr auto; gap: .3rem .75rem; padding: .7rem 1rem;
      grid-template-areas: "project project" "due status" "who who"; border-bottom: 1px solid var(--border); }
    .wp-table td { display: block; padding: 0 !important; border: 0 !important; }
    .wp-table .w-project { grid-area: project; font-weight: 500; }
    .wp-table .w-due { grid-area: due; }
    .wp-table .w-status { grid-area: status; text-align: right; }
    .wp-table .w-who { grid-area: who; }
  }
  @media (max-width: 575px) {
    .wl-row { grid-template-columns: minmax(0, 1fr) auto; gap: .35rem .75rem; }
    .wl-row .wl-mid { grid-column: 1 / -1; grid-row: 2; }
  }

  /* ------------------------------------------------------------ Calendar */
  .cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-head div { font-size: .74rem; color: var(--text-light); text-align: center; padding: .2rem 0; }
  .cal-day { background: #fff; border: 1px solid var(--border); border-radius: 10px; min-height: 104px; padding: .3rem .35rem; overflow: hidden; }
