<script>
/* =========================================================================
   ui_Script_Admin — หน้าเจ้าหน้าที่: คิวงาน แดชบอร์ด คลังผลงาน และตั้งค่า
   ========================================================================= */
var Admin = (function () {
  var TOKEN_KEY = 'lartsDesignToken';
  var token = '';
  var user = null;
  var activeTab = 'queue';
  var queueCache = [];
  var queueLoadedAt = 0;
  var queueView = 'active';
  var queueLoading = false;
  var currentJob = null;
  var pendingJob = '';
  var usersCache = [];
  var lastCsv = '';
  var designerData = null;   // รายชื่อผู้ออกแบบพร้อมภาระงาน (apiAdminDesigners)
  var designerLoadedAt = 0;

  /* ------------------------------------------------------------- Session */

  /** ตรวจเซสชันที่จำไว้ คืน Promise ที่เสร็จเมื่อรู้แล้วว่าเข้าสู่ระบบอยู่หรือไม่ */
  function init() {
    try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { token = ''; }

    var tabs = document.querySelectorAll('#admin-tabs .tab-pill');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function () { switchTab(this.getAttribute('data-tab')); });
    }

    if (!token) return Promise.resolve(null);
    return App.api('apiVerifySession', [token]).then(function (u) {
      user = u;
      showUserMenu();
      return u;
    }).catch(function () {
      clearSession();
      return null;
    });
  }

  function isLoggedIn() { return !!token && !!user; }

  function isAdmin() { return isLoggedIn() && user.role === 'admin'; }

  /** จำเลขที่งานจากลิงก์ในอีเมล ไว้เปิดให้ทันทีหลังเข้าสู่ระบบ */
  function setPendingJob(jobId) { pendingJob = String(jobId || '').toUpperCase(); }

  function clearSession() {
    token = '';
    user = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    queueCache = [];
    queueLoadedAt = 0;
    showUserMenu();
  }

  function showUserMenu() {
    document.getElementById('user-menu').style.display = user ? '' : 'none';
    if (user) document.getElementById('user-name').textContent = user.name || user.email;
  }

  function login() {
    var email = document.getElementById('l-email').value.trim();
    var password = document.getElementById('l-password').value;
    if (!email || !password) { App.toast('กรุณากรอกอีเมลและรหัสผ่าน', 'err'); return; }
    var btn = document.getElementById('l-btn');
    btn.disabled = true;
    App.loading(true, 'กำลังตรวจสอบสิทธิ์...');
    App.api('apiLogin', [email, password]).then(function (res) {
      token = res.token;
      user = res.user;
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
      App.loading(false);
      btn.disabled = false;
      document.getElementById('l-password').value = '';
      showUserMenu();
      App.toast('ยินดีต้อนรับ ' + (user.name || user.email), 'ok');
      App.go('admin');
    }).catch(function (err) {
      App.loading(false);
      btn.disabled = false;
      App.toast(err.message, 'err');
    });
  }

  function logout() {
    clearSession();
    App.toast('ออกจากระบบเรียบร้อย', 'ok');
    App.go('home');
  }

  /** จัดการข้อผิดพลาดจากเซิร์ฟเวอร์ เซสชันหมดอายุจะพากลับไปหน้าเข้าสู่ระบบ */
  function handleAuthError(err) {
    App.loading(false);
    setRefreshing(false);
    if (err && err.code === 'AUTH') {
      if (currentJob) setPendingJob(currentJob.request.jobId);
      var modalEl = document.getElementById('jobModal');
      if (modalEl) bootstrap.Modal.getOrCreateInstance(modalEl).hide();
      clearSession();
      App.go('login');
    }
    App.toast(err.message, 'err');
  }

  function onEnter() {
    if (!isLoggedIn()) { App.go('login'); return; }
    switchTab(activeTab);
    if (pendingJob) {
      var id = pendingJob;
      pendingJob = '';
      openJob(id);
    }
  }

  function switchTab(tab) {
    activeTab = tab;
    var pills = document.querySelectorAll('#admin-tabs .tab-pill');
    for (var i = 0; i < pills.length; i++) {
      pills[i].classList.toggle('on', pills[i].getAttribute('data-tab') === tab);
    }
    ['queue', 'calendar', 'dashboard', 'assets', 'library', 'settings'].forEach(function (name) {
      document.getElementById('admin-' + name).classList.toggle('d-none', name !== tab);
    });
    var titles = {
      queue: 'คิวงานออกแบบ', calendar: 'ปฏิทินงานและภาระงาน', dashboard: 'แดชบอร์ดสรุปผลการให้บริการ',
      assets: 'คลังผลงาน', library: 'คลังไฟล์ CI', settings: 'ตั้งค่าระบบ'
    };
    document.getElementById('admin-title').textContent = titles[tab] || '';
    if (tab === 'queue') {
      // ใช้รายการที่โหลดไว้แสดงทันที แล้วค่อยโหลดใหม่เบื้องหลังถ้าเก่าเกิน 1 นาที
      if (queueCache.length > 0) renderQueue();
      if (Date.now() - queueLoadedAt > 60000) loadQueue({ quiet: queueCache.length > 0 });
    }
    if (tab === 'calendar') {
      renderCalendar();
      if (Date.now() - queueLoadedAt > 60000) loadQueue({ quiet: queueCache.length > 0 });
    }
    if (tab === 'library') loadLibrary();
    if (tab === 'dashboard') loadDashboard();
    if (tab === 'assets') loadAssets();
    if (tab === 'settings') loadSettings();
  }

  /* --------------------------------------------------------------- คิวงาน */

  function isClosed(r) { return r.status === 'DELIVERED' || r.status === 'CANCELLED'; }

  /** มุมมองคิวงาน: ปุ่มด้านบนตาราง กดแล้วกรองทันทีโดยไม่ต้องโหลดใหม่ */
  function queueViews() {
    var labels = {};
    (App.getCfg().statusLabels || []).forEach(function (s) { labels[s.key] = s; });
    var views = [
      { key: 'active', label: 'งานที่ยังไม่เสร็จ', color: 'var(--primary)',
        test: function (r) { return !isClosed(r); } },
      { key: 'overdue', label: 'เกินกำหนด', color: 'var(--danger)', alert: true,
        test: function (r) { return r.overdue; } },
      { key: 'draftLate', label: 'ร่างแรกเกินกำหนด', color: '#b45309', alert: true,
        test: function (r) { return r.draftOverdue; } }
    ];
    ['NEW', 'DESIGNING', 'REVIEW', 'REVISING', 'INFO_NEEDED', 'DELIVERED', 'CANCELLED'].forEach(function (k) {
      var info = labels[k] || { label: k, color: 'var(--primary)' };
      views.push({ key: k, label: info.label, color: info.color,
        test: function (r) { return r.status === k; } });
    });
    views.push({ key: 'all', label: 'ทั้งหมด', color: 'var(--text-dark)',
      test: function () { return true; } });
    return views;
  }

  function setQueueView(key) {
    queueView = key;
    renderQueue();
  }

  function setRefreshing(on) {
    var btn = document.getElementById('q-refresh');
    if (!btn) return;
    btn.disabled = on;
    btn.innerHTML = on ? '<i class="bi bi-arrow-clockwise spin me-1"></i>กำลังโหลด'
      : '<i class="bi bi-arrow-clockwise me-1"></i>รีเฟรช';
  }

  /**
   * โหลดคิวงานทั้งหมดครั้งเดียว แล้วค้นหาและกรองในเบราว์เซอร์ทันที
   * quiet = โหลดเบื้องหลังโดยไม่บังหน้าจอ (ใช้ตอนมีข้อมูลเดิมแสดงอยู่แล้ว)
   */
  function loadQueue(opts) {
    if (!isLoggedIn() || queueLoading) return;
    var quiet = opts && opts.quiet;
    queueLoading = true;
    if (!quiet && queueCache.length === 0) App.loading(true, 'กำลังโหลดคิวงาน...');
    setRefreshing(true);
    App.api('apiAdminList', [token, {}]).then(function (rows) {
      queueLoading = false;
      App.loading(false);
      setRefreshing(false);
      queueCache = rows;
      queueLoadedAt = Date.now();
      renderQueue();
      if (activeTab === 'calendar') renderCalendar();
    }).catch(function (err) {
      queueLoading = false;
      handleAuthError(err);
    });
  }

  function dueValue(r) {
    if (isClosed(r)) return 1e9;              // งานที่ปิดแล้วไว้ล่างสุด
    return r.daysLeft === null ? 1e8 : r.daysLeft;
  }

  function renderQueue() {
    var views = queueViews();
    var q = document.getElementById('q-search').value.trim().toLowerCase();
    var priority = document.getElementById('q-priority').value;
    var sort = document.getElementById('q-sort').value;

    var searched = queueCache.filter(function (r) {
      if (priority && r.priority !== priority) return false;
      if (!q) return true;
      return [r.jobId, r.projectName, r.requesterName, r.requesterEmail, r.department,
        r.requesterPhone, r.assignedTo].join(' ').toLowerCase().indexOf(q) >= 0;
    });

    var view = views.filter(function (v) { return v.key === queueView; })[0] || views[0];
    document.getElementById('queue-chips').innerHTML = views.map(function (v) {
      var n = searched.filter(v.test).length;
      if (n === 0 && v.key !== 'active' && v.key !== 'all' && v.key !== view.key) return '';
      return '<button type="button" class="q-chip' + (v.key === view.key ? ' on' : '') +
        (v.alert && n > 0 ? ' alert' : '') + '" style="--c:' + v.color + '" ' +
        'onclick="Admin.setQueueView(\'' + v.key + '\')">' + App.esc(v.label) +
        '<span class="n">' + n + '</span></button>';
    }).join('');

    var rows = searched.filter(view.test);
    rows.sort(function (a, b) {
      if (sort === 'due') {
        var d = dueValue(a) - dueValue(b);
        if (d !== 0) return d;
      }
      return a.createdAt < b.createdAt ? 1 : (a.createdAt > b.createdAt ? -1 : 0);
    });

    document.getElementById('queue-meta').textContent = queueLoadedAt
      ? 'แสดง ' + rows.length + ' จาก ' + queueCache.length + ' รายการ · อัปเดตล่าสุด ' +
        new Date(queueLoadedAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.'
      : '';

    var body = document.getElementById('queue-body');
    document.getElementById('queue-empty').classList.toggle('d-none', rows.length > 0);
    body.innerHTML = rows.map(function (r) {
      var dueHtml = App.shortDate(r.dueDate);
      if (r.daysLeft !== null && !isClosed(r)) {
        var color = r.daysLeft < 0 ? 'var(--danger)' : (r.daysLeft <= 3 ? 'var(--warning)' : 'var(--text-light)');
        var text = r.daysLeft < 0 ? 'เกิน ' + Math.abs(r.daysLeft) + ' วัน'
          : (r.daysLeft === 0 ? 'วันนี้' : 'อีก ' + r.daysLeft + ' วัน');
        dueHtml += '<div style="font-size:.72rem;color:' + color + '">' + text + '</div>';
      }
      if (r.draftDue) {
        var dl = r.draftDaysLeft;
        dueHtml += '<div class="row-sub" style="color:' + (r.draftOverdue ? '#b45309' : 'var(--text-light)') + '">' +
          '<i class="bi bi-pencil me-1"></i>ร่างแรก ' + (r.draftOverdue ? 'เกิน ' + Math.abs(dl) + ' วัน'
            : (dl === 0 ? 'วันนี้' : App.shortDate(r.draftDue))) + '</div>';
      }
      return '<tr class="row-click" onclick="Admin.openJob(\'' + App.esc(r.jobId) + '\')">' +
        '<td class="q-id"><strong style="color:var(--primary);white-space:nowrap">' + App.esc(r.jobId) + '</strong>' +
          '<div class="row-sub">' + App.shortDate(r.createdAt) + '</div></td>' +
        '<td class="q-project"><div style="font-weight:500">' + App.esc(r.projectName) + '</div>' +
          '<div class="row-sub">' + App.esc(r.requesterName) + ' &middot; ' + App.esc(r.department) + '</div></td>' +
        '<td class="q-due" style="white-space:nowrap">' + dueHtml + '</td>' +
        '<td class="q-status"><span class="badge-status" style="background:' + r.statusColor + '">' +
          App.esc(r.statusLabel) + '</span>' +
          (r.submitted ? '' : '<div class="row-sub"><i class="bi bi-hourglass me-1"></i>กำลังแนบไฟล์</div>') +
          (r.assignedTo ? '<div class="row-sub d-flex align-items-center gap-1">' + assigneeHtml(r.assignedTo) + '</div>' : '') +
        '</td>' +
        '<td class="q-pri"><span style="color:' + r.priorityColor + ';font-size:.82rem">' +
          (r.overdue ? '<i class="bi bi-exclamation-triangle-fill me-1"></i>' : '') +
          App.esc(r.priorityLabel) + '</span></td>' +
        '<td class="q-rev" style="font-size:.82rem"><span class="d-md-none">แก้ไข </span>' +
          r.revisionCount + '/' + r.revisionLimit + '</td>' +
        '<td class="q-go text-end"><i class="bi bi-chevron-right text-secondary"></i></td>' +
        '</tr>';
    }).join('');
  }

  /** อัปเดตแถวเดียวในคิวงานจากข้อมูลที่เซิร์ฟเวอร์ส่งกลับมา ไม่ต้องโหลดทั้งรายการใหม่ */
  function patchRow(row) {
    if (!row) return;
    var found = false;
    for (var i = 0; i < queueCache.length; i++) {
      if (queueCache[i].jobId === row.jobId) { queueCache[i] = row; found = true; break; }
    }
    if (!found) queueCache.unshift(row);
    if (activeTab === 'queue') renderQueue();
    if (activeTab === 'calendar') renderCalendar();
  }

  /* ------------------------------------------------------- รายละเอียดงาน */

  function openJob(jobId) {
    App.loading(true, 'กำลังโหลดรายละเอียด...');
    App.api('apiAdminGet', [token, jobId]).then(function (data) {
      App.loading(false);
      applyJob(data);
      bootstrap.Modal.getOrCreateInstance(document.getElementById('jobModal')).show();
    }).catch(handleAuthError);
  }

  /** แสดงข้อมูลงานล่าสุดในหน้าต่าง และอัปเดตแถวเดียวกันในคิวงาน */
  function applyJob(job) {
    if (!job) return;
    currentJob = job;
    renderJobModal(job);
    patchRow(job.row);
  }

  function reloadJob() {
    if (!currentJob) return Promise.resolve();
    return App.api('apiAdminGet', [token, currentJob.request.jobId]).then(applyJob).catch(handleAuthError);
  }

  function detail(label, value, isHtml) {
    if (!value) return '';
    return '<div class="detail-label">' + App.esc(label) + '</div>' +
      '<div class="detail-value">' + (isHtml ? value : App.nl2br(value)) + '</div>';
  }

  function starsHtml(n) {
    var out = '';
    for (var i = 1; i <= 5; i++) out += '<i class="bi bi-star-fill" style="color:' + (i <= n ? '#f59e0b' : '#e2e8f0') + '"></i>';
    return out;
  }

  function renderJobModal(data) {
    var r = data.request;
    var ro = !!data.archived; // งานที่ย้ายไปเก็บถาวรแล้ว ดูได้อย่างเดียว
    document.getElementById('jm-title').innerHTML =
      '<span style="color:var(--primary)">' + App.esc(r.jobId) + '</span> ' +
      '<span style="font-weight:400;font-size:.95rem">' + App.esc(r.projectName) + '</span>';

    // แสดงครบทุกสถานะ ขอบทึบคือขั้นถัดไปตามปกติ ขอบประคือข้ามขั้นหรือย้อนขั้น
    var statusPicker =
      '<div class="status-picker">' +
        '<div class="sp-head"><strong>เปลี่ยนสถานะ</strong>' +
          '<span><span class="sp-key next"></span>ขั้นถัดไปตามปกติ</span>' +
          '<span><span class="sp-key skip"></span>ข้ามขั้น / ย้อนขั้น</span></div>' +
        '<div class="sp-grid">' +
        (r.statusOptions || []).map(function (s) {
          if (s.kind === 'current') {
            return '<span class="sp-btn current" style="--c:' + s.color + '" title="สถานะปัจจุบัน">' +
              '<i class="bi bi-check-circle-fill"></i>' + App.esc(s.label) + '</span>';
          }
          return '<button type="button" class="sp-btn ' + s.kind + '" style="--c:' + s.color + '" ' +
            'onclick="Admin.changeStatus(\'' + s.key + '\')">' +
            '<i class="bi ' + s.icon + '"></i>' + App.esc(s.label) + '</button>';
        }).join('') +
        '</div>' +
      '</div>';

    var missing = r.briefMissing ? r.briefMissing.split(' | ').filter(function (x) { return !!x; }) : [];
    var briefBox = r.briefStatus === 'DONE'
      ? '<div class="brief-box">' + App.esc(r.briefText) + '</div>' +
        (missing.length > 0 ?
          '<div class="missing-box mt-2"><div class="fw-semibold mb-1" style="color:var(--danger)">' +
          '<i class="bi bi-question-circle me-1"></i>ข้อมูลที่ยังขาด (สอบถามผู้ขอในคราวเดียว)</div>' +
          '<ul class="mb-0" style="padding-left:1.1rem">' +
          missing.map(function (m) { return '<li>' + App.esc(m) + '</li>'; }).join('') + '</ul></div>' : '') +
        '<div class="mt-2" style="font-size:.75rem;color:var(--text-light)">สรุปโดย ' +
        (r.briefSource === 'AI' ? 'AI (Claude)' : 'ระบบอัตโนมัติ') + ' เมื่อ ' +
        App.thaiDate(r.briefGeneratedAt, true) + '</div>'
      : '<div class="text-center py-4" style="background:#fff;border:1px dashed var(--border);border-radius:14px">' +
        '<i class="bi bi-hourglass-split" style="font-size:1.6rem;color:var(--text-light)"></i>' +
        '<div style="font-size:.87rem;color:var(--text-light);margin-top:.5rem">' +
        (r.briefStatus === 'ERROR' ? 'สรุป Design Brief ไม่สำเร็จ' : 'ระบบกำลังสรุป Design Brief') +
        '</div></div>';

    var attachments = data.attachments;
    var sourceFiles = attachments.filter(function (f) { return f.kind === 'source'; });
    var finalFiles = attachments.filter(function (f) { return f.kind !== 'source'; });

    function fileRows(list, canDelete) {
      if (list.length === 0) return '<div style="font-size:.83rem;color:var(--text-light)">ไม่มีไฟล์</div>';
      return list.map(function (f) {
        return '<div class="file-row">' +
          '<i class="bi bi-file-earmark" style="color:var(--primary)"></i>' +
          '<a href="' + App.esc(f.fileUrl) + '" target="_blank" class="flex-grow-1 text-truncate">' +
            App.esc(f.fileName) + '</a>' +
          '<span style="font-size:.75rem;color:var(--text-light)">' + App.esc(f.sizeLabel) + '</span>' +
          (canDelete ? '<button class="btn btn-sm btn-link text-danger p-0 ms-1" ' +
            'onclick="Admin.deleteFile(\'' + f.id + '\')"><i class="bi bi-trash"></i></button>' : '') +
          '</div>';
      }).join('');
    }

    var revisionsHtml = data.revisions.length === 0
      ? '<div style="font-size:.83rem;color:var(--text-light)">ยังไม่มีการขอแก้ไข</div>'
      : data.revisions.map(function (v) {
          return '<div class="mb-2 pb-2" style="border-bottom:1px dashed var(--border)">' +
            '<div class="d-flex justify-content-between"><span class="badge-soft">รอบที่ ' + v.round + '</span>' +
            '<span style="font-size:.74rem;color:var(--text-light)">' + App.thaiDate(v.createdAt, true) +
            '</span></div><div style="font-size:.85rem;margin-top:.3rem">' + App.nl2br(v.comment) +
            '</div></div>';
        }).join('');

    var timelineHtml = data.timeline.slice().reverse().map(function (t) {
      var text = t.action === 'STATUS' && t.toLabel
        ? '<div>เปลี่ยนสถานะ ' + (t.fromLabel ? App.esc(t.fromLabel) + ' &rarr; ' : '') +
          '<strong>' + App.esc(t.toLabel) + '</strong></div>' +
          (t.detail ? '<div class="tl-note">' + App.nl2br(t.detail) + '</div>' : '')
        : '<div>' + App.esc(t.detail || t.action) + '</div>';
      return '<div class="timeline-item"><div class="tl-dot"><i class="bi bi-dot"></i></div>' +
        '<div class="tl-body">' + text +
        '<div class="tl-time">' + App.thaiDate(t.at, true) + ' &middot; ' +
        App.esc(t.actor || 'ระบบ') + '</div></div></div>';
    }).join('');

    document.getElementById('jm-body').innerHTML =
    '<div class="row g-3">' +
      '<div class="col-lg-7">' +
        '<div class="card-soft p-3 p-md-4 mb-3">' +
          '<div class="d-flex flex-wrap gap-2 align-items-center mb-3">' +
            '<span class="badge-status" style="background:' + r.statusColor + '">' +
              App.esc(r.statusLabel) + '</span>' +
            '<span class="badge-soft" style="color:' + r.priorityColor + '">' +
              App.esc(r.priorityLabel) + '</span>' +
            '<span class="badge-soft">แก้ไข ' + r.revisionCount + '/' + r.revisionLimit + ' รอบ</span>' +
            (r.approved ? '<span class="badge-ok" title="อนุมัติเมื่อ ' + App.esc(App.thaiDate(r.approvedAt, true)) + '">' +
              '<i class="bi bi-hand-thumbs-up-fill me-1"></i>ผู้ขออนุมัติร่างแล้ว พร้อมส่งมอบ</span>' : '') +
            (r.assignedTo ? '<span class="badge-soft d-inline-flex align-items-center gap-1">' +
              assigneeHtml(r.assignedTo) + '</span>' : '') +
          '</div>' +
          (ro ? '<div class="archived-banner mb-3"><i class="bi bi-archive me-1"></i>' +
            'งานนี้ย้ายไปเก็บถาวรแล้ว ดูข้อมูลได้อย่างเดียว แก้ไขหรือเปลี่ยนสถานะไม่ได้</div>' : statusPicker) +
          (ro ? '' : '<div class="d-flex flex-wrap gap-2 mb-3">' +

  function edField(id, label, value, opts) {
    var o = opts || {};
    var input = o.type === 'textarea'
      ? '<textarea class="form-control form-control-sm" id="' + id + '" rows="' + (o.rows || 2) + '">' +
        App.esc(value) + '</textarea>'
      : '<input type="' + (o.type || 'text') + '" class="form-control form-control-sm" id="' + id + '"' +
        (o.list ? ' list="' + o.list + '"' : '') + ' value="' + App.esc(value) + '">';
    return '<div class="' + (o.col || 'col-md-6') + '"><label class="form-label" for="' + id + '">' +
      App.esc(label) + (o.req ? '<span class="req">*</span>' : '') + '</label>' + input + '</div>';
  }

  function edItemHtml(it) {
    var cfg = App.getCfg();
    var isOther = it.mediaType === 'other';
    return '<div class="ed-item"><div class="row g-2 align-items-end">' +
      '<div class="col-md-4"><label class="form-label">ประเภทสื่อ</label>' +
        '<select class="form-select form-select-sm ed-media" onchange="Admin.editMediaChange(this)">' +
        cfg.mediaTypes.map(function (m) {
          return '<option value="' + m.key + '"' + (m.key === it.mediaType ? ' selected' : '') + '>' +
            App.esc(m.label) + '</option>';
        }).join('') + '</select>' +
        '<input type="text" class="form-control form-control-sm mt-1 ed-other' + (isOther ? '' : ' d-none') +
          '" placeholder="ระบุประเภทสื่อ" value="' + App.esc(it.mediaOther || '') + '"></div>' +
      '<div class="col-md-3"><label class="form-label">ขนาด</label>' +
        '<input type="text" class="form-control form-control-sm ed-size" list="ed-size-list" value="' +
        App.esc(it.size || '') + '"></div>' +

        '<input type="number" min="1" max="1000" class="form-control form-control-sm ed-qty" value="' +
        (it.quantity || 1) + '"></div>' +

  /** เปิดฟอร์มแก้ไขข้อมูลคำขอ (draft = ค่าที่กรอกค้างไว้ เมื่อบันทึกไม่ผ่านแล้วเปิดใหม่) */
  function editRequest(draft) {
    if (!currentJob || !currentJob.edit) return;
    var e = draft || currentJob.edit;
    var cfg = App.getCfg();
    var sizes = {};
    cfg.mediaTypes.forEach(function (m) { (m.sizes || []).forEach(function (z) { sizes[z] = true; }); });
    var channels = cfg.channels.slice();
    (e.channels || []).forEach(function (c) { if (channels.indexOf(c) < 0) channels.push(c); });

    var html =
      '<datalist id="ed-size-list">' + Object.keys(sizes).map(function (z) {
        return '<option value="' + App.esc(z) + '">'; }).join('') + '</datalist>' +

        return '<option value="' + App.esc(d) + '">'; }).join('') + '</datalist>' +
      '<div class="rules-box mb-3" style="font-size:.83rem">แก้เฉพาะช่องที่ต้องการ ระบบบันทึกในประวัติว่าใครแก้อะไร ' +
        'ถ้าแก้ข้อมูลที่ใช้สรุปโจทย์ ระบบจะสรุป Design Brief ใหม่ให้อัตโนมัติ</div>' +
      '<div class="row g-2">' +
        '<div class="col-12 set-group">โครงการ</div>' +
        edField('ed-projectName', 'ชื่อโครงการ / กิจกรรม', e.projectName, { col: 'col-12', req: true }) +
        edField('ed-dueDate', 'กำหนดใช้งาน', e.dueDate, { type: 'date', req: true }) +
        edField('ed-eventDate', 'วันจัดกิจกรรม', e.eventDate, { type: 'date' }) +
        edField('ed-rushReason', 'เหตุผลความเร่งด่วน', e.rushReason, { col: 'col-12' }) +
        '<div class="col-12 set-group mt-2">ผู้ประสานงาน</div>' +
        edField('ed-requesterName', 'ชื่อ-นามสกุล', e.requesterName, { req: true }) +
        edField('ed-department', 'หน่วยงาน', e.department, { list: 'ed-dept-list', req: true }) +
        edField('ed-requesterEmail', 'อีเมล', e.requesterEmail, { type: 'email', req: true }) +
        edField('ed-requesterPhone', 'โทรศัพท์', e.requesterPhone, { type: 'tel', req: true }) +
        edField('ed-lineId', 'LINE ID', e.lineId) +
        '<div class="col-12 set-group mt-2">รายละเอียดงาน</div>' +
        edField('ed-objective', 'วัตถุประสงค์', e.objective, { type: 'textarea', col: 'col-12', req: true }) +
        edField('ed-targetAudience', 'กลุ่มเป้าหมาย', e.targetAudience, { req: true }) +
        edField('ed-referenceUrl', 'ลิงก์ตัวอย่างอ้างอิง', e.referenceUrl, { type: 'url' }) +
        edField('ed-keyMessage', 'ข้อความหลัก', e.keyMessage, { type: 'textarea', col: 'col-12', req: true }) +
        edField('ed-mandatoryText', 'ข้อความบังคับบนชิ้นงาน', e.mandatoryText, { type: 'textarea', col: 'col-12', rows: 3 }) +
        edField('ed-notes', 'หมายเหตุ', e.notes, { type: 'textarea', col: 'col-12' }) +
        '<div class="col-12"><label class="form-label">ช่องทางเผยแพร่<span class="req">*</span></label>' +
          '<div class="ed-chips" id="ed-channels">' + channels.map(function (c, i) {
            return '<div class="form-check"><input class="form-check-input" type="checkbox" id="ed-ch-' + i +
              '" value="' + App.esc(c) + '"' + ((e.channels || []).indexOf(c) >= 0 ? ' checked' : '') + '>' +
              '<label class="form-check-label" for="ed-ch-' + i + '">' + App.esc(c) + '</label></div>';
          }).join('') + '</div></div>' +
        '<div class="col-12 set-group mt-2">รายการชิ้นงาน</div>' +
        '<div class="col-12"><div id="ed-items">' + (e.deliverables || []).map(edItemHtml).join('') + '</div>' +

          '<i class="bi bi-plus-lg me-1"></i>เพิ่มชิ้นงาน</button></div>' +
      '</div>';

    App.prompt({
      title: 'แก้ไขข้อมูลคำขอ ' + currentJob.request.jobId, html: html, size: 'lg', okLabel: 'บันทึกการแก้ไข',
      checkbox: { label: 'ส่งอีเมลแจ้งผู้ขอว่ามีการปรับข้อมูล', checked: false,
        hint: 'เหมาะกับการเลื่อนกำหนดใช้งานหรือเปลี่ยนชิ้นงานที่ตกลงกันแล้ว' }
    }).then(function (result) {
      if (result === null) return;
      var payload = readEditForm();
      App.loading(true, 'กำลังบันทึกการแก้ไข...');
      return App.api('apiAdminEditRequest', [token, currentJob.request.jobId, payload, { notify: result.checked }])
        .then(function (res) {
          App.loading(false);
          applyJob(res.job);
          App.toast(res.changes.length === 0 ? 'ไม่มีข้อมูลที่เปลี่ยนแปลง'
            : 'บันทึกการแก้ไข ' + res.changes.length + ' รายการ' +
              (res.briefQueued ? ' ระบบกำลังสรุป Design Brief ใหม่' : '') +
              (res.notified ? ' และแจ้งผู้ขอทางอีเมลแล้ว' : ''), 'ok');
        }).catch(function (err) {
          if (err.code === 'AUTH') { handleAuthError(err); return; }
          App.loading(false);
          App.toast(err.message, 'err');
          setTimeout(function () { editRequest(payload); }, 400); // เปิดฟอร์มเดิมพร้อมค่าที่กรอกไว้
        });
    }).catch(handleAuthError);
  }

  function readEditForm() {
    function v(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
    var payload = {};
    ['projectName', 'dueDate', 'eventDate', 'rushReason', 'requesterName', 'department', 'requesterEmail',
      'requesterPhone', 'lineId', 'objective', 'targetAudience', 'referenceUrl', 'keyMessage',
      'mandatoryText', 'notes'].forEach(function (k) { payload[k] = v('ed-' + k); });
    payload.channels = Array.prototype.filter.call(
      document.querySelectorAll('#ed-channels input'), function (c) { return c.checked; }
    ).map(function (c) { return c.value; });
    payload.deliverables = Array.prototype.map.call(document.querySelectorAll('#ed-items .ed-item'), function (row) {
      return {
        mediaType: row.querySelector('.ed-media').value,
        mediaOther: row.querySelector('.ed-other').value.trim(),
        size: row.querySelector('.ed-size').value.trim(),
        quantity: +row.querySelector('.ed-qty').value || 1,
        note: row.querySelector('.ed-note').value.trim()
      };
    });
    return payload;
  }

  var calMonth = null;
  var calOpts = { due: true, event: true, draft: true, closed: false, byDesigner: false };
  var TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

  function ymd(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function calMove(step) {
    var base = calMonth || new Date();
    calMonth = step === 0 ? new Date() : new Date(base.getFullYear(), base.getMonth() + step, 1);
    renderCalendar();
  }

  function calToggle(key) {
    calOpts[key] = !calOpts[key];
    renderCalendar();
  }

  /** รายการบนปฏิทิน แยกตามวัน (กำหนดใช้งาน วันจัดกิจกรรม กำหนดส่งร่างแรก) */
  function calendarEvents() {
    var byDay = {};
    function add(day, ev) {
      if (!day) return;
      var k = String(day).substring(0, 10);
      (byDay[k] = byDay[k] || []).push(ev);
    }
    queueCache.forEach(function (r) {
      if (isClosed(r) && !calOpts.closed) return;
      if (calOpts.due) add(r.dueDate, { r: r, kind: 'due', icon: 'bi-flag-fill', text: 'ใช้งาน' });
      if (calOpts.event && r.eventDate) add(r.eventDate, { r: r, kind: 'event', icon: 'bi-calendar-event', text: 'จัดงาน' });
      if (calOpts.draft && r.draftDue) add(r.draftDue, { r: r, kind: 'draft', icon: 'bi-pencil', text: 'ส่งร่างแรก' });
    });
    return byDay;
  }

  function evHtml(ev) {
    var r = ev.r;
    var color = calOpts.byDesigner ? designerColor(r.assignedTo) : r.statusColor;
    return '<button type="button" class="cal-ev ' + (ev.kind === 'due' ? '' : ev.kind) + '" style="--c:' + color +
      '" title="' + App.esc(ev.text + ': ' + r.jobId + ' ' + r.projectName + ' (' + r.statusLabel + ')') +
      '" onclick="Admin.openJob(\'' + App.esc(r.jobId) + '\')"><i class="bi ' + ev.icon + ' me-1"></i>' +
      App.esc(r.projectName) + '</button>';
  }

  function workloadHtml() {
    var groups = {};
    function group(name) {
      var k = dKey(name);
      return groups[k] = groups[k] || { name: name, total: 0, overdue: 0, week: 0, draftLate: 0, d: designerOf(name) };
    }
    // ผู้ออกแบบที่ยังไม่มีงานก็แสดง เพื่อให้เห็นว่าใครว่าง
    (App.getCfg().designers || []).forEach(function (d) { group(d.name); });
    queueCache.filter(function (r) { return !isClosed(r) && r.submitted; }).forEach(function (r) {
      var g = group(r.assignedTo || '');
      g.total++;
      if (r.overdue) g.overdue++;
      if (r.daysLeft !== null && r.daysLeft >= 0 && r.daysLeft <= 7) g.week++;
      if (r.draftOverdue) g.draftLate++;
    });
    var list = Object.keys(groups).map(function (k) { return groups[k]; })
      .filter(function (g) { return g.name || g.total > 0; })
      .sort(function (a, b) { return (a.name ? 0 : 1) - (b.name ? 0 : 1) || b.total - a.total; });
    if (list.length === 0) return '<div class="row-sub">ยังไม่มีงานที่กำลังดำเนินการ</div>';
    var max = list.reduce(function (m, g) { return Math.max(m, g.total); }, 1);
    return list.map(function (g) {
      var color = g.d ? g.d.color : (g.name ? '' : '#94a3b8');
      return '<div class="mb-3">' +
        '<div class="d-flex justify-content-between gap-2" style="font-size:.86rem">' +
          '<span class="fw-semibold d-flex align-items-center gap-2" style="min-width:0">' +
            (color ? '<i class="cdot" style="--c:' + color + '"></i>' : '') +
            (g.name ? App.esc(g.name) : '<span style="color:var(--danger)">ยังไม่มอบหมาย</span>') +
          '</span><span style="white-space:nowrap">' + g.total + (g.d ? ' / ' + g.d.capacity : '') + ' งาน</span></div>' +
        '<div class="load-bar my-1"><div style="width:' + Math.round(g.total / max * 100) + '%' +
          (color ? ';background:' + color : '') + '"></div></div>' +
        '<div class="row-sub mt-0">ครบกำหนดใน 7 วัน ' + g.week + ' &middot; ' +
          '<span style="color:' + (g.overdue ? 'var(--danger)' : 'inherit') + '">เกินกำหนด ' + g.overdue + '</span>' +
          (g.draftLate ? ' &middot; <span style="color:#b45309">ร่างแรกเกิน ' + g.draftLate + '</span>' : '') +
        '</div></div>';
    }).join('');
  }

  function renderCalendar() {
    var box = document.getElementById('admin-calendar');
    if (!box) return;
    if (!calMonth) calMonth = new Date();
    var y = calMonth.getFullYear();
    var m = calMonth.getMonth();
    var first = new Date(y, m, 1);
    var start = new Date(y, m, 1 - first.getDay());
    var todayKey = ymd(new Date());
    var byDay = calendarEvents();

    var cells = '';
    var agenda = '';
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (i >= 35 && d.getMonth() !== m) break;
      var key = ymd(d);
      var evs = byDay[key] || [];
      var cls = 'cal-day' + (d.getMonth() !== m ? ' out' : '') + (key === todayKey ? ' today' : '') +
        (d.getDay() === 0 || d.getDay() === 6 ? ' weekend' : '');
      cells += '<div class="' + cls + '"><div class="cal-num">' + d.getDate() + '</div>' +
        evs.slice(0, 4).map(evHtml).join('') +
        (evs.length > 4 ? '<div class="cal-more">+ อีก ' + (evs.length - 4) + ' รายการ</div>' : '') + '</div>';
      if (d.getMonth() === m && evs.length) {
        agenda += '<div class="mb-2"><div class="cal-num' + (key === todayKey ? '" style="color:var(--primary)' : '') + '">' +
          App.thaiDate(key) + '</div>' + evs.map(evHtml).join('') + '</div>';
      }
    }

    function toggle(key, label) {
      return '<div class="form-check form-check-inline me-2"><input class="form-check-input" type="checkbox" id="cal-' + key +
        '"' + (calOpts[key] ? ' checked' : '') + ' onchange="Admin.calToggle(\'' + key + '\')">' +
        '<label class="form-check-label" for="cal-' + key + '" style="font-size:.82rem">' + label + '</label></div>';
    }

    box.innerHTML =
      '<div class="row g-3">' +
        '<div class="col-lg-9"><div class="card-soft p-3">' +
          '<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">' +
            '<div class="d-flex align-items-center gap-2">' +
              '<button class="btn btn-sm btn-ghost px-2" onclick="Admin.calMove(-1)" title="เดือนก่อน"><i class="bi bi-chevron-left"></i></button>' +
              '<div class="fw-semibold" style="min-width:150px;text-align:center">' + TH_MONTHS[m] + ' ' + (y + 543) + '</div>' +
              '<button class="btn btn-sm btn-ghost px-2" onclick="Admin.calMove(1)" title="เดือนถัดไป"><i class="bi bi-chevron-right"></i></button>' +
              '<button class="btn btn-sm btn-ghost" onclick="Admin.calMove(0)">วันนี้</button>' +
            '</div>' +
            '<div>' + toggle('due', '<i class="bi bi-flag-fill"></i> กำหนดใช้งาน') +
              toggle('event', '<i class="bi bi-calendar-event"></i> วันจัดงาน') +
              toggle('draft', '<i class="bi bi-pencil"></i> ส่งร่างแรก') +
              toggle('closed', 'รวมงานที่ปิดแล้ว') + toggle('byDesigner', 'สีตามผู้ออกแบบ') + '</div>' +
          '</div>' +
          '<div class="cal-head"><div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div></div>' +
          '<div class="cal-grid">' + cells + '</div>' +
          '<div class="cal-agenda">' + (agenda || '<div class="row-sub">ไม่มีงานในเดือนนี้</div>') + '</div>' +
          '<div class="cal-legend mt-2">' + (calOpts.byDesigner ? designerLegendHtml() : 'สีตามสถานะงาน') +
            ' &middot; ขอบทึบ = กำหนดใช้งาน &middot; ขอบจุด = วันจัดงาน ' +
            '&middot; ขอบประ = กำหนดส่งร่างแรก &middot; กดที่งานเพื่อเปิดรายละเอียด</div>' +
        '</div></div>' +
        '<div class="col-lg-3"><div class="card-soft p-3">' +
          '<div class="fw-semibold mb-3"><i class="bi bi-people me-2" style="color:var(--primary)"></i>ภาระงานแต่ละคน</div>' +
          workloadHtml() +
          '<div class="form-text">นับเฉพาะงานที่ยังไม่ปิด มอบหมายงานได้ที่ปุ่ม "มอบหมาย" ในหน้ารายละเอียดงาน</div>' +
        '</div></div>' +
      '</div>';
  }

  /* --------------------------------------------------------- คลังไฟล์ CI */

  var libraryData = null;

  function loadLibrary() {
    App.loading(true, 'กำลังโหลดคลังไฟล์ CI...');
    App.api('apiAdminResources', [token]).then(function (data) {
      App.loading(false);
      libraryData = data;
      renderLibrary();
    }).catch(handleAuthError);
  }

  function renderLibrary() {
    var d = libraryData;
    var rows = d.items.map(function (r) {
      return '<tr><td><div class="fw-semibold" style="font-size:.88rem">' + App.esc(r.title) + '</div>' +
          (r.description ? '<div class="row-sub">' + App.esc(r.description) + '</div>' : '') + '</td>' +
        '<td style="font-size:.82rem">' + App.esc(r.category) + '</td>' +
        '<td style="font-size:.82rem"><a href="' + App.esc(r.kind === 'link' ? r.url : r.url) + '" target="_blank">' +
          (r.kind === 'link' ? '<i class="bi bi-link-45deg me-1"></i>ลิงก์' :
            '<i class="bi bi-file-earmark me-1"></i>' + App.esc(r.ext) + ' ' + App.esc(r.sizeLabel)) + '</a></td>' +
        '<td>' + (r.active ? '<span class="badge-ok">แสดง</span>' : '<span class="badge-soft">ซ่อน</span>') + '</td>' +
        '<td class="text-end" style="white-space:nowrap">' +
          '<button class="btn btn-sm btn-link p-0 me-2" onclick="Admin.editResource(\'' + App.esc(r.id) + '\')">แก้ไข</button>' +
          '<button class="btn btn-sm btn-link p-0 text-danger" onclick="Admin.deleteResource(\'' + App.esc(r.id) + '\')">ลบ</button>' +
        '</td></tr>';
    }).join('');
    document.getElementById('admin-library').innerHTML =
      '<div class="card-soft p-3 p-md-4 mb-3">' +
        '<div class="d-flex flex-wrap justify-content-between align-items-center gap-2">' +
          '<div style="font-size:.87rem;color:var(--text-light)">ไฟล์ในคลังนี้ทุกคนดาวน์โหลดได้เองโดยไม่ต้องเข้าสู่ระบบ ' +
            'แจกลิงก์ด้านขวาให้หน่วยงานได้เลย</div>' +
          '<div class="d-flex gap-2">' +
            (d.pageUrl ? '<button class="btn btn-sm btn-ghost" onclick="Admin.copyText(this, \'' + App.esc(d.pageUrl) + '\')">' +
              '<i class="bi bi-clipboard me-1"></i>คัดลอกลิงก์หน้าคลังไฟล์</button>' : '') +
            '<button class="btn btn-sm btn-brand" onclick="Admin.editResource(\'\')"><i class="bi bi-plus-lg"></i>เพิ่มรายการ</button>' +
          '</div></div></div>' +
      (d.items.length === 0
        ? '<div class="card-soft empty-state"><i class="bi bi-palette"></i><p class="mt-3 mb-0">ยังไม่มีไฟล์ในคลัง ' +
          'เริ่มจากโลโก้คณะและเทมเพลตที่ใช้บ่อย</p></div>'
        : '<div class="card-soft p-0 overflow-hidden"><div class="table-responsive"><table class="table table-clean mb-0">' +
          '<thead><tr><th>รายการ</th><th>หมวด</th><th>ไฟล์</th><th>สถานะ</th><th></th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table></div></div>');
  }

  function editResource(id, draft) {
    var cats = (libraryData && libraryData.categories) || App.getCfg().resourceCategories || [];
    var r = draft || (libraryData.items.filter(function (x) { return x.id === id; })[0]) ||
      { id: '', title: '', description: '', category: cats[0], kind: 'file', url: '', active: true, sortOrder: 0 };
    var isNew = !r.id;
    App.prompt({
      title: isNew ? 'เพิ่มรายการในคลังไฟล์ CI' : 'แก้ไข ' + r.title,
      html:
        '<div class="mb-2"><label class="form-label">ชื่อรายการ<span class="req">*</span></label>' +
          '<input type="text" class="form-control" id="res-title" maxlength="150" value="' + App.esc(r.title) +
          '" placeholder="เช่น โลโก้คณะศิลปศาสตร์ (ไฟล์เวกเตอร์)"></div>' +
        '<div class="mb-2"><label class="form-label">หมวด</label><select class="form-select" id="res-category">' +
          cats.map(function (c) { return '<option' + (c === r.category ? ' selected' : '') + '>' + App.esc(c) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="mb-2"><label class="form-label">คำอธิบาย</label>' +
          '<textarea class="form-control" id="res-desc" rows="2" maxlength="500" ' +
          'placeholder="เช่น ใช้กับพื้นหลังสีขาว ห้ามยืดหรือเปลี่ยนสี">' + App.esc(r.description) + '</textarea></div>' +
        '<div class="mb-2"><label class="form-label">ชนิด</label><div>' +
          '<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="res-kind" id="res-kind-file" value="file"' +
            (r.kind !== 'link' ? ' checked' : '') + ' onchange="Admin.resKindChange()"><label class="form-check-label" for="res-kind-file">อัปโหลดไฟล์</label></div>' +
          '<div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="res-kind" id="res-kind-link" value="link"' +
            (r.kind === 'link' ? ' checked' : '') + ' onchange="Admin.resKindChange()"><label class="form-check-label" for="res-kind-link">ลิงก์ (Canva, Drive ฯลฯ)</label></div>' +
        '</div></div>' +
        '<div class="mb-2" id="res-file-wrap"><input type="file" class="form-control" id="res-file">' +
          '<div class="form-text">' + (isNew || r.kind === 'link' ? '' : 'เว้นว่างไว้ถ้าไม่ต้องการเปลี่ยนไฟล์ ') +
          'ไม่เกิน 25 MB ไฟล์ใหญ่กว่านี้ให้อัปโหลดไว้ใน Drive แล้วเลือกแบบลิงก์</div></div>' +
        '<div class="mb-2 d-none" id="res-url-wrap"><input type="url" class="form-control" id="res-url" placeholder="https://..." value="' +
          App.esc(r.kind === 'link' ? r.url : '') + '"></div>' +
        '<div class="row g-2 align-items-end"><div class="col-6"><label class="form-label">ลำดับในหมวด</label>' +
          '<input type="number" class="form-control" id="res-order" min="0" max="999" value="' + (r.sortOrder || 0) + '"></div>' +
          '<div class="col-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="res-active"' +
          (r.active !== false ? ' checked' : '') + '><label class="form-check-label" for="res-active">แสดงให้ผู้ขอเห็น</label></div></div></div>',
      okLabel: 'บันทึก'
    }).then(function (ok) {
      if (!ok) return;
      var kind = document.getElementById('res-kind-link').checked ? 'link' : 'file';
      var payload = {
        id: r.id, title: document.getElementById('res-title').value.trim(),
        category: document.getElementById('res-category').value,
        description: document.getElementById('res-desc').value.trim(),
        kind: kind, url: document.getElementById('res-url').value.trim(),
        sortOrder: +document.getElementById('res-order').value || 0,
        active: document.getElementById('res-active').checked
      };
      var file = kind === 'file' ? document.getElementById('res-file').files[0] : null;
      if (file && file.size > 25 * 1048576) {
        App.toast('ไฟล์ใหญ่เกิน 25 MB กรุณาอัปโหลดไว้ใน Drive แล้วเลือกแบบลิงก์', 'err');
        setTimeout(function () { editResource(id, payload); }, 400);
        return;
      }
      App.loading(true, file ? 'กำลังอัปโหลด ' + file.name + '...' : 'กำลังบันทึก...');
      var ready = file ? new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function (e) {
          var s2 = String(e.target.result);
          resolve({ fileName: file.name, mimeType: file.type || 'application/octet-stream',
            dataB64: s2.indexOf(',') >= 0 ? s2.substring(s2.indexOf(',') + 1) : s2 });
        };
        reader.onerror = function () { reject(new Error('อ่านไฟล์ไม่สำเร็จ')); };
        reader.readAsDataURL(file);
      }) : Promise.resolve(null);
      return ready.then(function (f) {
        if (f) payload.file = f;
        return App.api('apiAdminSaveResource', [token, payload]);
      }).then(function (res) {
        App.loading(false);
        libraryData.items = res.items;
        Library.invalidate();
        renderLibrary();
        App.toast('บันทึก "' + res.item.title + '" เรียบร้อย', 'ok');
      }).catch(function (err) {
        if (err.code === 'AUTH') { handleAuthError(err); return; }
        App.loading(false);
        App.toast(err.message, 'err');
        delete payload.file;
        setTimeout(function () { editResource(id, payload); }, 400);
      });
    }).catch(handleAuthError);
    setTimeout(resKindChange, 0);
  }

  function resKindChange() {
    var link = document.getElementById('res-kind-link');
    if (!link) return;
    document.getElementById('res-file-wrap').classList.toggle('d-none', link.checked);
    document.getElementById('res-url-wrap').classList.toggle('d-none', !link.checked);
  }

  function deleteResource(id) {
    var r = libraryData.items.filter(function (x) { return x.id === id; })[0];
    if (!r) return;
    App.prompt({
      title: 'ลบรายการ',
      html: '<p style="font-size:.9rem">ลบ "' + App.esc(r.title) + '" ออกจากคลังไฟล์ CI ' +
        (r.kind === 'file' ? 'ไฟล์จะถูกย้ายลงถังขยะของ Drive (กู้คืนได้ภายใน 30 วัน)' : '') + '</p>' +
        '<div class="form-text">ถ้าแค่ไม่อยากให้ผู้ขอเห็นชั่วคราว ให้กดแก้ไขแล้วปิด "แสดงให้ผู้ขอเห็น" แทน</div>',
      okLabel: 'ลบ'
    }).then(function (ok) {
      if (!ok) return;
      App.loading(true, 'กำลังลบ...');
      return App.api('apiAdminDeleteResource', [token, id]).then(function (res) {
        App.loading(false);
        libraryData.items = res.items;
        Library.invalidate();
        renderLibrary();
        App.toast('ลบรายการเรียบร้อย', 'ok');
      });
    }).catch(handleAuthError);
  }

  /* ------------------------------------------------- ย้ายข้อมูลไปเก็บถาวร */

  function archiveCutoffs() {
    var now = new Date();
    var fyStart = now.getMonth() >= 9 ? now.getFullYear() : now.getFullYear() - 1;
    return [
      { value: fyStart + '-10-01', label: 'งานที่ปิดก่อนปีงบประมาณ ' + (fyStart + 544) + ' (ก่อน 1 ต.ค. ' + (fyStart + 543) + ')' },
      { value: (fyStart - 1) + '-10-01', label: 'งานที่ปิดก่อนปีงบประมาณ ' + (fyStart + 543) + ' (ก่อน 1 ต.ค. ' + (fyStart + 542) + ')' }
    ];
  }

  function archivePreview() {
    var cutoff = document.getElementById('arch-cutoff').value;
    App.loading(true, 'กำลังตรวจสอบ...');
    App.api('apiAdminArchivePreview', [token, cutoff]).then(function (p) {
      App.loading(false);
      if (p.count === 0) { App.toast('ไม่มีงานที่ปิดก่อนวันที่เลือก ยังไม่ต้องย้าย', 'ok'); return; }
      return App.prompt({
        title: 'ย้ายข้อมูล ' + p.count + ' งานไปเก็บถาวร',
        html: '<div class="rules-box mb-3" style="font-size:.84rem">' +
          'จะย้ายงานที่ <strong>ส่งมอบหรือยกเลิกแล้ว</strong> และปิดงานก่อน ' + App.thaiDate(p.cutoff) +
          ' จำนวน <strong>' + p.count + ' งาน</strong> ไปเก็บในสเปรดชีตแยก คงเหลือในคิวงาน ' + p.remaining + ' งาน<br>' +
          'งานที่ย้ายแล้วยังเปิดดูได้ ผู้ขอยังใช้ลิงก์ติดตามเดิมได้ และแดชบอร์ดยังนับรวม ไฟล์บน Drive ไม่ถูกย้าย</div>' +
          '<div class="detail-label">ตัวอย่างงานที่จะย้าย</div><ul style="font-size:.83rem">' +
          p.sample.map(function (x) {
            return '<li>' + App.esc(x.jobId) + ' ' + App.esc(x.projectName) + ' <span class="row-sub d-inline">(ปิด ' +
              App.shortDate(x.closedAt) + ')</span></li>';
          }).join('') + (p.count > p.sample.length ? '<li>และอีก ' + (p.count - p.sample.length) + ' งาน</li>' : '') + '</ul>',
        field: { label: 'พิมพ์คำว่า "ย้ายข้อมูล" เพื่อยืนยัน', required: true, placeholder: 'ย้ายข้อมูล' },
        okLabel: 'ย้ายข้อมูล'
      }).then(function (text) {
        if (!text) return;
        App.loading(true, 'กำลังย้ายข้อมูล อาจใช้เวลาสักครู่...');
        return App.api('apiAdminArchiveRun', [token, cutoff, text]).then(function (res) {
          App.loading(false);
          queueCache = [];
          queueLoadedAt = 0;
          App.toast('ย้ายข้อมูล ' + res.moved + ' งานไปเก็บถาวรเรียบร้อย', 'ok');
          loadSettings();
        });
      });
    }).catch(handleAuthError);
  }

  /* ------------------------------------------------------ การกระทำกับงาน */

  function changeStatus(toStatus) {
    var config = {
      REVIEW: {
        title: 'ส่งร่างให้ตรวจ',
        html: '<div class="rules-box mb-3" style="font-size:.83rem">' +
          'ตรวจสอบให้แน่ใจว่าลิงก์ด้านล่างชี้ไปยังร่างเวอร์ชันล่าสุด ' +
          'ผู้ขอรับบริการจะได้รับลิงก์นี้ทางอีเมลเพื่อตรวจและแจ้งจุดแก้ไข</div>',
        field: {
          label: 'ลิงก์ร่างชิ้นงาน', required: true, type: 'url',
          value: currentJob.request.draftUrl, placeholder: 'https://...',
          hint: 'ใช้ลิงก์ Canva, Google Drive หรือ Adobe ที่เปิดให้แสดงความเห็นได้'
        }
      },
      INFO_NEEDED: {
        title: 'ขอข้อมูลเพิ่มเติม',
        field: {
          label: 'ระบุข้อมูลที่ต้องการเพิ่มเติม', required: true, type: 'textarea', rows: 5,
          placeholder: 'พิมพ์บรรทัดละ 1 รายการ เพื่อส่งถามผู้ขอรับบริการในคราวเดียว'
        }
      },
      CANCELLED: {
        title: 'ยกเลิกคำขอ',
        field: { label: 'เหตุผลในการยกเลิก', required: true, type: 'textarea', rows: 3 }
      },
      DELIVERED: {
        title: 'ส่งมอบงาน',
        html: '<div class="rules-box mb-3" style="font-size:.83rem">' +
          'กรุณาอัปโหลดไฟล์ฉบับสมบูรณ์ให้ครบก่อนส่งมอบ ระบบจะส่งลิงก์ไฟล์ทั้งหมดไปยังอีเมลของผู้ขอรับบริการ</div>',
        field: { label: 'ข้อความถึงผู้ขอรับบริการ (ถ้ามี)', type: 'textarea', rows: 3 }
      }
    };
    var r = currentJob.request;
    var target = (r.statusOptions || []).filter(function (s) { return s.key === toStatus; })[0] ||
      { key: toStatus, label: toStatus, kind: 'next' };
    var c = config[toStatus] || {
      title: 'เปลี่ยนสถานะเป็น "' + target.label + '"',
      field: { label: 'หมายเหตุถึงผู้ขอรับบริการ (ถ้ามี)', type: 'textarea', rows: 3 }
    };

    var notices = '';
    if (target.kind === 'skip') {
      notices += '<div class="notice-warn mb-3"><i class="bi bi-skip-forward-fill me-1"></i>' +
        '<strong>ข้ามขั้นตอนปกติ</strong> จาก "' + App.esc(r.statusLabel) + '" ไปเป็น "' +
        App.esc(target.label) + '" ใช้ในกรณีที่ตกลงกับผู้ขอรับบริการโดยตรงแล้ว ' +
        'ระบบจะบันทึกการเปลี่ยนนี้ไว้ในประวัติการดำเนินงาน</div>';
    }
    if ((r.status === 'DELIVERED' || r.status === 'CANCELLED') && toStatus !== r.status) {
      notices += '<div class="notice-warn mb-3"><i class="bi bi-arrow-counterclockwise me-1"></i>' +
        '<strong>เปิดงานที่ปิดแล้วอีกครั้ง</strong> ' +
        (r.status === 'DELIVERED'
          ? 'วันที่ส่งมอบและระยะเวลาดำเนินการเดิมจะถูกล้าง แล้วคำนวณใหม่เมื่อส่งมอบอีกครั้ง'
          : 'เหตุผลการยกเลิกเดิมจะถูกล้าง') + '</div>';
    }
    if (toStatus === 'DELIVERED') {
      var finals = (currentJob.attachments || []).filter(function (f) { return f.kind === 'final'; });
      if (finals.length === 0) {
        notices += '<div class="notice-warn mb-3"><i class="bi bi-exclamation-triangle-fill me-1"></i>' +
          'ยังไม่มีไฟล์ส่งมอบในระบบ อีเมลแจ้งส่งมอบจะไม่มีลิงก์ไฟล์ ' +
          'ถ้าส่งไฟล์ให้ผู้ขอทางอื่นไปแล้วก็ยืนยันได้เลย</div>';
      }
    }

    App.prompt({
      title: c.title, html: notices + (c.html || ''), field: c.field, okLabel: 'ยืนยัน',
      checkbox: {
        label: 'ส่งอีเมลแจ้งผู้ขอรับบริการ (' + r.requesterEmail + ')', checked: true,
        hint: 'ถ้าแจ้งผู้ขอโดยตรงไปแล้ว เอาเครื่องหมายออกได้ ระบบจะเปลี่ยนสถานะโดยไม่ส่งอีเมล'
      }
    }).then(function (result) {
      if (result === null) return;
      var value = typeof result.value === 'string' ? result.value : '';
      var notify = result.checked;
      var options = { detail: value, notify: notify };
      if (toStatus === 'REVIEW') { options.draftUrl = value; options.detail = ''; }
      if (toStatus === 'CANCELLED') { options.cancelReason = value; }
      App.loading(true, 'กำลังบันทึก...');
      return App.api('apiAdminChangeStatus', [token, r.jobId, toStatus, options])
        .then(function (res) {
          App.loading(false);
          App.toast(notify
            ? 'เปลี่ยนสถานะเรียบร้อย และส่งอีเมลแจ้งผู้ขอรับบริการแล้ว'
            : 'เปลี่ยนสถานะเรียบร้อย (ไม่ได้ส่งอีเมลแจ้งผู้ขอ)', 'ok');
          applyJob(res.job);
        });
    }).catch(handleAuthError);
  }

  function setDraftUrl() {
    App.prompt({
      title: 'ลิงก์ร่างชิ้นงาน',
      field: {
        label: 'ลิงก์ร่างชิ้นงาน', required: true, type: 'url',
        value: currentJob.request.draftUrl, placeholder: 'https://...'
      }
    }).then(function (url) {
      if (!url) return;
      App.loading(true, 'กำลังบันทึกลิงก์...');
      return App.api('apiAdminSetDraftUrl', [token, currentJob.request.jobId, url]).then(function (res) {
        App.loading(false);
        App.toast('บันทึกลิงก์ร่างเรียบร้อย ' +
          'เมื่อพร้อมให้ตรวจ กดปุ่ม "รอตรวจร่าง" เพื่อแจ้งผู้ขอรับบริการ', 'ok');
        applyJob(res.job);
      });

  /* ------------------------------------------------------- ผู้ออกแบบ */

  /** คีย์เทียบชื่อ ตรงกับ designerKey_ ฝั่งเซิร์ฟเวอร์ */
  function dKey(name) {
    return String(name || '').replace(/\s+/g, ' ').trim().toLowerCase();
  }

  /** ผู้ออกแบบจากชื่อในช่องผู้รับผิดชอบ (ใช้รายชื่อเต็มถ้าโหลดแล้ว ซึ่งรวมคนที่ซ่อนไว้) */
  function designerOf(name) {
    var k = dKey(name);
    if (!k) return null;
    var lists = [(designerData && designerData.designers) || [], App.getCfg().designers || []];
    for (var l = 0; l < lists.length; l++) {
      for (var i = 0; i < lists[l].length; i++) if (dKey(lists[l][i].name) === k) return lists[l][i];
    }
    return null;
  }

  function designerColor(name) {
    var d = designerOf(name);
    return d ? d.color : '#94a3b8';
  }

  function assigneeHtml(name) {
    return '<i class="cdot" style="--c:' + designerColor(name) + ';width:9px;height:9px;flex-basis:9px"></i>' + App.esc(name);
  }

  function designerLegendHtml() {
    return (App.getCfg().designers || []).map(function (d) {
      return '<span class="d-inline-flex align-items-center gap-1"><i class="cdot" style="--c:' + d.color + '"></i>' +
        App.esc(d.shortName || d.name) + '</span>';
    }).join(' ') + ' <span class="d-inline-flex align-items-center gap-1"><i class="cdot" style="--c:#94a3b8"></i>ยังไม่มอบหมาย</span>';
  }

  function loadDesigners(force) {
    if (designerData && !force && Date.now() - designerLoadedAt < 60000) return Promise.resolve(designerData);
    return App.api('apiAdminDesigners', [token]).then(function (d) {
      designerData = d;
      designerLoadedAt = Date.now();
      return d;
    });
  }

  /** ใช้รายชื่อใหม่ทั่วทั้งหน้า (หน้าตั้งค่า แบบฟอร์ม คิวงานสาธารณะ ปฏิทิน) */
  function applyDesigners(res) {
    designerData = res.list;
    designerLoadedAt = Date.now();
    App.setDesigners(res.designers);
    var box = document.getElementById('designers-card');
    if (box) box.innerHTML = designersCardHtml();
    if (res.renamedJobs) queueLoadedAt = 0; // ชื่อในงานเปลี่ยน โหลดคิวงานใหม่ครั้งหน้า
    if (activeTab === 'calendar') renderCalendar();
  }

  function assign() {
    if (!currentJob) return;
    var current = currentJob.request.assignedTo || '';
    App.loading(true, 'กำลังโหลดรายชื่อผู้ออกแบบ...');
    loadDesigners(false).then(function (data) {
      App.loading(false);
      var match = designerOf(current);
      // คนที่ซ่อนไว้ไม่แสดงให้เลือก ยกเว้นคนที่รับงานนี้อยู่แล้ว
      var list = data.designers.filter(function (d) { return d.active || (match && match.id === d.id); });
      var picked = !current ? '' : (match ? match.id : '__other');
      function opt(value, color, title, sub, extra) {
        return '<label class="as-opt" style="--c:' + color + '">' +
          '<input class="form-check-input mt-0" type="radio" name="as-pick" value="' + App.esc(value) + '"' +
            (picked === value ? ' checked' : '') + ' onchange="Admin.assignPickChange()">' +
          '<i class="cdot"></i><span class="as-main"><span class="as-title">' + App.esc(title) + '</span>' +
            (sub ? '<span class="dp-sub">' + sub + '</span>' : '') + '</span>' + (extra || '') + '</label>';
      }
      var html = '<div class="as-list">' +
        opt('', '#94a3b8', 'ยังไม่มอบหมาย', 'แสดงเป็น "รอจัดสรร" บนคิวงานของผู้ขอ') +
        list.map(function (d) {
          var notes = [];
          if (d.specialty) notes.push(App.esc(d.specialty));
          if (!d.accepting) notes.push('<span style="color:#b45309">งดรับงานใหม่</span>');
          if (!d.active) notes.push('ซ่อนจากผู้ขอ');
          return opt(d.id, d.color, d.name, notes.join(' &middot; '),
            '<span class="as-load"><span class="mini-bar" style="--c:' + d.color + '"><i style="width:' +
              Math.min(100, d.loadPct) + '%"></i></span>' + d.activeJobs + '/' + d.capacity + ' งาน</span>');
        }).join('') +
        opt('__other', '#cbd5e1', 'ชื่ออื่นที่ไม่อยู่ในรายชื่อ', '') +
        '</div>' +
        '<div id="as-other-wrap" class="mt-2' + (picked === '__other' ? '' : ' d-none') + '">' +
          '<input type="text" class="form-control" id="as-other" maxlength="80" placeholder="พิมพ์ชื่อผู้รับผิดชอบ" value="' +
            App.esc(picked === '__other' ? current : '') + '"></div>' +
        (list.length === 0 ? '<div class="form-text mt-2">ยังไม่มีรายชื่อผู้ออกแบบ ผู้ดูแลระบบเพิ่มได้ที่ ตั้งค่า &gt; ผู้ออกแบบ ' +
          'แล้วผู้ขอจะเลือกผู้ออกแบบได้เองตอนยื่นคำขอ</div>' : '');
      return App.prompt({ title: 'มอบหมายผู้ออกแบบ', html: html, okLabel: 'บันทึก' }).then(function (ok) {
        if (!ok) return;
        var sel = document.querySelector('#genericModal input[name="as-pick"]:checked');
        var v = sel ? sel.value : '';
        var name = '';
        var chosen = null;
        if (v === '__other') {
          name = document.getElementById('as-other').value.trim();
          if (!name) {
            App.toast('กรุณาพิมพ์ชื่อผู้รับผิดชอบ หรือเลือกจากรายชื่อ', 'err');
            setTimeout(assign, 400);
            return;
          }
        } else if (v) {
          chosen = list.filter(function (d) { return d.id === v; })[0];
          name = chosen ? chosen.name : '';
        }
        if (name === current) return;
        App.loading(true, 'กำลังบันทึก...');
        return App.api('apiAdminAssign', [token, currentJob.request.jobId, name]).then(function (res) {
          App.loading(false);
          designerLoadedAt = 0; // จำนวนงานในมือเปลี่ยน
          Workload.invalidate();
          App.toast(name ? 'มอบหมายให้ ' + name + ' เรียบร้อย' +
            (chosen && chosen.email ? ' ระบบส่งอีเมลแจ้งให้แล้ว' : '') : 'ยกเลิกการมอบหมายเรียบร้อย', 'ok');
          applyJob(res.job);
        });
      });
    }).catch(handleAuthError);
  }

  function assignPickChange() {
    var sel = document.querySelector('#genericModal input[name="as-pick"]:checked');
    var other = !!(sel && sel.value === '__other');
    document.getElementById('as-other-wrap').classList.toggle('d-none', !other);
    if (other) document.getElementById('as-other').focus();
  }

        '<td><div class="d-flex align-items-center gap-2"><i class="cdot" style="--c:' + d.color + '"></i><div style="min-width:0">' +
          '<div class="fw-semibold">' + App.esc(d.name) + '</div>' +
          '<div class="row-sub mt-0">บนปฏิทิน: ' + App.esc(d.shortName) + (d.email ? ' &middot; ' + App.esc(d.email) : '') + '</div></div></div></td>' +

          '<button class="btn btn-sm btn-link p-0 text-danger" onclick="Admin.deleteDesigner(\'' + App.esc(d.id) + '\')">ลบ</button></td></tr>';
    }).join('');
    var sugg = data.suggestions || [];
    return '<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">' +
        '<div class="fw-semibold"><i class="bi bi-palette me-2" style="color:var(--primary)"></i>ผู้ออกแบบ</div>' +
        '<button class="btn btn-sm btn-ghost" onclick="Admin.editDesigner(\'\')">' +
          '<i class="bi bi-person-plus me-1"></i>เพิ่มผู้ออกแบบ</button></div>' +
      '<div style="font-size:.85rem;color:var(--text-light)" class="mb-3">' +
        'ผู้ขอเลือกผู้ออกแบบได้เองตอนยื่นคำขอ และเห็นงานในมือของแต่ละคนในคิวงานใต้แบบฟอร์ม ' +
        '(เห็นชื่อ ความถนัด และสีประจำตัว ไม่เห็นอีเมล) ผู้ออกแบบที่ใส่อีเมลไว้จะได้รับแจ้งเมื่อมีงานใหม่ของตัวเอง' +
        (data.unassigned ? '<br>งานที่ยังไม่มอบหมาย <strong>' + data.unassigned + ' งาน</strong>' : '') + '</div>' +
      (rows
        ? '<div class="table-responsive"><table class="table table-clean mb-0"><thead><tr><th>ชื่อ</th><th>ความถนัด</th>' +

          'ยังไม่มีรายชื่อผู้ออกแบบ กด "เพิ่มผู้ออกแบบ" เพื่อให้ผู้ขอเลือกได้</p></div>') +
      (sugg.length ? '<div class="mt-3" style="font-size:.84rem"><div class="mb-1">ชื่อที่เคยมอบหมายงานแต่ยังไม่อยู่ในรายชื่อ ' +

          return '<button class="btn btn-sm btn-ghost me-1 mb-1" onclick="Admin.addSuggestedDesigner(' + i + ')">' +

  function addSuggestedDesigner(i) {
    var s = designerData && designerData.suggestions[i];
    if (s) editDesigner('', { name: s.name });
  }

  function editDesigner(id, draft) {
    var list = (designerData && designerData.designers) || [];
    var palette = ((designerData && designerData.palette) || App.getCfg().designerPalette || []).slice();
    var found = list.filter(function (x) { return x.id === id; })[0];
    var d = {};
    var base = found || {
      id: '', name: '', shortName: '', shortNameAuto: true, specialty: '', email: '', color: '',
      capacity: 6, accepting: true, active: true, sortOrder: list.length
    };
    for (var k in base) d[k] = base[k];
    if (draft) for (var k2 in draft) d[k2] = draft[k2];
    var usedBy = {};
    list.forEach(function (x) { if (x.id !== d.id) usedBy[x.color] = x.shortName || x.name; });
    if (!d.color) d.color = palette.filter(function (c) { return !usedBy[c]; })[0] || palette[list.length % palette.length];
    if (palette.indexOf(d.color) < 0) palette.push(d.color);
    var isNew = !d.id;
    var shortValue = found && found.shortNameAuto && !(draft && 'shortName' in draft) ? '' : d.shortName;

    App.prompt({
      title: isNew ? 'เพิ่มผู้ออกแบบ' : 'แก้ไข ' + d.name,

  function uploadFinal(fileList) {
    if (!fileList || fileList.length === 0) return;
    var cfg = App.getCfg();
    var maxBytes = cfg.settings.maxFileMB * 1024 * 1024;
    var allowed = cfg.settings.allowedFileTypes.toLowerCase().split(',').map(function (x) { return x.trim(); });
    var queue = [];
    for (var i = 0; i < fileList.length; i++) {
      var name = fileList[i].name;
      var ext = name.lastIndexOf('.') >= 0 ? name.substring(name.lastIndexOf('.') + 1).toLowerCase() : '';
      if (allowed.indexOf(ext) < 0) {
        App.toast('ไฟล์ "' + name + '" เป็นชนิดที่ระบบไม่รองรับ (แก้ได้ที่ ตั้งค่า > นามสกุลไฟล์ที่อนุญาต)', 'err');
        continue;
      }
      if (fileList[i].size > maxBytes) {
        App.toast('ไฟล์ "' + name + '" เกิน ' + cfg.settings.maxFileMB + ' MB', 'err');
        continue;
      }
      queue.push(fileList[i]);
    }
    var input = document.getElementById('jm-final-file');
    if (input) input.value = '';
    if (queue.length === 0) return;

    var jobId = currentJob.request.jobId;
    var next = 0;
    var done = 0;
    var failed = 0;
    App.loading(true, 'กำลังอัปโหลด 0/' + queue.length + ' ...');

    function readAsBase64(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function (e) {
          var result = String(e.target.result);
          var comma = result.indexOf(',');
          resolve(comma >= 0 ? result.substring(comma + 1) : result);
        };
        reader.onerror = function () { reject(new Error('อ่านไฟล์ไม่สำเร็จ')); };
        reader.readAsDataURL(file);
      });
    }

    function worker() {
      if (next >= queue.length) return Promise.resolve();
      var file = queue[next++];
      return readAsBase64(file).then(function (data) {
        return App.api('apiAdminUploadFile', [token, jobId, {
          fileName: file.name, mimeType: file.type || 'application/octet-stream', dataB64: data
        }, 'final']);
      }).catch(function (err) {
        failed++;
        App.toast('อัปโหลด "' + file.name + '" ไม่สำเร็จ: ' + err.message, 'err');
      }).then(function () {
        done++;
        App.loading(true, 'กำลังอัปโหลด ' + done + '/' + queue.length + ' ...');
        return worker();
      });
    }

    Promise.all([worker(), worker()]).then(function () {
      App.loading(false);
      if (failed < queue.length) {
        App.toast('อัปโหลดไฟล์ส่งมอบเรียบร้อย ' + (queue.length - failed) + ' ไฟล์', 'ok');
      }
      reloadJob();
    });
  }

  var dashPeriod = 'fy';

  /** ช่วงเวลาสำหรับแดชบอร์ด ปีงบประมาณของไทยเริ่ม 1 ตุลาคม */
  function dashboardPeriods() {
    var now = new Date();
    var fyStart = now.getMonth() >= 9 ? now.getFullYear() : now.getFullYear() - 1; // ค.ศ. ของ 1 ต.ค.
    function ymd(d) {
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }
    function fy(startYear) {
      return { from: startYear + '-10-01', to: (startYear + 1) + '-09-30' };
    }
    var d30 = new Date(now.getTime() - 29 * 86400000);
    return [
      { key: 'fy', label: 'ปีงบประมาณ ' + (fyStart + 544), range: fy(fyStart) },
      { key: 'fy-1', label: 'ปีงบประมาณ ' + (fyStart + 543), range: fy(fyStart - 1) },
      { key: 'year', label: 'ปี พ.ศ. ' + (now.getFullYear() + 543),
        range: { from: now.getFullYear() + '-01-01', to: now.getFullYear() + '-12-31' } },
      { key: '30d', label: '30 วันล่าสุด', range: { from: ymd(d30), to: ymd(now) } },
      { key: 'all', label: 'ทั้งหมด', range: {} }
    ];
  }

  function settingInput(key, value) {
    var m = SETTING_META[key] || { label: key, type: 'text' };
    var id = 'set-' + key;
    var input;
    if (m.type === 'bool') {
      return '<div class="col-md-6"><div class="form-check form-switch mt-md-4">' +
        '<input class="form-check-input" type="checkbox" role="switch" id="' + id + '" data-key="' + key + '"' +
        (value === 'true' ? ' checked' : '') + '>' +
        '<label class="form-check-label" for="' + id + '">' + App.esc(m.label) + '</label>' +
        (m.hint ? '<div class="form-text">' + App.esc(m.hint) + '</div>' : '') + '</div></div>';
    }
    if (m.type === 'textarea') {
      input = '<textarea class="form-control form-control-sm" rows="2" id="' + id + '" data-key="' + key + '">' +
        App.esc(value) + '</textarea>';
    } else if (m.type === 'number') {
      input = '<input type="number" inputmode="numeric" class="form-control form-control-sm" id="' + id +
        '" data-key="' + key + '" min="' + m.min + '" max="' + m.max + '" step="1" value="' + App.esc(value) + '">';
    } else {
      input = '<input type="text" class="form-control form-control-sm" id="' + id + '" data-key="' + key +
        '" value="' + App.esc(value) + '">';
    }
    return '<div class="' + (m.wide || m.type === 'textarea' ? 'col-12' : 'col-md-6') + '">' +
      '<label class="form-label" for="' + id + '">' + App.esc(m.label) + '</label>' + input +
      (m.hint ? '<div class="form-text">' + App.esc(m.hint) + '</div>' : '') +
      (m.type === 'number' ? '<div class="form-text">ใส่ได้ ' + m.min + ' ถึง ' + m.max + '</div>' : '') +
      '</div>';
  }

  function copyText(btn, text) {
    function fallback() {
      var box = document.createElement('textarea');
      box.value = text;
      box.style.position = 'fixed';
      box.style.opacity = '0';
      document.body.appendChild(box);
      box.select();
      try { document.execCommand('copy'); } catch (e) { /* เบราว์เซอร์ไม่รองรับ */ }
      document.body.removeChild(box);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(fallback);
      } else {
        fallback();
      }
    } catch (e) {
      fallback();
    }
    if (!btn) return;
    var original = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-check-lg"></i> คัดลอกแล้ว';
    setTimeout(function () { btn.innerHTML = original; }, 1500);
  }

  /**

   */
  function exportCsv() {
    var visible = {};
    var ids = Array.prototype.map.call(document.querySelectorAll('#queue-body tr'), function (tr) {
      var m = (tr.getAttribute('onclick') || '').match(/openJob\('([^']+)'\)/);
      return m ? m[1] : '';
    }).filter(function (x) { return !!x; });
    ids.forEach(function (id) { visible[id] = true; });
    if (ids.length === 0) { App.toast('ไม่มีรายการให้ส่งออก', 'err'); return; }

    App.loading(true, 'กำลังเตรียมข้อมูล...');
    App.api('apiAdminExport', [token, {}]).then(function (data) {
      App.loading(false);
      var rows = data.rows.filter(function (r) { return visible[r[0]]; });
      lastCsv = [data.header].concat(rows).map(function (row) {
        return row.map(function (cell) {
          var v = String(cell === null || cell === undefined ? '' : cell);
          if (/^[=+\-@]/.test(v)) v = "'" + v;
          return '"' + v.replace(/"/g, '""') + '"';
        }).join(',');
      }).join('\r\n');
      App.prompt({
        title: 'ส่งออกข้อมูล (' + rows.length + ' รายการ)',
        html: '<p style="font-size:.88rem">ส่งออกรายการที่แสดงอยู่ในคิวงานตอนนี้ ' +
          'เปิดด้วย Excel หรือ Google Sheets ได้ทันที</p>' +
          '<button type="button" class="btn btn-brand w-100 justify-content-center mb-2" ' +
          'onclick="Admin.downloadCsv()"><i class="bi bi-file-earmark-spreadsheet"></i>ดาวน์โหลดไฟล์ CSV</button>' +
          '<div class="form-text">ถ้าเบราว์เซอร์ไม่ดาวน์โหลด ให้กด "คัดลอกข้อมูล" แล้ววางใน Google Sheets</div>',
        okLabel: 'คัดลอกข้อมูล'
      }).then(function (ok) {
        if (!ok) return;
        copyText(null, lastCsv);
        App.toast('คัดลอกข้อมูลแล้ว', 'ok');
      });
    }).catch(handleAuthError);
  }

  function downloadCsv() {
    if (!lastCsv) return;
    try {
      var blob = new Blob(['\ufeff' + lastCsv], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'design-requests-' + App.todayStr(0) + '.csv';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      App.toast('ดาวน์โหลดไฟล์แล้ว', 'ok');
    } catch (e) {
      App.toast('เบราว์เซอร์ไม่อนุญาตให้ดาวน์โหลด กรุณาใช้ปุ่มคัดลอกข้อมูลแทน', 'err');
    }
  }
