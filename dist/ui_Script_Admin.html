<script>
/* =========================================================================
   ui_Script_Admin — หน้าเจ้าหน้าที่: คิวงาน แดชบอร์ด คลังผลงาน และตั้งค่า
   ========================================================================= */
var Admin = (function () {
  var TOKEN_KEY = 'lartsDesignToken';
  var token = '';
  var user = null;
  var activeTab = 'queue';
  var queueCache = [];
  var currentJob = null;
  var debounceTimer = null;

  /* ------------------------------------------------------------- Session */

  function init() {
    try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { token = ''; }

    var statusSelect = document.getElementById('q-status');
    statusSelect.innerHTML = '<option value="">ทุกสถานะ</option>' +
      App.getCfg().statusFlow.map(function (s) {
        return '<option value="' + s.key + '">' + App.esc(s.label) + '</option>';
      }).join('') +
      '<option value="INFO_NEEDED">รอข้อมูลเพิ่มเติม</option>' +
      '<option value="CANCELLED">ยกเลิกคำขอ</option>';

    var tabs = document.querySelectorAll('#admin-tabs .tab-pill');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener('click', function () { switchTab(this.getAttribute('data-tab')); });
    }

    if (token) {
      App.api('apiVerifySession', [token]).then(function (u) {
        user = u;
        showUserMenu();
      }).catch(function () {
        token = '';
        try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      });
    }
  }

  function isLoggedIn() { return !!token && !!user; }

  function showUserMenu() {
    document.getElementById('user-menu').style.display = user ? '' : 'none';
    if (user) document.getElementById('user-name').textContent = user.name || user.email;
  }

  function login() {
    var email = document.getElementById('l-email').value.trim();
    var password = document.getElementById('l-password').value;
    if (!email || !password) { App.toast('กรุณากรอกอีเมลและรหัสผ่าน', 'err'); return; }
    var btn = document.getElementById('l-btn');
    btn.disabled = true;
    App.loading(true, 'กำลังตรวจสอบสิทธิ์...');
    App.api('apiLogin', [email, password]).then(function (res) {
      token = res.token;
      user = res.user;
      try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
      App.loading(false);
      btn.disabled = false;
      document.getElementById('l-password').value = '';
      showUserMenu();
      App.toast('ยินดีต้อนรับ ' + (user.name || user.email), 'ok');
      App.go('admin');
    }).catch(function (err) {
      App.loading(false);
      btn.disabled = false;
      App.toast(err.message, 'err');
    });
  }

  function logout() {
    token = '';
    user = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    showUserMenu();
    App.toast('ออกจากระบบเรียบร้อย', 'ok');
    App.go('home');
  }

  function handleAuthError(err) {
    App.loading(false);
    if (err && /เซสชัน|สิทธิ์|เข้าสู่ระบบ/.test(err.message)) {
      token = '';
      user = null;
      try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
      showUserMenu();
      App.go('login');
    }
    App.toast(err.message, 'err');
  }

  function onEnter() {
    if (!isLoggedIn()) { App.go('login'); return; }
    switchTab(activeTab);
  }

  function switchTab(tab) {
    activeTab = tab;
    var pills = document.querySelectorAll('#admin-tabs .tab-pill');
    for (var i = 0; i < pills.length; i++) {
      pills[i].classList.toggle('on', pills[i].getAttribute('data-tab') === tab);
    }
    ['queue', 'dashboard', 'assets', 'settings'].forEach(function (name) {
      document.getElementById('admin-' + name).classList.toggle('d-none', name !== tab);
    });
    var titles = {
      queue: 'คิวงานออกแบบ', dashboard: 'แดชบอร์ดสรุปผลการให้บริการ',
      assets: 'คลังผลงาน', settings: 'ตั้งค่าระบบ'
    };
    document.getElementById('admin-title').textContent = titles[tab] || '';
    if (tab === 'queue') loadQueue();
    if (tab === 'dashboard') loadDashboard();
    if (tab === 'assets') loadAssets();
    if (tab === 'settings') loadSettings();
  }

  /* --------------------------------------------------------------- คิวงาน */

  function debouncedLoadQueue() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadQueue, 400);
  }

  function loadQueue() {
    if (!isLoggedIn()) return;
    var filter = {
      q: document.getElementById('q-search').value.trim(),
      status: document.getElementById('q-status').value,
      priority: document.getElementById('q-priority').value
    };
    App.loading(true, 'กำลังโหลดคิวงาน...');
    App.api('apiAdminList', [token, filter]).then(function (rows) {
      App.loading(false);
      queueCache = rows;
      renderQueue(rows);
    }).catch(handleAuthError);
  }

  function renderQueue(rows) {
    var body = document.getElementById('queue-body');
    document.getElementById('queue-empty').classList.toggle('d-none', rows.length > 0);
    body.innerHTML = rows.map(function (r) {
      var dueHtml = App.shortDate(r.dueDate);
      if (r.daysLeft !== null && r.status !== 'DELIVERED' && r.status !== 'CANCELLED') {
        var color = r.daysLeft < 0 ? 'var(--danger)' : (r.daysLeft <= 3 ? 'var(--warning)' : 'var(--text-light)');
        var text = r.daysLeft < 0 ? 'เกิน ' + Math.abs(r.daysLeft) + ' วัน' : 'อีก ' + r.daysLeft + ' วัน';
        dueHtml += '<div style="font-size:.72rem;color:' + color + '">' + text + '</div>';
      }
      return '<tr class="row-click" onclick="Admin.openJob(\'' + r.jobId + '\')">' +
        '<td><strong style="color:var(--primary)">' + App.esc(r.jobId) + '</strong>' +
          '<div style="font-size:.72rem;color:var(--text-light)">' + App.shortDate(r.createdAt) + '</div></td>' +
        '<td><div style="font-weight:500">' + App.esc(r.projectName) + '</div>' +
          '<div style="font-size:.76rem;color:var(--text-light)">' + App.esc(r.requesterName) +
          ' &middot; ' + App.esc(r.department) + '</div></td>' +
        '<td style="white-space:nowrap">' + dueHtml + '</td>' +
        '<td><span class="badge-status" style="background:' + r.statusColor + '">' +
          App.esc(r.statusLabel) + '</span></td>' +
        '<td><span style="color:' + r.priorityColor + ';font-size:.82rem">' +
          (r.overdue ? '<i class="bi bi-exclamation-triangle-fill me-1"></i>' : '') +
          App.esc(r.priorityLabel) + '</span></td>' +
        '<td style="font-size:.82rem">' + r.revisionCount + '/' + r.revisionLimit + '</td>' +
        '<td class="text-end"><i class="bi bi-chevron-right text-secondary"></i></td>' +
        '</tr>';
    }).join('');
  }

  /* ------------------------------------------------------- รายละเอียดงาน */

  function openJob(jobId) {
    App.loading(true, 'กำลังโหลดรายละเอียด...');
    App.api('apiAdminGet', [token, jobId]).then(function (data) {
      App.loading(false);
      currentJob = data;
      renderJobModal(data);
      bootstrap.Modal.getOrCreateInstance(document.getElementById('jobModal')).show();
    }).catch(handleAuthError);
  }

  function reloadJob() {
    if (!currentJob) return;
    App.api('apiAdminGet', [token, currentJob.request.jobId]).then(function (data) {
      currentJob = data;
      renderJobModal(data);
      loadQueue();
    }).catch(handleAuthError);
  }

  function detail(label, value, isHtml) {
    if (!value) return '';
    return '<div class="detail-label">' + App.esc(label) + '</div>' +
      '<div class="detail-value">' + (isHtml ? value : App.nl2br(value)) + '</div>';
  }

  function renderJobModal(data) {
    var r = data.request;
    document.getElementById('jm-title').innerHTML =
      '<span style="color:var(--primary)">' + App.esc(r.jobId) + '</span> ' +
      '<span style="font-weight:400;font-size:.95rem">' + App.esc(r.projectName) + '</span>';

    var statusButtons = r.nextStatuses.map(function (s) {
      return '<button class="btn btn-sm btn-ghost" onclick="Admin.changeStatus(\'' + s.key + '\')">' +
        '<i class="bi bi-arrow-right-circle me-1"></i>' + App.esc(s.label) + '</button>';
    }).join('');

    var missing = r.briefMissing ? r.briefMissing.split(' | ').filter(function (x) { return !!x; }) : [];
    var briefBox = r.briefStatus === 'DONE'
      ? '<div class="brief-box">' + App.esc(r.briefText) + '</div>' +
        (missing.length > 0 ?
          '<div class="missing-box mt-2"><div class="fw-semibold mb-1" style="color:var(--danger)">' +
          '<i class="bi bi-question-circle me-1"></i>ข้อมูลที่ยังขาด (สอบถามผู้ขอในคราวเดียว)</div>' +
          '<ul class="mb-0" style="padding-left:1.1rem">' +
          missing.map(function (m) { return '<li>' + App.esc(m) + '</li>'; }).join('') + '</ul></div>' : '') +
        '<div class="mt-2" style="font-size:.75rem;color:var(--text-light)">สรุปโดย ' +
        (r.briefSource === 'AI' ? 'AI (Claude)' : 'ระบบอัตโนมัติ') + ' เมื่อ ' +
        App.thaiDate(r.briefGeneratedAt, true) + '</div>'
      : '<div class="text-center py-4" style="background:#fff;border:1px dashed var(--border);border-radius:14px">' +
        '<i class="bi bi-hourglass-split" style="font-size:1.6rem;color:var(--text-light)"></i>' +
        '<div style="font-size:.87rem;color:var(--text-light);margin-top:.5rem">' +
        (r.briefStatus === 'ERROR' ? 'สรุป Design Brief ไม่สำเร็จ' : 'ระบบกำลังสรุป Design Brief') +
        '</div></div>';

    var attachments = data.attachments;
    var sourceFiles = attachments.filter(function (f) { return f.kind === 'source'; });
    var finalFiles = attachments.filter(function (f) { return f.kind !== 'source'; });

    function fileRows(list, canDelete) {
      if (list.length === 0) return '<div style="font-size:.83rem;color:var(--text-light)">ไม่มีไฟล์</div>';
      return list.map(function (f) {
        return '<div class="file-row">' +
          '<i class="bi bi-file-earmark" style="color:var(--primary)"></i>' +
          '<a href="' + App.esc(f.fileUrl) + '" target="_blank" class="flex-grow-1 text-truncate">' +
            App.esc(f.fileName) + '</a>' +
          '<span style="font-size:.75rem;color:var(--text-light)">' + App.esc(f.sizeLabel) + '</span>' +
          (canDelete ? '<button class="btn btn-sm btn-link text-danger p-0 ms-1" ' +
            'onclick="Admin.deleteFile(\'' + f.id + '\')"><i class="bi bi-trash"></i></button>' : '') +
          '</div>';
      }).join('');
    }

    var revisionsHtml = data.revisions.length === 0
      ? '<div style="font-size:.83rem;color:var(--text-light)">ยังไม่มีการขอแก้ไข</div>'
      : data.revisions.map(function (v) {
          return '<div class="mb-2 pb-2" style="border-bottom:1px dashed var(--border)">' +
            '<div class="d-flex justify-content-between"><span class="badge-soft">รอบที่ ' + v.round + '</span>' +
            '<span style="font-size:.74rem;color:var(--text-light)">' + App.thaiDate(v.createdAt, true) +
            '</span></div><div style="font-size:.85rem;margin-top:.3rem">' + App.nl2br(v.comment) +
            '</div></div>';
        }).join('');

    var timelineHtml = data.timeline.slice().reverse().map(function (t) {
      return '<div class="timeline-item"><div class="tl-dot"><i class="bi bi-dot"></i></div>' +
        '<div class="tl-body"><div>' + App.esc(t.detail || t.action) + '</div>' +
        '<div class="tl-time">' + App.thaiDate(t.at, true) + ' &middot; ' +
        App.esc(t.actor || 'ระบบ') + '</div></div></div>';
    }).join('');

    document.getElementById('jm-body').innerHTML =
    '<div class="row g-3">' +
      '<div class="col-lg-7">' +
        '<div class="card-soft p-3 p-md-4 mb-3">' +
          '<div class="d-flex flex-wrap gap-2 align-items-center mb-3">' +
            '<span class="badge-status" style="background:' + r.statusColor + '">' +
              App.esc(r.statusLabel) + '</span>' +
            '<span class="badge-soft" style="color:' + r.priorityColor + '">' +
              App.esc(r.priorityLabel) + '</span>' +
            '<span class="badge-soft">แก้ไข ' + r.revisionCount + '/' + r.revisionLimit + ' รอบ</span>' +
            (r.assignedTo ? '<span class="badge-soft"><i class="bi bi-person-check me-1"></i>' +
              App.esc(r.assignedTo) + '</span>' : '') +
          '</div>' +
          '<div class="d-flex flex-wrap gap-2 mb-3">' + statusButtons +
            '<button class="btn btn-sm btn-ghost" onclick="Admin.assign()">' +
              '<i class="bi bi-person-plus me-1"></i>มอบหมาย</button>' +
            '<button class="btn btn-sm btn-ghost" onclick="Admin.addNote()">' +
              '<i class="bi bi-sticky me-1"></i>บันทึกภายใน</button>' +
            '<button class="btn btn-sm btn-ghost" onclick="Admin.setRevisionLimit()">' +
              '<i class="bi bi-sliders me-1"></i>รอบแก้ไข</button>' +
          '</div>' +
          '<div class="row g-2" style="font-size:.85rem">' +
            '<div class="col-6"><div class="detail-label">ผู้ประสานงาน</div>' +
              '<div>' + App.esc(r.requesterName) + '</div></div>' +
            '<div class="col-6"><div class="detail-label">หน่วยงาน</div>' +
              '<div>' + App.esc(r.department) + '</div></div>' +
            '<div class="col-6"><div class="detail-label">อีเมล</div>' +
              '<div><a href="mailto:' + App.esc(r.requesterEmail) + '">' +
              App.esc(r.requesterEmail) + '</a></div></div>' +
            '<div class="col-6"><div class="detail-label">โทรศัพท์</div>' +
              '<div>' + App.esc(r.requesterPhone) +
              (r.lineId ? ' &middot; LINE: ' + App.esc(r.lineId) : '') + '</div></div>' +
            '<div class="col-6"><div class="detail-label">ยื่นคำขอ</div>' +
              '<div>' + App.thaiDate(r.createdAt, true) + '</div></div>' +
            '<div class="col-6"><div class="detail-label">กำหนดใช้งาน</div>' +
              '<div>' + App.thaiDate(r.dueDate) + '</div></div>' +
          '</div>' +
        '</div>' +

        '<div class="card-soft p-3 p-md-4 mb-3">' +
          '<div class="d-flex justify-content-between align-items-center mb-3">' +
            '<div class="fw-semibold"><i class="bi bi-cpu me-2" style="color:var(--primary)"></i>Design Brief</div>' +
            '<button class="btn btn-sm btn-ghost py-1" onclick="Admin.regenerateBrief()">' +
              '<i class="bi bi-arrow-clockwise me-1"></i>สรุปใหม่</button>' +
          '</div>' + briefBox +
        '</div>' +

        '<div class="card-soft p-3 p-md-4 mb-3">' +
          '<div class="fw-semibold mb-3"><i class="bi bi-card-text me-2" style="color:var(--primary)"></i>' +
            'ข้อมูลจากแบบฟอร์ม</div>' +
          detail('วัตถุประสงค์', r.objective) +
          detail('กลุ่มเป้าหมาย', r.targetAudience) +
          detail('ข้อความหลัก', r.keyMessage) +
          detail('ข้อความบังคับบนชิ้นงาน', r.mandatoryText) +
          detail('ช่องทางเผยแพร่', r.channels) +
          detail('วันจัดกิจกรรม', r.eventDate ? App.thaiDate(r.eventDate) : '') +
          (r.referenceUrl ? detail('ตัวอย่างอ้างอิง',
            '<a href="' + App.esc(r.referenceUrl) + '" target="_blank">' +
            App.esc(r.referenceUrl) + '</a>', true) : '') +
          detail('หมายเหตุ', r.notes) +
          (r.rushReason ? '<div class="missing-box">' +
            '<div class="fw-semibold mb-1" style="color:var(--danger)">เหตุผลความเร่งด่วน</div>' +
            App.nl2br(r.rushReason) + '</div>' : '') +
          '<div class="detail-label mt-3">รายการชิ้นงาน</div>' +
          '<ul style="font-size:.87rem;padding-left:1.1rem;line-height:1.9">' +
            data.deliverables.map(function (d) {
              return '<li>' + App.esc(d.mediaLabel) + ' &middot; ' + App.esc(d.size) +
                ' &middot; ' + d.quantity + ' ชิ้น' +
                (d.note ? '<div style="font-size:.78rem;color:var(--text-light)">' +
                  App.esc(d.note) + '</div>' : '') + '</li>';
            }).join('') +
          '</ul>' +
        '</div>' +
      '</div>' +

      '<div class="col-lg-5">' +
        '<div class="card-soft p-3 p-md-4 mb-3">' +
          '<div class="fw-semibold mb-3"><i class="bi bi-link-45deg me-2" style="color:var(--primary)"></i>' +
            'ลิงก์ร่างชิ้นงาน</div>' +
          (r.draftUrl
            ? '<a href="' + App.esc(r.draftUrl) + '" target="_blank" class="d-block text-truncate mb-2">' +
              App.esc(r.draftUrl) + '</a>'
            : '<div style="font-size:.83rem;color:var(--text-light)" class="mb-2">ยังไม่ได้ระบุลิงก์ร่าง</div>') +
          '<button class="btn btn-sm btn-ghost" onclick="Admin.setDraftUrl()">' +
            '<i class="bi bi-pencil me-1"></i>' + (r.draftUrl ? 'แก้ไขลิงก์' : 'เพิ่มลิงก์ร่าง') + '</button>' +
          '<div class="form-text mt-2">ใช้ลิงก์ Canva, Google Drive หรือ Adobe ที่เปิดให้แสดงความเห็นได้</div>' +
        '</div>' +

        '<div class="card-soft p-3 p-md-4 mb-3">' +
          '<div class="fw-semibold mb-3"><i class="bi bi-folder2-open me-2" style="color:var(--primary)"></i>' +
            'ไฟล์จากผู้ขอรับบริการ</div>' +
          fileRows(sourceFiles, false) +
          '<a href="' + App.esc(r.folderUrl) + '" target="_blank" class="btn btn-sm btn-ghost mt-2">' +
            '<i class="bi bi-box-arrow-up-right me-1"></i>เปิดโฟลเดอร์ใน Drive</a>' +
        '</div>' +

        '<div class="card-soft p-3 p-md-4 mb-3">' +
          '<div class="fw-semibold mb-3"><i class="bi bi-file-earmark-check me-2" style="color:var(--success)"></i>' +
            'ไฟล์ส่งมอบ</div>' +
          fileRows(finalFiles, true) +
          '<input type="file" id="jm-final-file" class="d-none" multiple ' +
            'onchange="Admin.uploadFinal(this.files)">' +
          '<button class="btn btn-sm btn-brand mt-2" ' +
            'onclick="document.getElementById(\'jm-final-file\').click()">' +
            '<i class="bi bi-upload"></i>อัปโหลดไฟล์ส่งมอบ</button>' +
        '</div>' +

        '<div class="card-soft p-3 p-md-4 mb-3">' +
          '<div class="fw-semibold mb-3"><i class="bi bi-arrow-repeat me-2" style="color:var(--purple)"></i>' +
            'ข้อแก้ไขจากผู้ขอ</div>' + revisionsHtml +
        '</div>' +

        '<div class="card-soft p-3 p-md-4">' +
          '<div class="fw-semibold mb-3"><i class="bi bi-clock-history me-2" style="color:var(--primary)"></i>' +
            'ประวัติการดำเนินงาน</div>' +
          '<div style="max-height:320px;overflow-y:auto">' + timelineHtml + '</div>' +
          (r.trackUrl ? '<div class="mt-3 pt-3" style="border-top:1px solid var(--border)">' +
            '<div class="detail-label">ลิงก์ติดตามของผู้ขอรับบริการ</div>' +
            '<div class="text-truncate"><a href="' + App.esc(r.trackUrl) + '" target="_blank" ' +
            'style="font-size:.78rem">' + App.esc(r.trackUrl) + '</a></div></div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ------------------------------------------------------ การกระทำกับงาน */

  function changeStatus(toStatus) {
    var config = {
      REVIEW: {
        title: 'ส่งร่างให้ตรวจ',
        html: '<div class="rules-box mb-3" style="font-size:.83rem">' +
          'ตรวจสอบให้แน่ใจว่าลิงก์ด้านล่างชี้ไปยังร่างเวอร์ชันล่าสุด ' +
          'ผู้ขอรับบริการจะได้รับลิงก์นี้ทางอีเมลเพื่อตรวจและแจ้งจุดแก้ไข</div>',
        field: {
          label: 'ลิงก์ร่างชิ้นงาน', required: true, type: 'url',
          value: currentJob.request.draftUrl, placeholder: 'https://...',
          hint: 'ใช้ลิงก์ Canva, Google Drive หรือ Adobe ที่เปิดให้แสดงความเห็นได้'
        }
      },
      INFO_NEEDED: {
        title: 'ขอข้อมูลเพิ่มเติม',
        field: {
          label: 'ระบุข้อมูลที่ต้องการเพิ่มเติม', required: true, type: 'textarea', rows: 5,
          placeholder: 'พิมพ์บรรทัดละ 1 รายการ เพื่อส่งถามผู้ขอรับบริการในคราวเดียว'
        }
      },
      CANCELLED: {
        title: 'ยกเลิกคำขอ',
        field: { label: 'เหตุผลในการยกเลิก', required: true, type: 'textarea', rows: 3 }
      },
      DELIVERED: {
        title: 'ส่งมอบงาน',
        html: '<div class="rules-box mb-3" style="font-size:.83rem">' +
          'กรุณาอัปโหลดไฟล์ฉบับสมบูรณ์ให้ครบก่อนส่งมอบ ระบบจะส่งลิงก์ไฟล์ทั้งหมดไปยังอีเมลของผู้ขอรับบริการ</div>',

  function uploadFinal(fileList) {
    if (!fileList || fileList.length === 0) return;
    var cfg = App.getCfg();
    var maxBytes = cfg.settings.maxFileMB * 1024 * 1024;
    var queue = [];
    for (var i = 0; i < fileList.length; i++) {
      if (fileList[i].size > maxBytes) {
        App.toast('ไฟล์ "' + fileList[i].name + '" เกิน ' + cfg.settings.maxFileMB + ' MB', 'err');
        continue;
      }
      queue.push(fileList[i]);
    }
    if (queue.length === 0) return;

    var jobId = currentJob.request.jobId;
    function step(index) {
      if (index >= queue.length) {
        App.loading(false);
        App.toast('อัปโหลดไฟล์ส่งมอบเรียบร้อย', 'ok');
        reloadJob();
        return;
      }
      var file = queue[index];
      App.loading(true, 'กำลังอัปโหลด ' + (index + 1) + '/' + queue.length + ' ...');
      var reader = new FileReader();
      reader.onload = function (e) {
        var result = String(e.target.result);
        var comma = result.indexOf(',');
        App.api('apiAdminUploadFile', [token, jobId, {
          fileName: file.name,
          mimeType: file.type || 'application/octet-stream',
          dataB64: comma >= 0 ? result.substring(comma + 1) : result
        }, 'final']).then(function () {
          step(index + 1);
        }).catch(function (err) {
          App.toast('อัปโหลด "' + file.name + '" ไม่สำเร็จ: ' + err.message, 'err');
          step(index + 1);
        });
      };
      reader.onerror = function () {
        App.toast('อ่านไฟล์ "' + file.name + '" ไม่สำเร็จ', 'err');
        step(index + 1);
      };
      reader.readAsDataURL(file);
    }
    step(0);
  }

  }

  function saveSettings() {
    var inputs = document.querySelectorAll('#settings-fields [data-key]');
    var patch = {};
    for (var i = 0; i < inputs.length; i++) {
      patch[inputs[i].getAttribute('data-key')] = inputs[i].value;
    }
    App.loading(true, 'กำลังบันทึก...');
    App.api('apiAdminSaveSettings', [token, patch]).then(function () {
      App.loading(false);
      App.toast('บันทึกการตั้งค่าเรียบร้อย (รีเฟรชหน้าเพื่อให้มีผลกับแบบฟอร์ม)', 'ok');
    }).catch(handleAuthError);
  }

  function copyText(btn, text) {
    var box = document.createElement('textarea');
    box.value = text;
    box.style.position = 'fixed';
    box.style.opacity = '0';
    document.body.appendChild(box);
    box.select();
    try { document.execCommand('copy'); } catch (e) { /* เบราว์เซอร์ไม่รองรับ */ }
    document.body.removeChild(box);
    var original = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-check-lg"></i>';
    setTimeout(function () { btn.innerHTML = original; }, 1500);
  }

  function testEmail() {
    App.loading(true, 'กำลังส่งอีเมลทดสอบ...');
    App.api('apiAdminTestEmail', [token]).then(function (res) {
      App.loading(false);
      App.toast('ส่งอีเมลทดสอบไปที่ ' + res.sentTo.join(', ') + ' แล้ว กรุณาตรวจกล่องจดหมาย', 'ok');
    }).catch(handleAuthError);
  }

  function saveApiKey() {
    var key = document.getElementById('ai-key').value.trim();
    if (!key) { App.toast('กรุณากรอก API key', 'err'); return; }
    App.loading(true, 'กำลังบันทึก API key...');
    App.api('apiAdminSetApiKey', [token, key]).then(function () {
      App.loading(false);
      App.toast('บันทึก API key เรียบร้อย ระบบจะใช้ AI สรุป Design Brief ตั้งแต่คำขอถัดไป', 'ok');
      loadSettings();
    }).catch(handleAuthError);
  }

  function clearApiKey() {
    App.prompt({
      title: 'ลบ API key',
      html: '<p style="font-size:.9rem">หลังลบแล้ว ระบบจะสรุป Design Brief ด้วยสูตรสำเร็จแทน AI</p>',
      okLabel: 'ลบ API key'
    }).then(function (ok) {
      if (!ok) return;
      return App.api('apiAdminSetApiKey', [token, '']).then(function () {
        App.toast('ลบ API key เรียบร้อย', 'ok');
        loadSettings();
      });
    }).catch(handleAuthError);
  }

  function editUser(email) {
    var isNew = !email;
    App.prompt({
      title: isNew ? 'เพิ่มบัญชีเจ้าหน้าที่' : 'แก้ไขบัญชี ' + email,
      html:
        '<div class="mb-2"><label class="form-label">อีเมล<span class="req">*</span></label>' +
        '<input type="email" class="form-control" id="u-email" value="' + App.esc(email) + '"' +
        (isNew ? '' : ' readonly') + '></div>' +
        '<div class="mb-2"><label class="form-label">ชื่อ-นามสกุล<span class="req">*</span></label>' +
        '<input type="text" class="form-control" id="u-name"></div>' +
        '<div class="mb-2"><label class="form-label">สิทธิ์</label>' +
        '<select class="form-select" id="u-role"><option value="staff">เจ้าหน้าที่</option>' +
        '<option value="admin">ผู้ดูแลระบบ</option></select></div>' +
        '<div class="mb-2"><label class="form-label">รหัสผ่าน' +
        (isNew ? '<span class="req">*</span>' : ' (เว้นว่างหากไม่เปลี่ยน)') + '</label>' +
        '<input type="password" class="form-control" id="u-password" autocomplete="new-password"></div>' +
        '<div class="form-check"><input class="form-check-input" type="checkbox" id="u-active" checked>' +
        '<label class="form-check-label" for="u-active">เปิดใช้งานบัญชีนี้</label></div>',
      okLabel: 'บันทึก'
    }).then(function (ok) {
      if (!ok) return;
      var payload = {
        email: document.getElementById('u-email') ? document.getElementById('u-email').value.trim() : email,
        name: document.getElementById('u-name') ? document.getElementById('u-name').value.trim() : '',
        role: document.getElementById('u-role') ? document.getElementById('u-role').value : 'staff',
        password: document.getElementById('u-password') ? document.getElementById('u-password').value : '',
        active: document.getElementById('u-active') ? document.getElementById('u-active').checked : true
      };
      App.loading(true, 'กำลังบันทึก...');
      return App.api('apiAdminSaveUser', [token, payload]).then(function () {
        App.loading(false);
        App.toast('บันทึกบัญชีเรียบร้อย', 'ok');
        loadSettings();
      });
    }).catch(handleAuthError);
  }

  function openChangePassword() {
    App.prompt({
      title: 'เปลี่ยนรหัสผ่าน',
      html:
        '<div class="mb-2"><label class="form-label">รหัสผ่านปัจจุบัน</label>' +
        '<input type="password" class="form-control" id="p-old" autocomplete="current-password"></div>' +
        '<div><label class="form-label">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label>' +
        '<input type="password" class="form-control" id="p-new" autocomplete="new-password"></div>',
      okLabel: 'เปลี่ยนรหัสผ่าน'
    }).then(function (ok) {
      if (!ok) return;
      var oldPw = document.getElementById('p-old').value;
      var newPw = document.getElementById('p-new').value;
      App.loading(true, 'กำลังเปลี่ยนรหัสผ่าน...');
      return App.api('apiChangePassword', [token, oldPw, newPw]).then(function () {
        App.loading(false);
        App.toast('เปลี่ยนรหัสผ่านเรียบร้อย', 'ok');
      });
    }).catch(handleAuthError);
  }

  /* -------------------------------------------------------------- ส่งออก */

  function exportCsv() {
    var filter = {
      q: document.getElementById('q-search').value.trim(),
      status: document.getElementById('q-status').value,
      priority: document.getElementById('q-priority').value
    };
    App.loading(true, 'กำลังเตรียมข้อมูล...');
    App.api('apiAdminExport', [token, filter]).then(function (data) {
      App.loading(false);
      var lines = [data.header].concat(data.rows).map(function (row) {
        return row.map(function (cell) {
          var v = String(cell === null || cell === undefined ? '' : cell);
          return '"' + v.replace(/"/g, '""') + '"';
        }).join(',');
      });
      var csv = lines.join('\n');
      App.prompt({
        title: 'ส่งออกข้อมูล (' + data.rows.length + ' รายการ)',
        html: '<div class="form-text mb-2">คัดลอกข้อความด้านล่างไปวางในโปรแกรม Excel หรือ Google Sheets ' +
          'โดยเลือก Paste special แล้วแยกด้วยเครื่องหมายจุลภาค</div>' +
          '<textarea class="form-control" rows="10" id="csv-out" style="font-size:.75rem;' +
          'font-family:monospace">' + App.esc(csv) + '</textarea>',
        okLabel: 'คัดลอกทั้งหมด'
      }).then(function (ok) {
        if (!ok) return;
        var box = document.getElementById('csv-out');
        if (box) { box.select(); document.execCommand('copy'); }
        App.toast('คัดลอกข้อมูลแล้ว', 'ok');
      });
    }).catch(handleAuthError);
  }

  return {
    init: init, isLoggedIn: isLoggedIn, login: login, logout: logout, onEnter: onEnter,
    loadQueue: loadQueue, debouncedLoadQueue: debouncedLoadQueue, openJob: openJob,
    changeStatus: changeStatus, setDraftUrl: setDraftUrl, assign: assign, addNote: addNote,
    setRevisionLimit: setRevisionLimit, regenerateBrief: regenerateBrief,
    uploadFinal: uploadFinal, deleteFile: deleteFile, saveSettings: saveSettings,
    saveApiKey: saveApiKey, clearApiKey: clearApiKey, testEmail: testEmail, copyText: copyText,
    editUser: editUser, openChangePassword: openChangePassword, exportCsv: exportCsv
  };
})();
</script>
