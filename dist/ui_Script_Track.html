<script>
/* =========================================================================
   ui_Script_Track — หน้าติดตามสถานะสำหรับผู้ขอรับบริการ
   ========================================================================= */
var Track = (function () {
  var current = null;   // ข้อมูลงานที่กำลังแสดง
  var auth = { jobId: '', email: '', token: '' };

  function search() {
    var jobId = document.getElementById('t-job').value.trim().toUpperCase();
    var email = document.getElementById('t-email').value.trim();
    if (!jobId) { App.toast('กรุณากรอกเลขที่คำขอ', 'err'); return; }
    if (!email) { App.toast('กรุณากรอกอีเมลที่ใช้ยื่นคำขอ', 'err'); return; }
    load(jobId, email, '');
  }

  function openFromLink(jobId, token) {
    document.getElementById('t-job').value = jobId;
    load(jobId, '', token);
  }

  function load(jobId, email, token) {
    App.loading(true, 'กำลังค้นหาคำขอ...');
    App.api('apiTrack', [jobId, email, token]).then(function (data) {
      App.loading(false);
      auth = { jobId: jobId, email: email, token: token };
      current = data;
      render(data);
    }).catch(function (err) {
      App.loading(false);
      current = null;
      document.getElementById('track-result').innerHTML =
        '<div class="card-soft empty-state">' +
        '<i class="bi bi-search"></i>' +
        '<p class="mt-3 mb-0">' + App.esc(err.message) + '</p></div>';
    });
  }

  function refresh() {
    if (!auth.jobId) return;
    load(auth.jobId, auth.email, auth.token);
  }

  function stepperHtml(view) {
    var flow = App.getCfg().statusFlow;
    var isException = view.statusStep === 0;
    if (isException) {
      var color = view.status === 'CANCELLED' ? 'var(--text-light)' : 'var(--danger)';
      var icon = view.status === 'CANCELLED' ? 'bi-x-circle-fill' : 'bi-exclamation-triangle-fill';
      var note = view.status === 'CANCELLED'
        ? (view.cancelReason ? 'เหตุผล: ' + view.cancelReason : '')
        : 'เจ้าหน้าที่ขอข้อมูลเพิ่มเติม กรุณาตอบในกล่องด้านล่าง เมื่อส่งแล้วงานจะกลับเข้าคิวทันที';
      return '<div class="p-3 p-md-4 mb-3" style="background:#fff5f5;border:1px solid #fecaca;border-radius:16px">' +
        '<div class="d-flex gap-3 align-items-start">' +
        '<i class="bi ' + icon + '" style="font-size:1.6rem;color:' + color + '"></i>' +
        '<div><div style="font-weight:600">' + App.esc(view.statusLabel) + '</div>' +
        '<div style="font-size:.87rem;color:var(--text-light)">' + App.esc(note) + '</div></div></div></div>';
    }

    var total = flow.length;
    var progress = total > 1 ? ((view.statusStep - 1) / (total - 1)) * 80 : 0;
    var steps = flow.map(function (s) {
      var cls = s.step < view.statusStep ? 'done' : (s.step === view.statusStep ? 'now' : '');
      var inner = s.step < view.statusStep ? '<i class="bi bi-check-lg"></i>' : s.step;
      return '<div class="tstep ' + cls + '">' +
        '<div class="circle">' + inner + '</div>' +
        '<div><div class="label">' + App.esc(s.label) + '</div>' +
        '<div class="en">' + App.esc(s.en) + '</div></div></div>';
    }).join('');

    return '<div class="track-stepper">' +
      '<div class="bar" style="width:' + progress + '%"></div>' + steps + '</div>';
  }

  function render(view) {
    var cfg = App.getCfg();
    var daysLeft = App.daysUntil(view.dueDate);
    var dueClass = daysLeft === null ? '' :
      (daysLeft < 0 ? 'color:var(--danger)' : (daysLeft <= 3 ? 'color:var(--warning)' : ''));

    var deliverables = view.deliverables.map(function (d) {
      return '<li>' + App.esc(d.mediaLabel) + ' &middot; ขนาด ' + App.esc(d.size) +
        (d.quantity > 1 ? ' &middot; จำนวน ' + d.quantity + ' ชิ้น' : '') +
        (d.note ? '<div style="font-size:.8rem;color:var(--text-light)">' + App.esc(d.note) + '</div>' : '') +
        '</li>';
    }).join('');

    var actionBox = '';
    if (view.approved) {
      actionBox =
        '<div class="card-soft p-3 p-md-4 mb-3" style="border-color:#a7f3d0;background:#f0fdf4">' +
          '<div class="fw-semibold mb-1"><i class="bi bi-check-circle-fill me-2" style="color:var(--success)"></i>' +
          'ท่านอนุมัติร่างชิ้นงานแล้ว</div>' +
          '<div style="font-size:.85rem;color:var(--text-light)">' +
            (view.approvedAt ? 'เมื่อ ' + App.thaiDate(view.approvedAt, true) + ' ' : '') +
            'เจ้าหน้าที่กำลังจัดทำไฟล์ฉบับสมบูรณ์ ระบบจะแจ้งทางอีเมลเมื่อส่งมอบ ' +
            'หากต้องการแก้ไขเพิ่มเติม กรุณาติดต่อฝ่ายสื่อสารองค์กรโดยตรง</div>' +
          (view.draftUrl ?
            '<a href="' + App.esc(view.draftUrl) + '" target="_blank" class="btn btn-ghost btn-sm mt-3">' +
            '<i class="bi bi-box-arrow-up-right me-1"></i>เปิดดูร่างที่อนุมัติ</a>' : '') +
        '</div>';
    } else if (view.canApprove || view.canRequestRevision) {
      actionBox =
        '<div class="card-soft p-3 p-md-4 mb-3" style="border-color:#fed7aa;background:#fffaf5">' +
          '<div class="fw-semibold mb-2"><i class="bi bi-eye me-2" style="color:var(--primary)"></i>' +
          'ร่างชิ้นงานพร้อมให้ตรวจแล้ว</div>' +
          (view.draftUrl ?
            '<a href="' + App.esc(view.draftUrl) + '" target="_blank" class="btn btn-ghost btn-sm mb-3">' +
            '<i class="bi bi-box-arrow-up-right me-1"></i>เปิดดูร่างชิ้นงาน</a>' : '') +
          '<div style="font-size:.85rem;color:var(--text-light)" class="mb-3">' +
            'ใช้สิทธิ์แก้ไขไปแล้ว ' + view.revisionCount + ' จาก ' + view.revisionLimit + ' รอบ ' +
            'กรุณารวบรวมจุดที่ต้องการแก้ไขให้ครบในคราวเดียว' +
          '</div>' +
          '<div class="d-flex gap-2 flex-wrap">' +
            (view.canApprove ?
              '<button class="btn btn-brand btn-sm" onclick="Track.approve()">' +
              '<i class="bi bi-check-circle"></i>อนุมัติร่างชิ้นงาน</button>' : '') +
            (view.canRequestRevision ?
              '<button class="btn btn-ghost btn-sm" onclick="Track.requestRevision()">' +
              '<i class="bi bi-pencil-square me-1"></i>แจ้งจุดที่ต้องแก้ไข</button>' :
              '<span class="badge-soft">ใช้สิทธิ์แก้ไขครบแล้ว กรุณาติดต่อเจ้าหน้าที่โดยตรง</span>') +
          '</div>' +
        '</div>';
    }

    var filesBox = '';
    if (view.finalFiles && view.finalFiles.length > 0) {
      filesBox =
        '<div class="card-soft p-3 p-md-4 mb-3" style="border-color:#a7f3d0;background:#f0fdf4">' +
          '<div class="fw-semibold mb-3"><i class="bi bi-folder-check me-2" style="color:var(--success)"></i>' +
          'ไฟล์ฉบับสมบูรณ์</div>' +
          view.finalFiles.map(function (f) {
            return '<div class="file-row">' +
              '<i class="bi bi-file-earmark-arrow-down" style="color:var(--success)"></i>' +
              '<div class="flex-grow-1 text-truncate">' + App.esc(f.fileName) + '</div>' +
              '<a href="' + App.esc(f.fileUrl) + '" target="_blank" class="btn btn-sm btn-ghost py-1">' +
              'เปิดไฟล์</a></div>';
          }).join('') +
        '</div>';
    }

    var revisionsBox = '';
    if (view.revisions.length > 0) {
      revisionsBox =
        '<div class="card-soft p-3 p-md-4 mb-3">' +
          '<div class="fw-semibold mb-3"><i class="bi bi-arrow-repeat me-2" style="color:var(--purple)"></i>' +
          'ประวัติการขอแก้ไข</div>' +
          view.revisions.map(function (r) {
            return '<div class="mb-3 pb-3" style="border-bottom:1px dashed var(--border)">' +
              '<div class="d-flex justify-content-between align-items-center mb-1">' +
              '<span class="badge-soft">รอบที่ ' + r.round + '</span>' +
              '<span style="font-size:.76rem;color:var(--text-light)">' +
              App.thaiDate(r.createdAt, true) + '</span></div>' +
              '<div style="font-size:.87rem">' + App.nl2br(r.comment) + '</div></div>';
          }).join('') +
        '</div>';
    }

    var timelineBox =
      '<div class="card-soft p-3 p-md-4">' +
        '<div class="fw-semibold mb-3"><i class="bi bi-clock-history me-2" style="color:var(--primary)"></i>' +
        'ประวัติการดำเนินงาน</div>' +
        view.timeline.slice().reverse().map(function (t) {
          return '<div class="timeline-item">' +
            '<div class="tl-dot"><i class="bi ' + timelineIcon(t.action) + '"></i></div>' +
            '<div class="tl-body">' + timelineText(t) +
            '<div class="tl-time">' + App.thaiDate(t.at, true) + '</div></div></div>';
        }).join('') +
      '</div>';

    document.getElementById('track-result').innerHTML =
      '<div class="card-soft p-3 p-md-4 mb-3">' +
        '<div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-1">' +
          '<div>' +
            '<div style="font-size:.78rem;color:var(--text-light)">เลขที่คำขอ</div>' +
            '<div style="font-size:1.35rem;font-weight:700;color:var(--primary);letter-spacing:.5px">' +
              App.esc(view.jobId) + '</div>' +
          '</div>' +
          '<div class="text-end">' +
            '<span class="badge-status" style="background:' + view.statusColor + '">' +
              App.esc(view.statusLabel) + '</span>' +
            '<div style="font-size:.76rem;color:var(--text-light);margin-top:.3rem">' +
              'อัปเดตล่าสุด ' + App.thaiDate(view.timeline.length ?
                view.timeline[view.timeline.length - 1].at : view.createdAt, true) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="font-size:1.02rem;font-weight:500;margin-bottom:.2rem">' +
          App.esc(view.projectName) + '</div>' +
        '<div style="font-size:.85rem;color:var(--text-light)">' +
          App.esc(view.requesterName) + ' &middot; ' + App.esc(view.department) + '</div>' +
        (view.designer
          ? '<div class="d-flex align-items-center gap-2 mt-1" style="font-size:.85rem">' +
            '<i class="cdot" style="--c:' + App.esc(view.designer.color) + '"></i>ผู้ออกแบบ ' +
            '<strong style="font-weight:500">' + App.esc(view.designer.name) + '</strong></div>'
          : (view.status !== 'DELIVERED' && view.status !== 'CANCELLED'
            ? '<div class="d-flex align-items-center gap-2 mt-1" style="font-size:.85rem;color:var(--text-light)">' +
              '<i class="cdot" style="--c:#94a3b8"></i>รอจัดสรรผู้ออกแบบ</div>' : '')) +
        stepperHtml(view) +
        '<div class="row g-3 mt-1 pt-3" style="border-top:1px solid var(--border)">' +
          '<div class="col-6 col-md-3"><div class="detail-label">วันที่ยื่นคำขอ</div>' +
            '<div style="font-size:.88rem">' + App.thaiDate(view.createdAt) + '</div></div>' +
          '<div class="col-6 col-md-3"><div class="detail-label">กำหนดใช้งาน</div>' +
            '<div style="font-size:.88rem;' + dueClass + '">' + App.thaiDate(view.dueDate) +
            (daysLeft !== null && view.statusStep < 5 && view.statusStep > 0 ?
              '<br><span style="font-size:.76rem">' +
              (daysLeft < 0 ? 'เกินกำหนด ' + Math.abs(daysLeft) + ' วัน' : 'เหลืออีก ' + daysLeft + ' วัน') +
              '</span>' : '') + '</div></div>' +
          '<div class="col-6 col-md-3"><div class="detail-label">ความเร่งด่วน</div>' +
            '<div style="font-size:.88rem">' + App.esc(view.priority) + '</div></div>' +
          '<div class="col-6 col-md-3"><div class="detail-label">รอบการแก้ไข</div>' +
            '<div style="font-size:.88rem">' + view.revisionCount + ' / ' + view.revisionLimit + ' รอบ</div></div>' +
        '</div>' +
        '<div class="mt-3 pt-3" style="border-top:1px solid var(--border)">' +
          '<div class="detail-label mb-1">รายการชิ้นงานที่ขอ</div>' +
          '<ul style="font-size:.88rem;padding-left:1.1rem;margin-bottom:0;line-height:1.9">' +
            deliverables + '</ul>' +
        '</div>' +
      '</div>' +
      actionBox + infoBox(view) + filesBox + feedbackBox(view) + revisionsBox + timelineBox;
    if (view.archived) {
      document.getElementById('track-result').insertAdjacentHTML('afterbegin',
        '<div class="archived-banner mb-3"><i class="bi bi-archive me-1"></i>' +
        'คำขอนี้ปิดงานไปนานแล้วและถูกย้ายไปเก็บถาวร ดูข้อมูลและดาวน์โหลดไฟล์ได้ตามปกติ</div>');
    }
    if (view.canReply) setupReplyFiles();
  }

  /* --------------------------------------------- ตอบข้อมูลเพิ่มเติม */

  var replyFiles = [];

  function infoBox(view) {
    if (!view.canReply) return '';
    var q = view.infoRequest || {};
    return '<div class="info-box mb-3" id="reply-box">' +
      '<div class="fw-semibold mb-2" style="color:var(--danger)"><i class="bi bi-chat-left-dots me-2"></i>' +
        'เจ้าหน้าที่ขอข้อมูลเพิ่มเติม</div>' +
      (q.question ? '<div class="mb-3" style="font-size:.9rem;background:#fff;border-radius:12px;padding:.75rem .9rem">' +
        App.nl2br(q.question) + '</div>' : '') +
      '<label class="form-label" for="reply-text">คำตอบของท่าน</label>' +
      '<textarea class="form-control mb-2" id="reply-text" rows="4" maxlength="3000" ' +
        'placeholder="พิมพ์ข้อมูลที่เจ้าหน้าที่ขอ ตอบให้ครบทุกข้อในครั้งเดียว"></textarea>' +
      '<input type="file" id="reply-files" class="d-none" multiple onchange="Track.pickReplyFiles(this.files)">' +
      '<div class="d-flex flex-wrap gap-2 align-items-center mb-2">' +
        '<button type="button" class="btn btn-sm btn-ghost" onclick="document.getElementById(\'reply-files\').click()">' +
          '<i class="bi bi-paperclip me-1"></i>แนบไฟล์</button>' +
        '<span class="row-sub">แนบได้สูงสุด ' + view.replyMaxFiles + ' ไฟล์</span></div>' +
      '<div id="reply-file-list" class="mb-3"></div>' +
      '<button type="button" class="btn btn-brand btn-sm" id="reply-send" onclick="Track.sendReply()">' +
        '<i class="bi bi-send"></i>ส่งข้อมูลให้เจ้าหน้าที่</button>' +
    '</div>';
  }

  function setupReplyFiles() {
    replyFiles = [];
    renderReplyFiles();
  }

  function pickReplyFiles(list) {
    var cfg = App.getCfg().settings;
    var allowed = cfg.allowedFileTypes.toLowerCase().split(',').map(function (x) { return x.trim(); });
    var max = (current && current.replyMaxFiles) || cfg.maxFiles;
    Array.prototype.forEach.call(list, function (file) {
      var ext = file.name.lastIndexOf('.') >= 0 ? file.name.substring(file.name.lastIndexOf('.') + 1).toLowerCase() : '';
      if (allowed.indexOf(ext) < 0) { App.toast('ไฟล์ "' + file.name + '" เป็นชนิดที่ไม่รองรับ', 'err'); return; }
      if (file.size > cfg.maxFileMB * 1048576) {
        App.toast('ไฟล์ "' + file.name + '" เกิน ' + cfg.maxFileMB + ' MB', 'err'); return;
      }
      if (replyFiles.length >= max) { App.toast('แนบได้สูงสุด ' + max + ' ไฟล์', 'err'); return; }
      replyFiles.push(file);
    });
    document.getElementById('reply-files').value = '';
    renderReplyFiles();
  }

  function removeReplyFile(i) {
    replyFiles.splice(i, 1);
    renderReplyFiles();
  }

  function renderReplyFiles() {
    var el = document.getElementById('reply-file-list');
    if (!el) return;
    el.innerHTML = replyFiles.map(function (f, i) {
      return '<div class="file-row"><i class="bi bi-file-earmark" style="color:var(--primary)"></i>' +
        '<div class="flex-grow-1 text-truncate">' + App.esc(f.name) + '</div>' +
        '<span class="row-sub">' + App.bytes(f.size) + '</span>' +
        '<button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="Track.removeReplyFile(' + i + ')">' +
        '<i class="bi bi-x-lg"></i></button></div>';
    }).join('');
  }

  function readBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var r = String(e.target.result);
        resolve(r.indexOf(',') >= 0 ? r.substring(r.indexOf(',') + 1) : r);
      };
      reader.onerror = function () { reject(new Error('อ่านไฟล์ "' + file.name + '" ไม่สำเร็จ')); };
      reader.readAsDataURL(file);
    });
  }

  /** แนบไฟล์ทีละไฟล์ก่อน แล้วจึงส่งคำตอบ (ส่งคำตอบแล้วสถานะเปลี่ยน จะแนบเพิ่มไม่ได้) */
  function sendReply() {
    var text = document.getElementById('reply-text').value.trim();
    if (text.length < 2 && replyFiles.length === 0) {
      App.toast('กรุณาพิมพ์คำตอบ หรือแนบไฟล์อย่างน้อย 1 ไฟล์', 'err');
      return;
    }
    var btn = document.getElementById('reply-send');
    btn.disabled = true;
    var files = replyFiles.slice();
    var failed = [];
    var chain = Promise.resolve();
    files.forEach(function (f, i) {
      chain = chain.then(function () {
        App.loading(true, 'กำลังแนบไฟล์ ' + (i + 1) + ' จาก ' + files.length + '...');
        return readBase64(f).then(function (data) {
          return App.api('apiInfoUpload', [auth.jobId, auth.email, auth.token,
            { fileName: f.name, mimeType: f.type || 'application/octet-stream', dataB64: data }]);
        }).catch(function (err) {
          failed.push(f.name);
          App.toast('แนบไฟล์ "' + f.name + '" ไม่สำเร็จ: ' + err.message, 'err');
        });
      });
    });
    chain.then(function () {
      if (failed.length === files.length && files.length > 0 && text.length < 2) {
        throw new Error('แนบไฟล์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
      }
      App.loading(true, 'กำลังส่งข้อมูลให้เจ้าหน้าที่...');
      return App.api('apiInfoReply', [auth.jobId, auth.email, auth.token, text]);
    }).then(function (res) {
      App.loading(false);
      replyFiles = [];
      App.toast('ส่งข้อมูลเรียบร้อย งานกลับเข้าคิวในสถานะ "' + res.statusLabel + '" แล้ว', 'ok');
      refresh();
    }).catch(function (err) {
      App.loading(false);
      btn.disabled = false;
      App.toast(err.message, 'err');
    });
  }

  /* --------------------------------------------- ประเมินความพึงพอใจ */

  var RATING_TEXT = ['', 'ควรปรับปรุง', 'พอใช้', 'ดี', 'ดีมาก', 'ดีเยี่ยม'];
  var pickedRating = 0;

  function starsHtml(n, interactive) {
    var out = '';
    for (var i = 1; i <= 5; i++) {
      out += interactive
        ? '<button type="button" class="star' + (i <= n ? ' on' : '') + '" aria-label="' + i + ' ดาว" ' +
          'onclick="Track.pickRating(' + i + ')"><i class="bi bi-star-fill"></i></button>'
        : '<span class="star' + (i <= n ? ' on' : '') + '"><i class="bi bi-star-fill"></i></span>';
    }
    return '<span class="stars' + (interactive ? '' : ' static') + '">' + out + '</span>';
  }

  function feedbackBox(view) {
    if (!view.canRate && !view.feedback) return '';
    var fb = view.feedback;
    if (fb && !view.editingFeedback) {
      return '<div class="card-soft p-3 p-md-4 mb-3">' +
        '<div class="fw-semibold mb-2"><i class="bi bi-emoji-smile me-2" style="color:var(--primary)"></i>' +
          'ขอบคุณสำหรับการประเมิน</div>' +
        '<div class="d-flex align-items-center gap-2 mb-1">' + starsHtml(fb.rating, false) +
          '<span style="font-size:.85rem">' + App.esc(fb.ratingLabel) + '</span></div>' +
        (fb.comment ? '<div style="font-size:.85rem;color:var(--text-light)">' + App.nl2br(fb.comment) + '</div>' : '') +
        (view.canRate ? '<button type="button" class="btn btn-link btn-sm p-0 mt-2" onclick="Track.editRating()">' +
          'แก้ไขผลประเมิน</button>' : '') +
      '</div>';
    }
    pickedRating = fb ? fb.rating : 0;
    return '<div class="card-soft p-3 p-md-4 mb-3" style="border-color:#fde68a;background:#fffdf5" id="rate-box">' +
      '<div class="fw-semibold mb-1"><i class="bi bi-star me-2" style="color:#f59e0b"></i>' +
        'ประเมินความพึงพอใจต่องานบริการ</div>' +
      '<div style="font-size:.85rem;color:var(--text-light)" class="mb-2">ใช้เวลาไม่ถึง 1 นาที ' +
        'ความเห็นของท่านช่วยให้เราพัฒนางานบริการได้ตรงความต้องการ</div>' +
      '<div class="d-flex align-items-center gap-2 mb-2"><span id="rate-stars">' + starsHtml(pickedRating, true) + '</span>' +
        '<span id="rate-label" style="font-size:.88rem;font-weight:500">' + App.esc(RATING_TEXT[pickedRating]) + '</span></div>' +
      '<textarea class="form-control mb-2" id="rate-comment" rows="2" maxlength="1000" ' +
        'placeholder="ข้อเสนอแนะเพิ่มเติม (ถ้ามี)">' + App.esc(fb ? fb.comment : '') + '</textarea>' +
      '<button type="button" class="btn btn-brand btn-sm" id="rate-send" onclick="Track.sendRating()">' +
        '<i class="bi bi-send"></i>ส่งผลประเมิน</button>' +
    '</div>';
  }

  function pickRating(n) {
    pickedRating = n;
    document.getElementById('rate-stars').innerHTML = starsHtml(n, true);
    document.getElementById('rate-label').textContent = RATING_TEXT[n];
  }

  function editRating() {
    if (!current) return;
    current.editingFeedback = true;
    render(current);
    var box = document.getElementById('rate-box');
    if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function sendRating() {
    if (!pickedRating) { App.toast('กรุณาเลือกจำนวนดาว 1 ถึง 5', 'err'); return; }
    var comment = document.getElementById('rate-comment').value.trim();
    document.getElementById('rate-send').disabled = true;
    App.loading(true, 'กำลังส่งผลประเมิน...');
    App.api('apiSubmitFeedback', [auth.jobId, auth.email, auth.token, pickedRating, comment]).then(function () {
      App.loading(false);
      App.toast('ขอบคุณสำหรับการประเมินครับ', 'ok');
      refresh();
    }).catch(function (err) {
      App.loading(false);
      document.getElementById('rate-send').disabled = false;
      App.toast(err.message, 'err');
    });
  }

  function actionLabel(action) {
    var map = {
      CREATE: 'ยื่นคำขอเข้าสู่ระบบ', SUBMIT: 'ยืนยันการยื่นคำขอ', STATUS: 'เปลี่ยนสถานะงาน',
      REVISION: 'ขอแก้ไขร่างชิ้นงาน', APPROVE: 'อนุมัติร่างชิ้นงาน', BRIEF: 'สรุปโจทย์งานออกแบบ',
      UPLOAD: 'อัปโหลดไฟล์', ASSIGN: 'มอบหมายผู้รับผิดชอบ', INFO_REPLY: 'ส่งข้อมูลเพิ่มเติม',
      INFO_FILE: 'แนบไฟล์เพิ่มเติม', FEEDBACK: 'ประเมินความพึงพอใจ'
    };
    return map[action] || action;
  }

  function timelineText(t) {
    if (t.action === 'STATUS' && t.toLabel) {
      return '<div>สถานะเปลี่ยนเป็น <strong>' + App.esc(t.toLabel) + '</strong></div>' +
        (t.detail ? '<div class="tl-note">' + App.nl2br(t.detail) + '</div>' : '');
    }
    return '<div>' + App.esc(t.detail || actionLabel(t.action)) + '</div>';
  }

  function timelineIcon(action) {
    var map = {
      CREATE: 'bi-file-earmark-plus', SUBMIT: 'bi-send-check', STATUS: 'bi-arrow-right-circle',
      REVISION: 'bi-pencil-square', APPROVE: 'bi-hand-thumbs-up', BRIEF: 'bi-cpu',
      UPLOAD: 'bi-cloud-arrow-up', ASSIGN: 'bi-person-check', BRIEF_FALLBACK: 'bi-cpu',
      INFO_REPLY: 'bi-chat-left-text', INFO_FILE: 'bi-paperclip', FEEDBACK: 'bi-star'
    };
    return map[action] || 'bi-dot';
  }

  function requestRevision() {
    App.prompt({
      title: 'แจ้งจุดที่ต้องการแก้ไข',
      html: '<div class="rules-box mb-3" style="font-size:.83rem">' +
        'กรุณาระบุจุดที่ต้องการแก้ไขให้ครบถ้วนในคราวเดียว เช่น ข้อความที่ต้องแก้ ตำแหน่งภาพ สีที่ต้องการ ' +
        'เพื่อให้การแก้ไขเสร็จภายในรอบเดียว</div>',
      field: {
        label: 'รายละเอียดจุดที่ต้องแก้ไข', type: 'textarea', rows: 6, required: true,
        maxlength: 2000, placeholder: 'ตัวอย่าง\n1. แก้วันที่จาก 15 ต.ค. เป็น 18 ต.ค.\n2. เปลี่ยนภาพประกอบด้านบนเป็นภาพที่แนบใหม่'
      },
      okLabel: 'ส่งคำขอแก้ไข'
    }).then(function (text) {
      if (!text) return;
      App.loading(true, 'กำลังส่งคำขอแก้ไข...');
      return App.api('apiRequestRevision', [auth.jobId, auth.email, auth.token, text])
        .then(function (res) {
          App.loading(false);
          App.toast('ส่งคำขอแก้ไขรอบที่ ' + res.round + ' เรียบร้อย เหลือสิทธิ์อีก ' +
            res.remaining + ' รอบ', 'ok');
          refresh();
        });
    }).catch(function (err) {
      App.loading(false);
      App.toast(err.message, 'err');
    });
  }

  function approve() {
    App.prompt({
      title: 'อนุมัติร่างชิ้นงาน',
      html: '<p style="font-size:.9rem">ยืนยันว่าร่างชิ้นงานถูกต้องครบถ้วนแล้ว ' +
        'เจ้าหน้าที่จะจัดทำไฟล์ฉบับสมบูรณ์และส่งมอบให้ต่อไป</p>' +
        '<div class="rules-box" style="font-size:.83rem">เมื่ออนุมัติแล้ว ' +
        'การขอแก้ไขเพิ่มเติมจะต้องติดต่อฝ่ายสื่อสารองค์กรโดยตรง</div>',
      okLabel: 'ยืนยันการอนุมัติ'
    }).then(function (ok) {
      if (!ok) return;
      App.loading(true, 'กำลังบันทึกการอนุมัติ...');
      return App.api('apiApproveDraft', [auth.jobId, auth.email, auth.token]).then(function (res) {
        App.loading(false);
        App.toast(res && res.alreadyApproved
          ? 'ท่านอนุมัติร่างนี้ไว้แล้ว ไม่ต้องกดซ้ำ'
          : 'บันทึกการอนุมัติเรียบร้อย ขอบคุณครับ', 'ok');
        refresh();
      });
    }).catch(function (err) {
      App.loading(false);
      App.toast(err.message, 'err');
    });
  }

  return {
    search: search, openFromLink: openFromLink, refresh: refresh,
    pickReplyFiles: pickReplyFiles, removeReplyFile: removeReplyFile, sendReply: sendReply,
    pickRating: pickRating, editRating: editRating, sendRating: sendRating,
    requestRevision: requestRevision, approve: approve
  };
})();
</script>
